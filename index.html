<style>
:root{
  --bg:#f7f3ec;--text:#2c2416;--text2:#5a4e3a;--text-muted:#6B5B4B;
  --accent:#8b5e3c;--accentL:#c4956a;--accent-red:#8B2500;
  --gold:#b8860b;--goldL:#d4a84b;--border:#d4c4a8;--border-light:#EDE8E0;
  --card:#fffdf7;--verseBg:#f0e8d8;--verseBd:#c4956a;

  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);--r:8px;
}
*{box-sizing:border-box;}
html,body{scrollbar-width:none;-ms-overflow-style:none;

html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Serif TC","Songti TC",Georgia,serif;
  font-size:20px;line-height:1.8;-webkit-touch-callout:none;}

/* 側欄 */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;background:var(--sbBg);
  color:var(--sbText);z-index:100;display:flex;flex-direction:column;align-items:center;
  padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-brand{position:sticky;top:0;width:100%;font-family:"Noto Sans TC",sans-serif;
  color:var(--gold);text-align:center;line-height:1.5;
  background:linear-gradient(to bottom,var(--sbBg) 80%,rgba(30,26,20,0));
  padding:14px 4px 12px;margin-bottom:8px;z-index:5;text-decoration:none;cursor:pointer;
  transition:color .25s;display:block;border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;}
.sb-brand .sb-brand-line2{display:block;font-size:14px;font-weight:700;letter-spacing:2px;color:var(--goldL);margin-top:2px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:3px;}
.sb-nav{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;margin-top:4px;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;
  padding:5px 4px;text-decoration:none;color:var(--sbText);transition:background .2s,color .2s;border-radius:6px;}
.sb-item:hover{background:rgba(184,134,11,.16);}
.sb-item.active{background:rgba(184,134,11,.9);color:#1e1a14;box-shadow:0 0 14px rgba(184,134,11,.5);}
.sb-item.active .sb-circle{background:#1e1a14;color:var(--goldL);border-color:#1e1a14;}
.sb-circle{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);
  display:flex;align-items:center;justify-content:center;font-family:"Noto Sans TC",sans-serif;
  font-size:16px;font-weight:600;color:var(--goldL);}
.sb-label{font-family:"Noto Sans TC",sans-serif;font-size:12px;letter-spacing:.5px;opacity:.9;text-align:center;}

/* 主區 */
.main{margin-left:var(--sbW);}
.site-hero{position:relative;background:var(--headGrad);color:#f3e9d2;text-align:center;
  padding:74px 24px 64px;overflow:hidden;}
.site-hero::before{content:"般若";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:340px;font-weight:900;color:rgba(212,168,75,.04);white-space:nowrap;pointer-events:none;}
.site-hero .hero-title{position:relative;font-size:56px;font-weight:900;color:var(--goldL);
  letter-spacing:6px;margin:0 0 18px;}
.site-hero .hero-subtitle{position:relative;font-size:21px;color:#e9dcc0;letter-spacing:2px;margin:0 0 14px;}
.site-hero .hero-sub{position:relative;font-size:17px;color:#c9b896;letter-spacing:3px;line-height:2;margin:0 auto 10px;max-width:760px;}
.site-hero .hero-range{position:relative;font-size:15px;color:#a8946f;letter-spacing:2px;margin-top:14px;}

.preface{max-width:860px;margin:46px auto 10px;padding:0 28px;}
.preface .preface-title{font-size:30px;color:var(--accent);text-align:center;letter-spacing:4px;margin:0 0 22px;font-weight:700;}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin:0 0 16px;text-indent:2em;}

.toc-section{max-width:1100px;margin:40px auto 20px;padding:0 28px;}
.toc-title{font-size:34px;color:var(--accent);text-align:center;letter-spacing:8px;margin:0 0 8px;font-weight:700;}
.toc-desc{font-size:17px;color:var(--text-muted);text-align:center;letter-spacing:2px;margin:0 0 30px;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
.toc-card{display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:18px 20px;text-decoration:none;color:var(--text);

.toc-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(91,58,41,.15);border-color:var(--gold);}
.toc-num{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans TC",sans-serif;

.toc-body{flex:1;}
.toc-name{font-size:19.5px;font-weight:700;color:var(--accent);line-height:1.6;margin:2px 0 6px;}
.toc-cn{font-size:14.5px;color:var(--text-muted);line-height:1.6;letter-spacing:.5px;}

.ch-head{background:var(--headGrad);color:#f3e9d2;text-align:center;padding:42px 24px 38px;position:relative;}
.ch-head::after{content:"";position:absolute;left:50%;bottom:20px;transform:translateX(-50%);

.ch-head .ch-num{font-size:18px;color:var(--goldL);letter-spacing:4px;font-family:"Noto Sans TC",sans-serif;margin-bottom:12px;}
.ch-head .ch-name{font-size:36px;font-weight:900;color:#f5e9cc;letter-spacing:3px;margin:0 0 10px;}
.ch-head .ch-sub{font-size:16px;color:#c9b896;letter-spacing:2px;line-height:1.9;max-width:720px;margin:0 auto;}
.ch-body{max-width:1000px;margin:0 auto;padding:28px 26px 8px;}

.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:1px solid var(--border);
  border-left:5px solid var(--gold);border-radius:10px;padding:18px 24px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);background:linear-gradient(135deg,#fdf8e8,#f2e6c8);margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:12.5px;
  background:var(--gold);color:#fff;padding:3px 13px;border-radius:12px;letter-spacing:2.2px;margin-bottom:11px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2.1;font-size:18.5px;}

.ch-frame{display:block;width:100%;border:0;background:#fffdf7;border:1px solid var(--border);
  border-radius:12px;box-shadow:0 4px 20px rgba(91,58,41,.1);margin:0 0 8px;min-height:180px;}
.next-link{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:17px;color:var(--accent);
  text-decoration:none;border:1px solid var(--gold);border-radius:24px;padding:9px 26px;margin:6px 0 8px;
  transition:background .2s,color .2s;}
.next-link:hover{background:var(--gold);color:#fff;}

.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;
  background:rgba(30,26,20,.92);color:var(--gold);padding:9px 24px;border-radius:30px;
  border:1px solid rgba(184,134,11,.5);box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;pointer-events:none;user-select:none;
  backdrop-filter:blur(6px);transition:opacity .45s ease,transform .45s ease;}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}

.read-progress .rp-label{font-size:13px;opacity:.85;letter-spacing:4px;color:var(--goldL);}

#sbToggle{display:none;}
.site-footer{background:var(--headGrad);color:#c9b896;text-align:center;padding:34px 20px;margin-top:40px;font-size:15px;letter-spacing:1px;line-height:1.9;}

@media(max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}

  #sbToggle{display:flex;position:fixed;left:14px;top:14px;z-index:130;width:42px;height:42px;
    border-radius:8px;border:0;background:var(--sbBg);color:var(--gold);font-size:20px;align-items:center;justify-content:center;cursor:pointer;}

  .ch-body{padding:20px 14px 8px;}

var rpFill=document.getElementById('rpFill'),rpPct=document.getElementById('rpPct');
function updateProgress(){
  var sh=document.documentElement.scrollHeight-window.innerHeight;
  var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;
  if(rpFill)rpFill.style.width=pct+'%';
  if(rpPct)rpPct.textContent=Math.round(pct)+'%';
}
window.addEventListener('scroll',updateProgress,{passive:true});updateProgress();

function resizeFrame(f){
  try{
    var d=f.contentDocument||f.contentWindow.document; if(!d||!d.body)return;
    d.body.style.minHeight='0';d.body.style.height='auto';
    if(d.documentElement){d.documentElement.style.minHeight='0';d.documentElement.style.height='auto';}
    var h=d.body.scrollHeight;
    if(h>100){f.style.height=h+'px';f.style.minHeight='0';}
  }catch(e){}
}
function resizeAllFrames(){
  document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
  if(typeof updateProgress==='function')updateProgress();
}
function setupFrame(f){
  var tries=0;
  function tick(){tries++;resizeFrame(f);if(tries<30)setTimeout(tick,200);}
  if(f.contentDocument&&f.contentDocument.readyState==='complete')tick();
  else f.addEventListener('load',tick);
}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resizeAllFrames,200);});
document.addEventListener('click',function(e){
  var a=e.target;while(a&&a.tagName!=='A')a=a.parentElement;if(!a)return;
  var h=a.getAttribute('href');if(!h||h.charAt(0)!=='#'||h.length<2)return;
  var id=h.substring(1);var el=document.getElementById(id);if(!el)return;
  e.preventDefault();resizeAllFrames();
  setTimeout(function(){
    resizeAllFrames();var rect=el.getBoundingClientRect();
    var y=window.scrollY+rect.top-14;window.scrollTo({top:y,behavior:'smooth'});
  },60);
},true);
var _rt=0,_riv=setInterval(function(){_rt++;resizeAllFrames();if(_rt>50)clearInterval(_riv);},300);

// 側欄高亮
var items=[].slice.call(document.querySelectorAll('.sb-item'));
var secs=items.map(function(a){return document.getElementById(a.getAttribute('href').substring(1));});
function highlight(){
  var idx=-1,vh=window.innerHeight;
  for(var i=0;i<secs.length;i++){if(secs[i]&&secs[i].getBoundingClientRect().top<vh*0.35)idx=i;}
  items.forEach(function(a,i){a.classList.toggle('active',i===idx);});
}
window.addEventListener('scroll',highlight,{passive:true});highlight();

// sb-brand 回頂
var sbBrand=document.getElementById('sbBrand');
if(sbBrand)sbBrand.addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});
// 漢堡
var sbToggle=document.getElementById('sbToggle'),sb=document.getElementById('sb');
if(sbToggle)sbToggle.addEventListener('click',function(){sb.classList.toggle('open');});
// 回頂按鈕
var backTop=document.getElementById('backTop');
window.addEventListener('scroll',function(){backTop.style.display=window.scrollY>600?'block':'none';},{passive:true});
backTop.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});

// 接近頁尾淡出進度膠囊
(function(){
  var cap=document.getElementById('readProgress');if(!cap)return;
  function setHide(on){cap.classList.toggle('hide-near-end',!!on);}
  var f=document.querySelector('.site-footer');if(!f)return;
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){setHide(es.some(function(e){return e.isIntersecting;}));},
      {root:null,rootMargin:'0px 0px -20px 0px',threshold:0.01});
    io.observe(f);
  }else{
    window.addEventListener('scroll',function(){
      var dh=document.documentElement.scrollHeight,sb2=window.scrollY+window.innerHeight;
      setHide(dh-sb2<240);
    },{passive:true});
  }
})();

// 外層防複製
(function(){
  var blk=function(e){e.preventDefault();return false;};
  ['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){document.addEventListener(ev,blk,true);});
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(e.ctrlKey&&'cCaAsSpPuUxX'.indexOf(k)>=0)blk(e);
    if(k==='F12')blk(e);
    if(e.ctrlKey&&e.shiftKey&&'IJCK'.indexOf(k)>=0)blk(e);
  },true);
})();
</script>

<script id="wy-print-intercept">
(function(){
  try{ window.print = function(){}; }catch(e){}
  document.addEventListener("keydown", function(e){
    if((e.metaKey||e.ctrlKey) && (e.key==="p"||e.key==="P"||e.keyCode===80)){
      e.preventDefault(); e.stopPropagation();
      return false;
    }
  }, true);
})();
</script>
<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-dazhidulun-89-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
