&lt;section class=&quot;chapter&quot; id=&quot;chapter-1&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷 八 十 九 · 第 一 品 · 第 一 章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;論主前題與雙重透鏡&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;From Conditioned Cognition to the Two Truths Synthesis&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;span class=&quot;bridge-label&quot;&gt;本 章 要 旨&lt;/span&gt;
&lt;p&gt;本章作為全品的鋪墊，先建立兩件事：（一）本品的論文邏輯主軸——「從果報生識到二諦圓融的辯證拓撲」；（二）讀懂本品的鑰匙——「二諦透鏡」與「中觀解構的四大支柱」。讀者不必先記熟所有概念，只要在後續七章中隨時回看本章的四大支柱，就能掌握龍樹論證的整體節奏。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　論文導言 · 從果報生識到二諦圓融&lt;/h2&gt;
&lt;p&gt;本品的問答看似零散——從「識滿足為何在隨形好中」起頭，中間穿插「足安立住處」、「四十二字義」、「諸法畢竟空菩薩何以說法」、「法性與諸法異不」——但若以中觀論文的眼光重組，這些問答其實是&lt;strong&gt;同一條辯證軸線&lt;/strong&gt;的五個切片：&lt;/p&gt;
&lt;div class=&quot;domino-chain&quot;&gt;
&lt;div class=&quot;domino&quot;&gt;果報生識&lt;/div&gt;&lt;span class=&quot;chain-arrow&quot;&gt;→&lt;/span&gt;
&lt;div class=&quot;domino&quot;&gt;足安立&lt;/div&gt;&lt;span class=&quot;chain-arrow&quot;&gt;→&lt;/span&gt;
&lt;div class=&quot;domino&quot;&gt;四十二字&lt;/div&gt;&lt;span class=&quot;chain-arrow&quot;&gt;→&lt;/span&gt;
&lt;div class=&quot;domino&quot;&gt;化人說法&lt;/div&gt;&lt;span class=&quot;chain-arrow&quot;&gt;→&lt;/span&gt;
&lt;div class=&quot;domino&quot;&gt;法性不異&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;從&lt;strong&gt;身體&lt;/strong&gt;（隨形好之識具足）切到&lt;strong&gt;定根&lt;/strong&gt;（足安立），再從定根切到&lt;strong&gt;語言&lt;/strong&gt;（四十二字），由語言推到&lt;strong&gt;說法悖論&lt;/strong&gt;（畢竟空何以說法），最後落在&lt;strong&gt;法性與諸法之關係&lt;/strong&gt;。每一切片都是「世諦現象」與「第一義空」的辯證對話。整條軸線指向同一終點：&lt;strong&gt;菩薩在不轉法性的前提下為眾生說法&lt;/strong&gt;。&lt;/p&gt;
&lt;h2&gt;第二節　二諦透鏡 · 讀取本品的雙重維度&lt;/h2&gt;
&lt;p&gt;論文提出的核心閱讀方法是「二諦透鏡」（Two Truths Lens）——任何一段問答都必須同時用兩面鏡子讀：&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;世 諦 透 鏡（俗諦）&lt;/div&gt;
&lt;p&gt;讀「現象怎麼運作」。果報生識是緣起相依、可被觀察、可被分類的世間心理事實；菩薩用語言度眾是可見的外相行為。世諦不是「假的」，而是「有條件成立」的。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;第 一 義 透 鏡（真諦）&lt;/div&gt;
&lt;p&gt;讀「現象的實相」。同一個果報識，從本性看畢竟空、無自性；同一場說法，從實相看「無說無聽」。真諦不否定世諦，而是揭示其無自性的底色。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;為什麼必須雙鏡並用？&lt;/div&gt;
&lt;p&gt;單用世諦讀，會把果報生識當實有的心法——落入&lt;strong&gt;常見&lt;/strong&gt;；單用真諦讀，會把菩薩說法當無意義的虛言——落入&lt;strong&gt;斷見&lt;/strong&gt;。本品所有問答之所以反覆糾纏，正是因為龍樹要逼讀者習慣&lt;strong&gt;同時持兩鏡讀同一句經文&lt;/strong&gt;。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　中觀解構的四大支柱&lt;/h2&gt;
&lt;p&gt;論文提出，本品的辯證可以歸納為中觀邏輯的四大解構支柱。每根支柱都會在後續章節以一組獨立的問答展開：&lt;/p&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;&lt;span class=&quot;cell-num&quot;&gt;①&lt;/span&gt;身心不二的果報論&lt;/div&gt;
&lt;p&gt;處理「識滿足／足安立」一組——從生理（十月處胎）的硬體配置，推到心理（識具足）的圓滿，再推到禪定根基（足安立）的不動。&lt;br/&gt;&lt;em&gt;對應：第二、第三章&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;&lt;span class=&quot;cell-num&quot;&gt;②&lt;/span&gt;語言解構的實相觀&lt;/div&gt;
&lt;p&gt;處理「四十二字義」一組——從「一字盡入諸字」的遞迴邏輯，推到「諸法義中諸法無名字」的實相無名。&lt;br/&gt;&lt;em&gt;對應：第四章&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;&lt;span class=&quot;cell-num&quot;&gt;③&lt;/span&gt;悲智雙運的幻化行&lt;/div&gt;
&lt;p&gt;處理「諸法畢竟空云何說法」一組——以「化人為化眾說法」的隱喻，化解語言與實相的悖論。&lt;br/&gt;&lt;em&gt;對應：第五、第六章&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;&lt;span class=&quot;cell-num&quot;&gt;④&lt;/span&gt;體用一如的二諦觀&lt;/div&gt;
&lt;p&gt;處理「法性與諸法異不」一組——以「色即是法性，世諦故有分別」的二諦圓融矩陣統攝全品。&lt;br/&gt;&lt;em&gt;對應：第七章&lt;/em&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;&lt;strong&gt;四大支柱的關係不是並列，而是遞進：&lt;/strong&gt;身心不二（基礎本體）→ 語言解構（認知方法）→ 悲智雙運（行動原則）→ 體用一如（最終統攝）。第八章將以「中觀宏觀全景圖」收束此四支柱。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;chapter&quot; id=&quot;chapter-2&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷 八 十 九 · 第 一 品 · 第 二 章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;果報生識 · 身心不二的拓撲重構&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;Vipāka-vijñāna and the Topology of Body-Mind Inseparability&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;span class=&quot;bridge-label&quot;&gt;本 章 要 旨&lt;/span&gt;
&lt;p&gt;本章對應原典第一組問答：「八十隨形好是莊嚴身法，識滿足何以在隨形好中？」龍樹的答覆把心法問題巧妙轉成&lt;strong&gt;身體拓撲學&lt;/strong&gt;——識具足之所以能列入身相隨形好，是因為佛陀的果報識本身就是「身根具足」的硬體外顯。本章用論文的「身心不二支柱」解讀此處的緣起相依與性空雙觀。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　問曰 · 識滿足何以在隨形好中？&lt;/h2&gt;
&lt;p class=&quot;text-label&quot;&gt;原 典&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;&lt;strong&gt;問曰：&lt;/strong&gt;八十隨形好是莊嚴身法，「識滿足」何以在隨形好中？&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;答曰：&lt;/strong&gt;此識是果報生識，世間好醜自然而知。凡人識不具足故，學人法乃知；佛一歲具足滿乃生故，身、識皆具足。餘人若八月、若九月處胎，總言十月；菩薩處胎十月，總得一歲，身根具足故，果報得識亦具足。&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;須菩提的疑問點直指要害：八十隨形好屬「莊嚴身法」（身體層面），而「識滿足」明明是心法，為何被列入身相之中？這個跨界的歸類，本身就是龍樹要展開的辯證起點。&lt;/p&gt;
&lt;h2&gt;第二節　果報生識的義理 · 異熟果報識&lt;/h2&gt;
&lt;p&gt;論文提出一個關鍵的概念區分——本處所說的「識」&lt;strong&gt;不是&lt;/strong&gt;一般學佛常聽到的：&lt;/p&gt;
&lt;div class=&quot;three-col&quot;&gt;
&lt;div class=&quot;col&quot;&gt;&lt;div class=&quot;col-title&quot;&gt;非 造 作 因 識&lt;/div&gt;&lt;p&gt;即一般所謂第六意識的分別作意，需要學習、推理、決擇。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;col&quot;&gt;&lt;div class=&quot;col-title&quot;&gt;非 般 若 慧&lt;/div&gt;&lt;p&gt;即觀照空性的智慧，那是修證的成就，不是生來具足。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;col&quot;&gt;&lt;div class=&quot;col-title&quot;&gt;是 異 熟 果 報 識&lt;/div&gt;&lt;p&gt;前世功德所感召的「自然硬知能力」，無學自知世間好醜。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;論文核心命題：「生理的器量決定心理的圓滿」&lt;/div&gt;
&lt;p&gt;佛陀&lt;strong&gt;處胎滿一歲&lt;/strong&gt;（菩薩處胎十月得一歲，身根具足）→ 身體硬體拓撲達到「圓滿配置」→ 果報得識亦具足。這是緣起相依的硬性對應：身根具足是因，識具足是果報。識滿足之所以列入隨形好，正是因為它是身根圓滿的&lt;strong&gt;必然顯化&lt;/strong&gt;。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　凡聖認知的維度差異&lt;/h2&gt;
&lt;p&gt;論文以「拓撲差異」一語形容凡夫與佛陀的認知：&lt;/p&gt;
&lt;div class=&quot;spectrum&quot;&gt;
&lt;div class=&quot;sp-node sp-left&quot;&gt;
&lt;h5&gt;凡 夫&lt;/h5&gt;
&lt;small&gt;識不具足&lt;br/&gt;需學人法乃知&lt;/small&gt;
&lt;/div&gt;
&lt;div class=&quot;sp-node sp-mid&quot;&gt;
&lt;h5&gt;學 人&lt;/h5&gt;
&lt;small&gt;修學中&lt;br/&gt;知識結構部份建立&lt;/small&gt;
&lt;/div&gt;
&lt;div class=&quot;sp-node sp-right&quot;&gt;
&lt;h5&gt;佛 陀&lt;/h5&gt;
&lt;small&gt;果報生識&lt;br/&gt;世間好醜自然而知&lt;/small&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;注意這不是&lt;strong&gt;程度&lt;/strong&gt;的差異，而是&lt;strong&gt;維度&lt;/strong&gt;的差異——凡夫的認知必須走「學習→記憶→推理→判斷」的串列邏輯；佛陀的果報識則是「並聯式直觀」，因為這是身根具足所感召的硬體能力，不必經過任何中介。&lt;/p&gt;
&lt;h2&gt;第四節　身心相依與身識如幻的重構&lt;/h2&gt;
&lt;p&gt;論文圖示頁的核心觀點是：同一個果報生識，必須以世俗觀與勝義觀雙鏡並讀。&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;世 俗 觀&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;依根發識，果報不失。&lt;/strong&gt;身根→意根→果報識，是堅實的緣起鏈，不能說斷。生理器量決定心理圓滿，是世諦中可被觀察的事實。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;勝 義 觀&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;識不異色，無著即菩提。&lt;/strong&gt;同一條鏈在實相中是虛線——身識相依如幻，無一可作主之自性。佛果報識的具足，本性畢竟空。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;世俗觀說「滿胎得滿身，滿身得滿識」（緣起故）——這是承認因果不失；勝義觀說「諸識無自性，無著即菩提」（性空故）——這是揭示果報識當體即空。&lt;strong&gt;兩面同時成立，不相妨礙&lt;/strong&gt;，這正是論文所謂「身心不二的拓撲重構」。&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;因此「識滿足」歸入隨形好不只合理，更是龍樹刻意要讓讀者學會的一種讀經方式——&lt;strong&gt;看到一個「心法」名相時，先想它有沒有對應的身體拓撲；看到一個「身相」名相時，先想它有沒有對應的識量配置。&lt;/strong&gt;身心從來不是兩套系統。&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;chapter&quot; id=&quot;chapter-3&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷 八 十 九 · 第 一 品 · 第 三 章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;足安立住處 · 動轉不可動的禪定根基&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;The Stability of the Standing-Posture and the Indestructible Samādhi&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;span class=&quot;bridge-label&quot;&gt;本 章 要 旨&lt;/span&gt;
&lt;p&gt;承上一章「身根具足」，本章接續處理身體層的另一個微妙區別：「足安立住處」與「安住處」何異？這看似小辯，但論文點出此處正是論文「身心不二支柱」延伸到&lt;strong&gt;禪定根基&lt;/strong&gt;的關鍵——身體的安立不只是物理姿勢，而是「魔民惡鬼無能動轉令退敗」的菩提道根基。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　問曰 · 足安立與安住處之別&lt;/h2&gt;
&lt;p class=&quot;text-label&quot;&gt;原 典&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;&lt;strong&gt;問曰：&lt;/strong&gt;足安立住處與安住處何異？&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;答曰：&lt;/strong&gt;住處安者，如白衣勇士，牢持器仗，安據住處，則不可動。又出家時，魔民、惡鬼無能動轉令退敗者。&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;這個提問乍看是文字辨析，實則是要分辨「&lt;strong&gt;住處本身的安&lt;/strong&gt;」和「&lt;strong&gt;住於該處的人之安&lt;/strong&gt;」兩個微妙不同的層次。&lt;/p&gt;
&lt;h2&gt;第二節　白衣勇士的隱喻 · 牢持器仗&lt;/h2&gt;
&lt;p&gt;龍樹以白衣勇士為譬：&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;白 衣 勇 士&lt;small&gt;（喻佛菩薩之身根）&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;牢 持 器 仗&lt;small&gt;（喻三十七道品的修證武裝）&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;安 據 住 處&lt;small&gt;（喻足安立的禪定座基）&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;則 不 可 動&lt;small&gt;（喻菩提心不退轉）&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;論文解讀此譬喻：足安立住處不是地理位置，而是&lt;strong&gt;身體姿勢、修證武裝、禪定根基三者俱足之處&lt;/strong&gt;。三者一旦俱足，此處便有「不可動性」。&lt;/p&gt;
&lt;h2&gt;第三節　魔民惡鬼無能動轉&lt;/h2&gt;
&lt;p&gt;第二段答語接著說「&lt;strong&gt;又出家時，魔民、惡鬼無能動轉令退敗者&lt;/strong&gt;」——這是把「足安立」的不動，從靜態（坐禪）擴展到動態（出家行道）。&lt;/p&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;論文觀點：「足安立」是中觀圖式的「舞台」&lt;/div&gt;
&lt;p&gt;後續第八章將揭示，論文在「中觀宏觀全景圖」中把&lt;strong&gt;足安立 = 舞台 = 定&lt;/strong&gt;。一切說法、化人、二諦辯證都在這個「不動的舞台」上演。沒有足安立，悲智雙運便無立足之處；沒有禪定根基，語言解構與化人說法都成空談。&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;因此本章雖然原典文字最短，卻在整個論文邏輯中佔據「&lt;strong&gt;底盤&lt;/strong&gt;」的位置——從第二章的身根（果報識具足）到本章的足根（禪定不可動），是龍樹為後續章節鋪設的身體與定力雙重底基。&lt;/p&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;身根具足（第二章）+ 足安立（第三章）= 身心不二支柱的完整奠基。從第四章起，論文將從身體切換到語言，但讀者必須記住：所有語言的辯證，都仍然站在「足安立」的禪定基礎上。離了這個基礎，任何「畢竟空」的言說都會淪為虛無。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;chapter&quot; id=&quot;chapter-4&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷 八 十 九 · 第 一 品 · 第 四 章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;四十二字義 · 語言解構的遞迴邏輯&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;The 42-Letters Gate and the Recursive Deconstruction of Names&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;span class=&quot;bridge-label&quot;&gt;本 章 要 旨&lt;/span&gt;
&lt;p&gt;本章是論文「語言解構支柱」的核心。從身體層（第二、三章）切換到語言層，龍樹此處引入《摩訶衍》的「四十二字門」概念，並提出兩個方向相反卻互補的遞迴邏輯：「一字盡入諸字」與「四十二字入一字」。最終導出「&lt;strong&gt;諸法義中諸法無名字&lt;/strong&gt;」這個實相命題。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　一字盡入諸字 · 入定的拓撲學&lt;/h2&gt;
&lt;p class=&quot;text-label&quot;&gt;原 典&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;四十二字義，如摩訶衍中說。一字盡入諸字者，譬如兩一合故為二，三一故為三，四一為四，如是乃至千萬。又如阿字為定，阿變為羅，亦變為波；如是盡入四十二字。&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;論文指出，這段文字看似在講字母排列組合，實則建立了一個拓撲對應：&lt;/p&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;&lt;span class=&quot;cell-num&quot;&gt;①&lt;/span&gt;數量遞迴&lt;/div&gt;
&lt;p&gt;「兩一合為二，三一為三」——所有數字皆由「一」反覆組合而成，「一」是所有數的拓撲祖先。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;&lt;span class=&quot;cell-num&quot;&gt;②&lt;/span&gt;音變遞迴&lt;/div&gt;
&lt;p&gt;「阿字為定，阿變為羅，亦變為波」——所有音節皆是「阿」的變相，「阿」是所有字的拓撲祖先。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;&lt;span class=&quot;cell-num&quot;&gt;③&lt;/span&gt;語意遞迴&lt;/div&gt;
&lt;p&gt;四十二字是大乘佛教的字母義門，每一字含一切義，故說「一字盡入諸字」。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;&lt;span class=&quot;cell-num&quot;&gt;④&lt;/span&gt;定境遞迴&lt;/div&gt;
&lt;p&gt;「阿字為定」一語透露：四十二字義門本身就是禪定境界的字音化，與第三章足安立的禪定基礎相呼應。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　四十二字入一字 · 阿字遞迴&lt;/h2&gt;
&lt;p class=&quot;text-label&quot;&gt;原 典&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;四十二字入一字者，四十二字盡有阿分，阿分還入阿中。&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;反方向的遞迴：每一字都含「阿」這個共同元素，所有「阿分」最終回流到單一「阿」字。這是大乘字母義門的典型表述：「&lt;strong&gt;阿者，無生義也&lt;/strong&gt;」——一切字都是「無生」的變現，最終都歸於「無生」。&lt;/p&gt;
&lt;div class=&quot;flow&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;阿（無生）&lt;small&gt;本源&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;42 字音&lt;small&gt;派生&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;一切名相&lt;small&gt;應用&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;回歸阿字&lt;small&gt;實相&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　從假名到實相 · 善知字到善知法義&lt;/h2&gt;
&lt;p class=&quot;text-label&quot;&gt;原 典&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;善知字故，善知諸法名；善知諸法名故，善知諸法義。無字即是諸法實相義。所以者何？諸法義中，諸法無名字。&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;這段是論文圖示頁「&lt;strong&gt;從假名到實相的解構方程式&lt;/strong&gt;」的根本依據。龍樹在此構造了一個四階下降的解構鏈：&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;善 知 字（拓撲祖先 · 阿）&lt;small&gt;從 42 字門入&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;善 知 諸 法 名&lt;small&gt;由字組成名相，能解經教&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;善 知 諸 法 義&lt;small&gt;由名相通達義理，能解論議&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;諸 法 無 名 字（無字即實相）&lt;small&gt;義理徹底處，名字本不立&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第四節　諸法義中諸法無名字&lt;/h2&gt;
&lt;p&gt;論文認為這是整個語言解構支柱的「拋物線頂點」——龍樹刻意把讀者一路引上「善知字、善知名、善知義」的階梯，到了階梯頂端，卻翻過來說「&lt;strong&gt;諸法義中諸法無名字&lt;/strong&gt;」。&lt;/p&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;這是中觀辯證的典型「自我推翻」結構&lt;/div&gt;
&lt;p&gt;不是說名字無用——若無用就不必教四十二字；也不是說名字有用——若有用便該止於善知名義。龍樹要讀者學會「&lt;strong&gt;用名字到名字消融處&lt;/strong&gt;」：名相是通往實相的舟筏，到岸便要捨。&lt;br/&gt;&lt;br/&gt;此處的「無字即是諸法實相義」並非反語言、反經教，而是揭示&lt;strong&gt;語言的極限&lt;/strong&gt;——語言可以指向實相，但實相本身不在任何字裡。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;這個「諸法無名字」的命題，立刻引發第五章的關鍵悖論：&lt;strong&gt;既然實相無名，菩薩為何還要動用語言、神通度化眾生？這不是自相矛盾嗎？&lt;/strong&gt;——這正是須菩提下一段問難的引爆點。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;chapter&quot; id=&quot;chapter-5&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷 八 十 九 · 第 一 品 · 第 五 章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;悲智雙運 · 化人說法的悖論解構&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;Compassion-Wisdom Synthesis: Dissolving the Speech-Reality Paradox&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;span class=&quot;bridge-label&quot;&gt;本 章 要 旨&lt;/span&gt;
&lt;p&gt;本章是論文「悲智雙運支柱」的核心，篇幅最長，原典問答最密集。第四章「諸法無名字」一句拋出後，須菩提立刻提出兩個前題的衝突：A. 諸法畢竟空、無名字、無眾生；B. 菩薩住果報六神通為眾生說法。如果 A 為真，B 何以可能？龍樹以「化人為化眾說法」的終極隱喻化解此悖論——這正是論文圖示頁反覆強調的「&lt;strong&gt;接通悖論的節點&lt;/strong&gt;」。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　須菩提的核心質問&lt;/h2&gt;
&lt;p class=&quot;text-label&quot;&gt;原 典&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;須菩提問：「若諸法畢竟空無名字，云何菩薩住果報六神通，為眾生說諸法？若畢竟無眾生，則無有法！」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;論文把這個問題形式化為兩個衝突的前題：&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;前 題 A · 實 相 真 諦&lt;/div&gt;
&lt;p&gt;諸法畢竟空 · 無眾生 · 無名字。一切說法的對象（眾生）與工具（名字）都不可得。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;前 題 B · 菩 薩 行 願&lt;/div&gt;
&lt;p&gt;菩薩住果報六神通，為眾生說諸法。這是菩薩道的存在前提，不容否認。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;若兩前題都成立 → 矛盾爆炸：A 否定 B 的對象，B 預設 A 不成立。這個悖論不化解，整個大乘菩薩道都會在邏輯上塌陷。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　佛說十八空 · 我眾生皆空&lt;/h2&gt;
&lt;p class=&quot;text-label&quot;&gt;原 典&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;佛可須菩提言：「如是！以十八空故，一切法不可得，我、眾生乃至知者、見者，乃至當知佛、菩薩皆空。如是知已，而為眾生說是空法。」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;佛陀的回答出人意表——他不否認須菩提的前題 A，反而&lt;strong&gt;加碼承認&lt;/strong&gt;：不只眾生空，連菩薩、佛、知者、見者統統空。然後筆鋒一轉：「如是知已，而為眾生說是空法。」&lt;/p&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;關鍵轉折：「知是空 → 為眾說空」&lt;/div&gt;
&lt;p&gt;悖論不靠否認 A 來化解，而靠看清 B 的「眾生」與 A 的「眾生空」其實是&lt;strong&gt;同一句話的兩面&lt;/strong&gt;。&lt;br/&gt;&lt;br/&gt;「以眾生空，但從顛倒有，是故菩薩不失於空而為說法。」——眾生不是實有，但也不是斷無；眾生「從顛倒而有」（世諦），其本性畢竟空（真諦）。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　眾生顛倒的悖論節點&lt;/h2&gt;
&lt;p&gt;論文把「眾生顛倒」標識為「&lt;strong&gt;接通悖論的節點&lt;/strong&gt;」——這是整個論證的拓撲樞紐：&lt;/p&gt;
&lt;div class=&quot;triangle-diagram&quot;&gt;
&lt;div class=&quot;tri-node&quot;&gt;前題 A&lt;br/&gt;諸法畢竟空&lt;/div&gt;
&lt;div class=&quot;tri-node&quot; style=&quot;background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;border-color:var(--accent);&quot;&gt;眾生顛倒&lt;br/&gt;節點&lt;/div&gt;
&lt;div class=&quot;tri-node&quot;&gt;前題 B&lt;br/&gt;菩薩說空法&lt;/div&gt;
&lt;div class=&quot;tri-conclusion&quot;&gt;「以眾生空，但從顛倒有」——A 與 B 在「顛倒有」這個世諦層面接通&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;菩薩說法的對象不是「實有的眾生」（A 否定），而是「顛倒所現的眾生」（從顛倒有）。所說的內容也不是「實有的空」（若有「空」可說，便失空相），而是「對治顛倒的方便說」。&lt;/p&gt;
&lt;h2&gt;第四節　病與藥的同源相對性&lt;/h2&gt;
&lt;p&gt;論文用一個清晰的雙箭頭結構表達：&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;眾 生 的 執 有（病）&lt;/div&gt;
&lt;p&gt;從顛倒中生起對「我、眾生、諸法實有」的執著。這是病。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;菩 薩 的 說 空（藥）&lt;/div&gt;
&lt;p&gt;對治此執著而說「畢竟空」。這是藥。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;p&gt;&lt;strong&gt;「若眾生實有而說空，是則不可；以眾生空，但從顛倒有，故可拔除。」&lt;/strong&gt;——病若實有，藥便落空；正因病只是顛倒所現，藥才能對治。藥與病本是「&lt;strong&gt;同源相對&lt;/strong&gt;」的一對。&lt;/p&gt;
&lt;/div&gt;
&lt;p class=&quot;text-label&quot;&gt;補 述 · 不 失 空 相&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;不失者，不作諸法皆空，所說不空；若以所說不空，則為失空相；若口說空而心是有，是亦為失。此中佛自說：「不二，不壞法相故。」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;菩薩在說空時，必須&lt;strong&gt;內外一致地住於空&lt;/strong&gt;——口說、意持、所對皆空，三者不二。否則便墮入「用實有來說空」或「口空心有」的虛偽境地。&lt;/p&gt;
&lt;h2&gt;第五節　化人為化眾說法的終極隱喻&lt;/h2&gt;
&lt;p class=&quot;text-label&quot;&gt;原 典&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;欲明了是事，說譬喻：「如佛所化作化人，而為說法，持戒、布施諸功德。」若以如是方便說法，是則無咎。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;這是整品最精彩的隱喻&lt;/div&gt;
&lt;p&gt;佛以神通化作一個「化人」——這個化人本身是空的（佛所化）；化人為「化眾」（被化的眾生本身也是空的）說法，所說的「持戒、布施、諸功德」本身也是空的。&lt;br/&gt;&lt;br/&gt;&lt;strong&gt;三輪皆空：說法者空、受法者空、所說法空。&lt;/strong&gt;但這場「全空的法會」並不因此停止——它仍照常進行，仍照常拔除眾生顛倒，仍照常成就功德。這就是「不失空相而能度眾」的可能性結構。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;佛 化 作 化 人&lt;small&gt;能說者本空&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;化 人 為 化 眾 說 法&lt;small&gt;所對者本空&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;說 持 戒 布 施 諸 功 德&lt;small&gt;所說者本空&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;無 縛 無 解 · 本 無 實 體&lt;small&gt;說法事業圓滿無咎&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第六節　色不縛不解 · 第一義無縛解&lt;/h2&gt;
&lt;p class=&quot;text-label&quot;&gt;原 典&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;則能拔出眾生於顛倒，無縛無解故。第一義中無縛無解，世諦故有縛有解。此中佛自說因緣：「色不縛不解。何以故？是不縛不解中，無色相故。乃至識亦如是。」&lt;br/&gt;&lt;br/&gt;菩薩如是用不住法故，住空法中為眾生說法；眾生不可得，眾生及一切法不可得故。&lt;br/&gt;&lt;br/&gt;此中佛自說因緣，所謂無所有法不住無所有，譬如虛空不住虛空。自性法不住自性法，譬如火不住火中。他性法不住他性法，譬如水性中無火性，又他性不定故。&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;本節是「化人說法」的義理收束。論文要點：&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;第一義中無縛無解&lt;/strong&gt;——實相層面，無有「被縛之眾生」，亦無「能解之菩薩」。&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;世諦故有縛有解&lt;/strong&gt;——但在世間因緣中，眾生確有顛倒纏縛，菩薩確有開解之行。&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;不住法為住空法&lt;/strong&gt;——菩薩以「不住於任何法」的方式，住於空性中為眾生說法。&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;三不住譬喻&lt;/strong&gt;——虛空不住虛空（無所有法）／火不住火（自性法）／水中無火（他性法）。三者皆指向「無有自體可作住處」的空義。&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;到此本章悖論完全化解：A（畢竟空）與 B（菩薩說法）非但不矛盾，且是&lt;strong&gt;同一個實相&lt;/strong&gt;的兩面表述。實相「無縛無解」是 A，世諦「有縛有解」是 B。菩薩之所以能說法無咎，正因他始終&lt;strong&gt;用 A 的眼睛做 B 的事&lt;/strong&gt;。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;chapter&quot; id=&quot;chapter-6&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷 八 十 九 · 第 一 品 · 第 六 章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;三解脫門 · 說法無咎的條件&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;The Three Doors of Liberation as Preconditions of Faultless Teaching&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;span class=&quot;bridge-label&quot;&gt;本 章 要 旨&lt;/span&gt;
&lt;p&gt;承上章「化人說法」隱喻，本章補完最後一塊拼圖——菩薩說法之所以「無咎」（無過、無失），並不因為他「會」說法，而是因為他的內心狀態合於三解脫門：空、無相、無作。論文圖示頁明確點出：「&lt;strong&gt;不著一切法、皆寂滅相、不轉法性&lt;/strong&gt;」是說法無咎的三條件。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　菩薩於諸佛賢聖無有過&lt;/h2&gt;
&lt;p class=&quot;text-label&quot;&gt;原 典&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;若能如是清淨說法，是菩薩於諸佛賢聖則無有過。何以故？諸佛、賢聖不著一切法，說法者亦不著一切法。諸佛、賢聖以畢竟空、皆寂滅相為心所行，說法者亦如是。諸佛、賢聖入三解脫門，得一切法實性，所謂無餘涅槃；說法者隨是法故，無咎。&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;「無有過」三字是關鍵——菩薩說法不會違背諸佛賢聖的法度，根源不在說了什麼內容，而在&lt;strong&gt;說法者的心境與諸佛賢聖等同&lt;/strong&gt;。&lt;/p&gt;
&lt;h2&gt;第二節　不著一切法 · 入三解脫門&lt;/h2&gt;
&lt;p&gt;論文把「不著一切法 / 皆寂滅相 / 不轉法性」三句解讀為三解脫門在說法情境中的展現：&lt;/p&gt;
&lt;div class=&quot;three-col&quot;&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;空 解 脫 門&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;不著一切法&lt;/strong&gt;——所說之法、所對之眾、能說之人，三者於心不著一塵。一切法當體即空。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;無 相 解 脫 門&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;皆寂滅相為心所行&lt;/strong&gt;——心不取任何相為說法之依據；一切相寂滅，方堪說無相之法。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;無 作 解 脫 門&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;不轉法性，法性空無相&lt;/strong&gt;——說法不以「我有功德可作」為動機；法性本如，菩薩順之而說，非有所造作。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　法性空無相 · 不轉法性&lt;/h2&gt;
&lt;p&gt;「不轉法性」一語點出本章與第七章的銜接點。論文圖示頁特別強調這一句的兩層意義：&lt;/p&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;&lt;span class=&quot;cell-num&quot;&gt;①&lt;/span&gt;消極義：不能轉&lt;/div&gt;
&lt;p&gt;法性本來不可被言說、不可被改造。任何菩薩、任何說法都改變不了法性的「空無相」本質。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;&lt;span class=&quot;cell-num&quot;&gt;②&lt;/span&gt;積極義：不應轉&lt;/div&gt;
&lt;p&gt;菩薩說法時，應主動順應法性，不刻意違逆。順而說之，便是說法無咎；違而說之，便落入有為造作。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;p&gt;&lt;strong&gt;「不轉法性」是說法者與所說法的同體保證。&lt;/strong&gt;說法者不須求法性，因法性即是說法者所安住的本來面目；所說法不須立法性，因法性即是諸法本來如此。從此說與不說、有言與無言，都不離法性。&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;本章雖短，卻在論文中扮演&lt;strong&gt;悲智雙運支柱&lt;/strong&gt;到&lt;strong&gt;體用一如支柱&lt;/strong&gt;的橋梁。下一章（第七章）將以「法性與諸法不異」直接統攝體用，把整品收歸於二諦圓融。&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;chapter&quot; id=&quot;chapter-7&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷 八 十 九 · 第 一 品 · 第 七 章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;法性與諸法不異 · 體用一如的二諦圓融&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;Dharmatā and Phenomena: The Non-Dual Synthesis of the Two Truths&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;span class=&quot;bridge-label&quot;&gt;本 章 要 旨&lt;/span&gt;
&lt;p&gt;本章對應原典最後一組問答（第 17-22 段），是論文「體用一如支柱」的核心。須菩提連續三問：（1）法性與諸法異不異？（2）若不異，為何特別貴重法性？（3）若不異，分別善惡白黑須陀洹等果位從何而來？佛陀以「&lt;strong&gt;世諦故有分別、第一義中無分別&lt;/strong&gt;」一錘定音，建立論文所稱的「二諦圓融矩陣」。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　須菩提問 · 法性與色等諸法異不？&lt;/h2&gt;
&lt;p class=&quot;text-label&quot;&gt;原 典&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;須菩提問：「若不轉法性，色等諸法與法性異不？」&lt;br/&gt;佛答：「不也！何以故？色等諸法實相即是法性故。」&lt;br/&gt;佛意：以菩薩說法時，亦不壞法性。&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;須菩提承上章「不轉法性」追問：那麼法性與色受想行識這些「現象法」到底是同還是異？佛陀斬釘截鐵：&lt;strong&gt;不異&lt;/strong&gt;——「色等諸法實相即是法性故」。&lt;/p&gt;
&lt;h2&gt;第二節　佛答 · 色等諸法實相即是法性&lt;/h2&gt;
&lt;p&gt;論文圖示頁以「&lt;strong&gt;色即是法性&lt;/strong&gt;」一語表達此體用一如的核心：&lt;/p&gt;
&lt;div class=&quot;spectrum&quot;&gt;
&lt;div class=&quot;sp-node sp-left&quot;&gt;&lt;h5&gt;色 法&lt;/h5&gt;&lt;small&gt;現象界&lt;br/&gt;諸法&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;sp-node sp-mid&quot;&gt;&lt;h5&gt;實 相&lt;/h5&gt;&lt;small&gt;體用一如&lt;br/&gt;不一不異&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;sp-node sp-right&quot;&gt;&lt;h5&gt;法 性&lt;/h5&gt;&lt;small&gt;本體界&lt;br/&gt;空無相&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;p&gt;不是「色之外另有法性」，也不是「法性之外另有色」——色與法性的關係是&lt;strong&gt;表面與底色&lt;/strong&gt;、&lt;strong&gt;波與水&lt;/strong&gt;的關係。色等諸法的「實相」即是法性。菩薩說法時若守住此理，便「不壞法性」——既不否認現象，也不增益本體，只是揭示二者一體。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　但貴法性的緣由&lt;/h2&gt;
&lt;p class=&quot;text-label&quot;&gt;原 典&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;須菩提問：「色等諸法亦與法性不異，何以故但貴法性？」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;須菩提的第二問抓得很準——既然不異，為何經論還特別「貴重」法性？這是要逼出「&lt;strong&gt;不異而仍有先後&lt;/strong&gt;」的微妙結構。&lt;/p&gt;
&lt;p&gt;論文認為，貴法性不是因為「法性比色法更高」，而是因為：&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;法性是色法的實相&lt;/strong&gt;——透過法性才能正確理解色法。&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;色法是法性的呈現&lt;/strong&gt;——透過色法才能在世間實踐法性。&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;貴法性是學佛入門的次第方便&lt;/strong&gt;——眾生先執色法為實有，故先以「貴法性」破執；一旦執破，色法當體即法性，無所謂先後貴賤。&lt;/li&gt;
&lt;/ul&gt;
&lt;h2&gt;第四節　最後的疑笑 · 分別從何而來？&lt;/h2&gt;
&lt;p class=&quot;text-label&quot;&gt;原 典&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;以佛答「色不異法性」故，故須菩提難：「若不異者，云何分別有善惡、白黑、須陀洹等諸果？」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;須菩提的第三問是真正的勝負手——若色與法性不異，那為什麼世間還能分善惡、白黑、四果（須陀洹、斯陀含、阿那含、阿羅漢）？分別從何而來？&lt;/p&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;這個追問非常致命：如果一切「不異」，世俗的倫理判別、修證次第都會崩潰。須菩提此問實際上是替全體有情眾生與所有修行者問：菩薩道、聲聞道、四果差別是否還有意義？&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第五節　二諦圓融矩陣 · 世諦有分別、第一義無分別&lt;/h2&gt;
&lt;p class=&quot;text-label&quot;&gt;原 典&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;佛答：「色等法雖不離法性，以世諦故有分別，於第一義中無分別。」何以故？得第一義聖人無所分別，聞有所得不喜，聞無所有不憂；得空無相證故，乃至微細法尚不取相，何況分別有善惡！未得實相者，欲得第一義故，有所分別。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;論文圖示頁稱此為「二諦圓融矩陣」&lt;/div&gt;
&lt;p&gt;佛陀的答覆構成一個四象限：&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;世 諦 · 有 分 別&lt;/div&gt;
&lt;p&gt;分別善惡、白黑、四果——是世俗中可被確立、可被觀察的事實。不分別便無倫理、無修道。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;第 一 義 · 無 分 別&lt;/div&gt;
&lt;p&gt;得空無相證的聖者，不取一切相為定相。連微細法都不取，何況世間善惡分別。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;聖 人 之 心 行&lt;/div&gt;
&lt;p&gt;「聞有所得不喜，聞無所有不憂」——心不被「有」「無」二邊牽動，是真無分別。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;凡 人 之 學 道&lt;/div&gt;
&lt;p&gt;「未得實相者，欲得第一義故，有所分別」——尚未證得時，仍須以分別為通往無分別的舟筏。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;這個矩陣不是要修行者「假裝沒有分別」（那是斷見），也不是要「執著分別為實」（那是常見）——而是要修行者&lt;strong&gt;同時持二諦讀同一個世間&lt;/strong&gt;：在世諦中認真分別善惡、嚴守戒律；在真諦中徹底放下對分別的執著。&lt;/p&gt;
&lt;h2&gt;第六節　是法無言說 · 畢竟空、無始空&lt;/h2&gt;
&lt;p class=&quot;text-label&quot;&gt;原 典&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;佛此中自說因緣：「是法無言說，亦無生滅垢淨法者，所謂畢竟空、無始空。」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;本章末段是整品的收尾與最高音：實相之法本無言說、本無生滅、本無垢淨——這就是「畢竟空」與「無始空」的最終揭示。&lt;/p&gt;
&lt;div class=&quot;verse&quot;&gt;
      是 法 無 言 說&lt;br/&gt;
      亦 無 生 滅 垢 淨 法 者&lt;br/&gt;
      所 謂 畢 竟 空 、 無 始 空
    &lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;「畢竟空」是空的徹底性——空到底、不留任何實有；「無始空」是空的無源頭性——非從某時開始空、本來就空。二空相疊，便是大乘中觀所謂「八不中道」的另一種表述。&lt;strong&gt;到此，菩薩說法、二諦分別、法性諸法的所有辯證，全部歸結於此二空之中。&lt;/strong&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;chapter&quot; id=&quot;chapter-8&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷 八 十 九 · 第 一 品 · 第 八 章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;中觀宏觀全景與學術貢獻&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;The Madhyamaka Macro-Schema and Scholarly Implications&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;span class=&quot;bridge-label&quot;&gt;本 章 要 旨&lt;/span&gt;
&lt;p&gt;本章為全品收束。論文以「中觀宏觀全景圖：幻師演法的系統架構」一圖統攝前七章，把本品的所有要素配置到一個「劇場結構」中——劇本、情節、演員、本質、舞台五元齊備。最後論文點出本品在當代學術中的三大研究指引與學術貢獻。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　中觀宏觀全景圖 · 幻師演法的系統架構&lt;/h2&gt;
&lt;p&gt;論文用「幻師演法」的劇場隱喻，把本品所有要素重新配置——這個結構同時統攝了第二至第七章的所有辯證：&lt;/p&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;劇 本 · 教&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;四十二字&lt;/strong&gt;（第四章）——一切說法的字音底本，從阿字遞迴至千萬名相。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;情 節 · 相&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;世諦善惡&lt;/strong&gt;（第七章）——分別善惡、白黑、四果，是說法所對的世間情節。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;演 員 · 用&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;不失空相的菩薩&lt;/strong&gt;（第五、六章）——化人說法者，以三解脫門為演技規範。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;
&lt;div class=&quot;cell-title&quot;&gt;本 質 · 體&lt;/div&gt;
&lt;p&gt;&lt;strong&gt;第一義空&lt;/strong&gt;（第七章末）——畢竟空、無始空，是整場戲的底色。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;舞 台 · 定 ＝ 足 安 立&lt;small&gt;第三章 · 禪定根基 · 不可動的座基&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;本 質 · 體 ＝ 第 一 義 空&lt;small&gt;第七章 · 畢竟空、無始空&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;劇 本 · 教 ＝ 四 十 二 字&lt;small&gt;第四章 · 字門遞迴邏輯&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;情 節 · 相 ＝ 世 諦 善 惡&lt;small&gt;第七章 · 二諦圓融矩陣&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;演 員 · 用 ＝ 不 失 空 相 的 菩 薩&lt;small&gt;第五、六章 · 化人說法 · 三解脫門&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　劇本-情節-演員-本質-舞台的五元結構&lt;/h2&gt;
&lt;p&gt;論文認為這個五元結構是中觀辯證的「最簡化身」——把所有抽象義理具象化為一場演出：&lt;/p&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;菩薩（演員）站在足安立的舞台（定）上，以四十二字為劇本（教），演出世諦善惡的情節（相），而整場戲的本質（體）是第一義空。觀眾（眾生）若看不出底色，便當作真實人生；菩薩演員若忘了底色，便落入凡夫。&lt;strong&gt;「不失空相」就是演員始終記得：自己是化人，戲是化戲，觀眾也是化眾——但戲還是要好好演完。&lt;/strong&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　本品的三大學術貢獻&lt;/h2&gt;
&lt;p&gt;論文圖示頁列出本品在當代佛學研究中的三大指引：&lt;/p&gt;
&lt;div class=&quot;three-col&quot;&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;① 擴 充 異 熟 識 身 心 哲 學&lt;/div&gt;
&lt;p&gt;從「果報生識」一語延伸出「身心相依而非心身二元」的中觀身心觀。本品為佛教身心哲學的緣起相依說提供新文本依據（對應第二章）。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;② 解 決 語 言 解 構 的 悖 論&lt;/div&gt;
&lt;p&gt;「化人說法」隱喻為「語言實相不可說、菩薩仍須說」的悖論提供結構化解方案，對當代後維特根斯坦的言說哲學具參照價值（對應第四、五章）。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;③ 確 立 大 乘 倫 理 學 的 二 諦 基 礎&lt;/div&gt;
&lt;p&gt;「世諦故有分別，第一義中無分別」確立大乘菩薩倫理學的本體論基礎——倫理學要在二諦圓融中安立，不可偏執一邊（對應第六、七章）。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第四節　總結 · 自性法不住自性法的終極實相&lt;/h2&gt;
&lt;p&gt;本品最後留下一句餘音不絕的偈頌（出自第五章末段譬喻，論文置於結語頁）：&lt;/p&gt;
&lt;div class=&quot;verse&quot;&gt;
      自 性 法 不 住 自 性 法&lt;br/&gt;
      譬 如 火 不 住 火 中&lt;br/&gt;
&lt;span style=&quot;display:block;margin-top:10px;font-size:18px;color:var(--text-muted);&quot;&gt;— 幻 人 為 幻 眾 說 無 字 實 相 —&lt;/span&gt;
&lt;/div&gt;
&lt;p&gt;本品從「識滿足何以在隨形好中」開始問起，途經足安立、四十二字、化人說法，最後落在「色即是法性、世諦故有分別」。乍看是五組獨立問答，實則是一條完整的中觀辯證軸線：&lt;strong&gt;從身體到語言、從語言到悖論、從悖論到二諦、從二諦到實相&lt;/strong&gt;——這就是論文所稱「從果報生識到二諦圓融的辯證拓撲」。&lt;/p&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;本品在《大智度論》全書中的定位&lt;/div&gt;
&lt;p&gt;第八十九卷第一品雖然篇幅不算最長，卻是整部《大智度論》中觀體系的「&lt;strong&gt;拓撲樞紐&lt;/strong&gt;」之一——身（足安立、隨形好）、語（四十二字）、意（果報生識）、行（化人說法）、果（法性不異諸法）五維被一網收進「不轉法性而為眾生說法」的菩薩道核心命題之中。讀懂本品，便讀懂整部《智論》如何把一切佛法收進「二諦不二」的圓融矩陣。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

/* ============ 矩陣表 ============ */
.matrix-table{width:100%;border-collapse:collapse;margin:14px 0;
  background:var(--card);border-radius:8px;overflow:hidden;
  border:1px solid var(--border);}
.matrix-table th,.matrix-table td{
  padding:10px 14px;text-align:left;
  border-bottom:1px solid var(--border-light);
  border-right:1px solid var(--border-light);font-size:14.5px;}
.matrix-table th{background:linear-gradient(135deg,#3d3225,#2a2218);
  color:#f7f3ec;font-weight:600;letter-spacing:2px;text-align:center;}
.matrix-table td{background:#fffdf7;}
.matrix-table tr:nth-child(even) td{background:#faf5ed;}

/* ============ 四格 ============ */
.four-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0;}
.four-grid .cell{background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:12px 18px;font-size:15px;}
.four-grid .cell strong{display:block;color:var(--accent);margin-bottom:4px;}

/* ============ 三柱結構 ============ */
.three-pillar{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0;}
.pillar{background:linear-gradient(180deg,#3d3225 0%,#2a2218 100%);
  color:#f7f3ec;border-radius:10px;padding:18px 16px;text-align:center;
  border:1px solid var(--gold);}
.pillar-name{font-family:&quot;Noto Serif TC&quot;,serif;font-size:18px;
  color:var(--goldL);letter-spacing:2px;font-weight:700;margin-bottom:10px;}
.pillar-body{font-size:14px;color:#e8d8b8;line-height:1.7;}

/* ============ 隱喻對比 ============ */
.metaphor-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;}
.metaphor-pair .met-card{background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:16px 20px;text-align:center;}
.metaphor-pair .met-card.bad{border-color:#a05030;background:#fef5f0;}
.metaphor-pair .met-card.good{border-color:#5a8050;background:#f5fef0;}
.metaphor-pair .met-title{font-family:&quot;Noto Serif TC&quot;,serif;
  font-size:16px;font-weight:700;margin-bottom:8px;}
.metaphor-pair .met-card.bad .met-title{color:#8B2500;}
.metaphor-pair .met-card.good .met-title{color:#2c6a40;}

/* ============ 中道光譜 ============ */
.spectrum{display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--border);
  border-radius:50px;padding:12px 24px;margin:18px 0;gap:14px;}
.sp-node{flex:1;text-align:center;font-size:14px;padding:4px 10px;}
.sp-side{color:var(--accent-red);font-weight:600;}
.sp-mid{background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff!important;border-radius:24px;padding:8px 20px;
  font-weight:700;letter-spacing:2px;font-size:15.5px;
  text-shadow:0 1px 3px rgba(0,0,0,.35);}
.sp-mid *{color:#fff!important;}
.sp-arrow{color:var(--gold);font-size:18px;}

/* ============ 結語區 ============ */
.final-mantra{
  background:linear-gradient(135deg,#3d3225,#2a2218);
  color:#f7f3ec;border:2px solid var(--gold);

}
.mantra-line{font-family:&quot;Noto Serif TC&quot;,serif;

.mantra-line .gloss{

/* ============ 下一品連結 ============ */
.next-link{display:inline-block;margin-top:28px;

&lt;div class=&quot;preface&quot;&gt;
&lt;h2&gt;編 者 前 言&lt;/h2&gt;
&lt;p&gt;本品收於《大智度論》卷八十九，為佛陀與須菩提長老一段極為精微的對話。表面上是在追問「為何但說二空名為法？」「修道是否得果？」這兩個問題；實際上，這段對話正是&lt;strong&gt;中觀學派全部根本邏輯的縮影&lt;/strong&gt;——以二空為工具、以二諦為認識論、以八不為破執、以無自性為終極依據。&lt;/p&gt;
&lt;p&gt;本品的解析按&lt;strong&gt;三維分析視角&lt;/strong&gt;展開：&lt;strong&gt;工具論&lt;/strong&gt;（如何把萬法歸納為可破之對象）、&lt;strong&gt;認識論&lt;/strong&gt;（凡聖之分如何安立）、&lt;strong&gt;修證論&lt;/strong&gt;（修道與得果的真實本性）。三維交會於一個核心命題——&lt;strong&gt;體同而用異&lt;/strong&gt;：本體層上凡聖皆空、毫無差別；認知層上能正確分別二諦者立為聖人，反之為凡夫。&lt;/p&gt;
&lt;p&gt;本頁將原典 24 段問答融入&lt;strong&gt;六章邏輯鏈&lt;/strong&gt;：第一章收束十八空為二空（工具論）；第二章建立以「二諦認知」為分野的凡聖矩陣（認識論）；第三、四章透過「修道得果不？」的反詰打破實體因果（修證論）；第五章注入中觀引擎「以有空義故，一切法得成」與「唯心真實」的真正所指；第六章歸於菩薩善通達法性的境界——無罣、無礙、無遮而說法。&lt;/p&gt;
&lt;p&gt;每章均依「卷 → 品 → 章 → 節」四級層級編號，前後文以橋接段交代邏輯遞進。願讀者循此邏輯藍圖，得入畢竟空甚深畢盡之境。&lt;/p&gt;
&lt;/div&gt;

&lt;section class=&quot;chapter&quot; id=&quot;chapter-1&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第二品 · 第一章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;破 執 的 極 簡 歸 納&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;工具論 · 何以但說二空名為法？&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;本章要旨&lt;/div&gt;
&lt;p&gt;本章開門見山處理一個方法論問題：般若經中已陳列十八空（內空、外空、內外空、空空、大空、第一義空……乃至無法有法空），為何此處&lt;strong&gt;但說「二空」即可名為法&lt;/strong&gt;？答案在於──「一切所有」可極簡歸納為兩類：「若法」與「若眾生」；以&lt;strong&gt;畢竟空&lt;/strong&gt;破「法」、以&lt;strong&gt;無始空&lt;/strong&gt;破「眾生」，破此二法已，&lt;strong&gt;則一切法盡破&lt;/strong&gt;。本章亦揭示為何龍樹偏取「畢竟空」為甚深畢盡之說：餘空如火燒木，猶有灰燼；畢竟空無灰無燼，徹底掃蕩任何隱微的執著殘留。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　何以但說二空名為法？&lt;/h2&gt;
&lt;p&gt;本品開卷的問題極為直接：佛陀於般若經中前後共列十八種空，為何在此處的辯證中，&lt;strong&gt;但取「二空」即足以名之為法&lt;/strong&gt;？這不是文字省略，而是中觀方法論上的「&lt;strong&gt;極簡歸納原則&lt;/strong&gt;」——將龐雜的破執工具收束為兩個最根本的對治，以期一擊命中。&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;原 典&lt;/span&gt;
&lt;p&gt;&lt;b&gt;問曰：&lt;/b&gt;此中何以但說二空名為法？&lt;/p&gt;
&lt;p&gt;&lt;b&gt;答曰：&lt;/b&gt;一切所有：若法、若眾生。若言畢竟空，則破諸法；若言無始空，則破眾生。破此二法已，則一切法盡破。此中菩薩為眾生說法，是故以二空破二事；雖有餘空，不如畢竟空甚深畢盡。&lt;strong&gt;餘空如火燒木，猶有灰燼；畢竟空無灰無燼。&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;有人言：若說十八空無咎，略說故說二空。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;h5&gt;論主邏輯解析&lt;/h5&gt;
&lt;p&gt;論主指出，諸法之繁雜不過是「&lt;strong&gt;萬法分類學&lt;/strong&gt;」的兩大根源：&lt;strong&gt;非情之法&lt;/strong&gt;（若法）與&lt;strong&gt;有情之眾生&lt;/strong&gt;（若眾生）。以畢竟空對治「法執」、以無始空對治「我執／眾生執」，二者攻克，全局即破。此即中觀「&lt;strong&gt;簡化歸納法&lt;/strong&gt;」——將萬法收斂為兩大根源，進行精準的標靶打擊。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　法空與生空的萬法分類矩陣&lt;/h2&gt;
&lt;p&gt;論主將「一切所有」展開為一張&lt;strong&gt;對治機制矩陣&lt;/strong&gt;。這張矩陣的價值在於它是&lt;strong&gt;充分且互不交集&lt;/strong&gt;的——任何被認為「實有」的對象，必然落入此二類之一，不存在第三類的漏網之魚。&lt;/p&gt;
&lt;table class=&quot;matrix-table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;&lt;th colspan=&quot;2&quot;&gt;一切所有（All Existence）&lt;/th&gt;&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td style=&quot;text-align:center;&quot;&gt;&lt;strong&gt;若法&lt;/strong&gt;&lt;/td&gt;&lt;td style=&quot;text-align:center;&quot;&gt;&lt;strong&gt;若眾生&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td style=&quot;text-align:center;&quot;&gt;畢竟空&lt;/td&gt;&lt;td style=&quot;text-align:center;&quot;&gt;無始空&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td style=&quot;text-align:center;&quot;&gt;破諸法&lt;/td&gt;&lt;td style=&quot;text-align:center;&quot;&gt;破眾生相續&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;核心公式&lt;/h5&gt;
&lt;p style=&quot;text-align:center;font-size:18px;color:var(--accent);letter-spacing:3px;margin:8px 0;&quot;&gt;
        （ 法 空 ＋ 生 空 ）＝ 一 切 法 盡 破
      &lt;/p&gt;
&lt;p&gt;畢竟空所對治者是「凡有對象皆有自性」的法執；無始空所對治者是「眾生有實體相續」的我執。在中觀的工具集中，這兩把斧頭已足以伐倒全部的執著之樹。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　無灰無燼——畢竟空的徹底性&lt;/h2&gt;
&lt;p&gt;為什麼論主特別推崇&lt;strong&gt;畢竟空&lt;/strong&gt;而非其餘十六空？關鍵在於&lt;strong&gt;徹底性&lt;/strong&gt;。論主以一個極富張力的隱喻刻畫：&lt;/p&gt;
&lt;div class=&quot;metaphor-pair&quot;&gt;
&lt;div class=&quot;met-card bad&quot;&gt;
&lt;div class=&quot;met-title&quot;&gt;常火燒木（餘空）&lt;/div&gt;
&lt;p style=&quot;font-size:14.5px;color:var(--text2);line-height:1.85;&quot;&gt;猶有灰燼。破除了粗重煩惱，&lt;br/&gt;但心智仍殘留對「空」本身的微細執著。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;met-card good&quot;&gt;
&lt;div class=&quot;met-title&quot;&gt;劫火掃蕩（畢竟空）&lt;/div&gt;
&lt;p style=&quot;font-size:14.5px;color:var(--text2);line-height:1.85;&quot;&gt;無灰無燼。甚深畢盡，&lt;br/&gt;不留任何理性退路，連「空」的概念也徹底焚毀。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;h5&gt;論文視角注入&lt;/h5&gt;
&lt;p&gt;「無灰無燼」這四字之所以重要，是因為許多學人破除了「有」的執著之後，&lt;strong&gt;會在「空」字上重新建立一個新的執著&lt;/strong&gt;——以為「空」是某種真實的、可得的、可保留的東西。畢竟空的功能正是&lt;strong&gt;連這個微細的「空執」也一併焚毀&lt;/strong&gt;，讓心智沒有任何安全屋可以躲藏。這也是為什麼下一章須菩提仍會在「凡聖體同」處執著平等義——他破了現象之有，卻又在勝義諦上抓住了一個「平等」之相。&lt;/p&gt;
&lt;/div&gt;
&lt;h4&gt;本章工具論收束&lt;/h4&gt;
&lt;p&gt;至此，第一章建立的&lt;strong&gt;方法論基礎&lt;/strong&gt;已就位：&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;十八空（繁雜列陳）&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓ 歸納收束&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;二空（畢竟空 ＋ 無始空）&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓ 對治標的&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;若法（諸法）＋ 若眾生（相續）&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓ 徹底性原則&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;無灰無燼 · 一切法盡破&lt;/strong&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;bridge bridge-outro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;承先啟後&lt;/div&gt;
&lt;p&gt;第一章建立了「以二空破萬法」的&lt;strong&gt;工具基礎&lt;/strong&gt;。然而工具一旦上手，立刻引出一個新問題：既然萬法皆空、凡聖皆空，那麼凡夫與聖人的差別究竟安立於何處？須菩提正是在此處陷入了「&lt;strong&gt;齊頭式平等&lt;/strong&gt;」的邏輯陷阱。第二章將進入&lt;strong&gt;認識論層面&lt;/strong&gt;，看佛陀如何切割「本體」與「認知狀態」，重新安立凡聖之別。&lt;/p&gt;
&lt;/div&gt;
&lt;a class=&quot;next-link&quot; href=&quot;#chapter-2&quot;&gt;前往第二章 · 齊頭式平等的迷區 →&lt;/a&gt;
&lt;/div&gt;
&lt;/section&gt;



&lt;section class=&quot;chapter&quot; id=&quot;chapter-2&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第二品 · 第二章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;齊 頭 式 平 等 的 迷 區&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;認識論 · 凡聖以二諦為分野&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;本章要旨&lt;/div&gt;
&lt;p&gt;本章是須菩提向佛陀提出的&lt;strong&gt;第一波詰問&lt;/strong&gt;——既然第一義中「皆空一相」，那麼&lt;strong&gt;第一義中凡夫人應有須陀洹等聖果&lt;/strong&gt;。這是把勝義諦的絕對平等，硬套用到世俗諦的現象界，抹殺了修證的必要性。佛陀的回答是經典的&lt;strong&gt;邏輯反轉&lt;/strong&gt;：本體層（勝義諦）凡聖皆空毫無差別，但認知層（世俗諦）能否「分別第一義、是世諦」就成為凡聖的真正分野。聖人的定義不在於擁有某個實體化的「聖性」，而在於&lt;strong&gt;能正確認知二諦&lt;/strong&gt;——知空，而不壞假名。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　第一義中凡夫應作賢聖？&lt;/h2&gt;
&lt;p&gt;須菩提的詰問極為精微，他試圖以畢竟空的徹底性反推一個悖論：既然在勝義諦中「一切皆空、無有差別」，那麼凡夫與聖人的差別豈不就被空性自身抹平了？&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;須 菩 提 詰 問&lt;/span&gt;
&lt;p&gt;須菩提言：&lt;strong&gt;「若以世諦故分別有善惡、白黑及諸聖果者，第一義中凡夫人應有須陀洹等聖果！」&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;何以故？若以世諦虛妄中分別有諸賢聖者，第一義中凡夫應作賢聖。須菩提分別實相、凡夫為異。佛言：「第一義一相。」是故須菩提言：「凡夫應是聖人！」&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;h5&gt;邏輯陷阱解構&lt;/h5&gt;
&lt;p&gt;須菩提此問的暗結構是：「若 A 在 X 層為真，B 在 Y 層為真，而 X 與 Y 在第一義中皆空——那 A 與 B 應在第一義中等同。」這就是&lt;strong&gt;「齊頭式平等」&lt;/strong&gt;的執理廢事陷阱：強行將勝義諦的絕對平等，套用於世俗諦的現象界，&lt;strong&gt;抹殺修證的必要性&lt;/strong&gt;。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;flow&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;凡夫應作賢聖&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;←&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;凡夫本質 ＝ 聖人本質&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;←&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;第一義一相&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　本體與認知的嚴格切割&lt;/h2&gt;
&lt;p&gt;面對這道詰問，佛陀並不否定「本體層皆空」這個前提，而是&lt;strong&gt;切割了兩個層次&lt;/strong&gt;——本體層（勝義諦）與認知層（世俗諦）：&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;佛 陀 邏 輯 反 轉&lt;/span&gt;
&lt;p&gt;爾時，佛答：&lt;strong&gt;「若凡夫知分別是第一義、是世諦者，凡夫人應有須陀洹等諸聖果；以凡夫實不知道，不知分別道，不知行道、修道，何況得道果！」&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;佛言：「聖人能作是分別故，說是聖果。」&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;h5&gt;本體層（勝義諦）&lt;/h5&gt;
&lt;p&gt;凡聖皆空，毫無差別。&lt;br/&gt;「第一義一相」確實成立。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;h5&gt;認知層（世俗諦）&lt;/h5&gt;
&lt;p&gt;差別並非發生在「本質」，&lt;br/&gt;而是發生在對本質的「&lt;strong&gt;知&lt;/strong&gt;」與「&lt;strong&gt;不知&lt;/strong&gt;」。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;佛陀的核心切割&lt;/h5&gt;
&lt;p&gt;聖之所以為聖，不在於擁有某種「聖性實體」（這違反空義），而在於&lt;strong&gt;能正確分別二諦&lt;/strong&gt;——既能透徹知空（勝義諦），又能不壞世俗的善惡因果（世俗諦）。凡之所以為凡，正在於「不知分別道」——本體上雖空，但認知上錯亂，於是「&lt;strong&gt;隨波逐流，無有道果&lt;/strong&gt;」。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　以二諦認知為分野的凡聖界定矩陣&lt;/h2&gt;
&lt;p&gt;把佛陀的回答展為&lt;strong&gt;四欄矩陣&lt;/strong&gt;，凡聖界定的精微結構即一目了然：&lt;/p&gt;
&lt;table class=&quot;matrix-table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;&lt;th&gt;狀 態&lt;/th&gt;&lt;th&gt;本 體&lt;/th&gt;&lt;th&gt;認 知 狀 態&lt;/th&gt;&lt;th&gt;結 果&lt;/th&gt;&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align:center;font-weight:600;&quot;&gt;凡夫&lt;/td&gt;
&lt;td style=&quot;text-align:center;&quot;&gt;皆空&lt;/td&gt;
&lt;td&gt;實不知道、不知分別道&lt;/td&gt;
&lt;td&gt;隨波逐流，無果&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td style=&quot;text-align:center;font-weight:600;&quot;&gt;聖人&lt;/td&gt;
&lt;td style=&quot;text-align:center;&quot;&gt;皆空&lt;/td&gt;
&lt;td&gt;知分別「是第一義、是世諦」&lt;/td&gt;
&lt;td&gt;建立修行，假名聖果&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;h5&gt;聖人定義的精準刻畫&lt;/h5&gt;
&lt;p&gt;注意這張表的左二欄——「本體：皆空」——凡聖完全相同。差別&lt;strong&gt;只在第三欄的「認知狀態」&lt;/strong&gt;。聖人的定義，恰恰建立在「能正確分別真俗二諦」之上。&lt;strong&gt;知空，而不壞假名&lt;/strong&gt;——這八個字幾乎是中觀全部修證觀的總綱。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第四節　中論注入：涅槃與世間，體同而用異&lt;/h2&gt;
&lt;p&gt;在須菩提受此邏輯震動後，論主隨即注入&lt;strong&gt;中觀的核心綱領&lt;/strong&gt;，把這層「體同用異」的結構推到極致：&lt;/p&gt;
&lt;div class=&quot;verse&quot;&gt;
      涅槃與世間，無有少分別。&lt;br/&gt;
&lt;span style=&quot;font-size:14px;color:var(--text-muted);&quot;&gt;——《中論》&lt;/span&gt;
&lt;/div&gt;
&lt;div class=&quot;metaphor&quot;&gt;
&lt;h5&gt;譬喻：明鏡中的觀者&lt;/h5&gt;
&lt;p&gt;佛陀於此處護持的中觀核心綱領是：&lt;strong&gt;空性並非抹殺現象的差異，而是揭示差異的「無自性」&lt;/strong&gt;。涅槃與世間，從本體層上「體同」（皆空無自性）；但從認知層上「用異」（聖人以照見、凡夫以盲目）——鏡中雖無實體，但「照見」與「盲目」兩種作用截然不同。&lt;strong&gt;體同而用異&lt;/strong&gt;，這正是凡聖之差別何以能在「皆空」的前提下仍然成立的真正理由。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;bridge bridge-outro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;承先啟後&lt;/div&gt;
&lt;p&gt;第二章透過「凡聖辯」建立了&lt;strong&gt;認識論的雙層結構&lt;/strong&gt;——本體皆空、認知有別。然而須菩提此時雖然受教，卻又從中產生了新的執著：既然修道者得果、不修道者不得果，那「修道」本身豈不應該是一條&lt;strong&gt;實體化的因果通道&lt;/strong&gt;？正是這個微細的「修證因果執」，引出了第三章佛陀那個讓全場震動的「不」字。&lt;/p&gt;
&lt;/div&gt;
&lt;a class=&quot;next-link&quot; href=&quot;#chapter-3&quot;&gt;前往第三章 · 修證論的終極反詰 →&lt;/a&gt;
&lt;/div&gt;
&lt;/section&gt;



&lt;section class=&quot;chapter&quot; id=&quot;chapter-3&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第二品 · 第三章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;修 證 論 的 終 極 反 詰&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;以「不」字破實體因果&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;本章要旨&lt;/div&gt;
&lt;p&gt;本章是全品&lt;strong&gt;邏輯張力最強的轉折點&lt;/strong&gt;。須菩提自覺先前「凡夫應是聖人」的詰問有失，於是反向追問：「無量、無相、無動性中，我云何取相欲量無量法？」並順理修正為：「&lt;strong&gt;修道得果不？&lt;/strong&gt;」此時讀者本以為佛陀必答「是」——但佛陀卻說「&lt;strong&gt;不&lt;/strong&gt;」。這個「不」字，徹底擊碎了「修道」與「果」之間那條被學人潛意識預設的&lt;strong&gt;實體化因果鏈&lt;/strong&gt;。本章解構此「不」字背後的中觀邏輯：佛陀並非否定修行，而是否定提問者背後的&lt;strong&gt;「實體測量心態」&lt;/strong&gt;——即把道與果視為兩個獨立實存的實體（自性化），認為投入 A 就能榨出 B 的商業交易式因果觀。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　修道得果不？佛言「不」&lt;/h2&gt;
&lt;p&gt;須菩提在受佛邏輯震動後，極為謙抑地修正立場——他承認自己錯把「無量無相」之法以取相心去測度，於是回到一個看似最安全的問題：&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;語 境 推 進&lt;/span&gt;
&lt;p&gt;爾時，須菩提自知有失，故言：「無量、無相、無動性中，我云何取相欲量無量法？云何強以凡夫法為聖果？」爾時受佛語，知行道者得果，不行道者不得果，是故白佛：「&lt;strong&gt;修道得果不？&lt;/strong&gt;」&lt;/p&gt;
&lt;p&gt;佛言：&lt;strong&gt;「不。」&lt;/strong&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;h5&gt;戲劇性張力&lt;/h5&gt;
&lt;p&gt;佛陀此一字，徹底擊碎了「修證因果」的實體化執著。讀者此時必生疑：佛陀豈非自相矛盾？前面才剛說「聖人能作是分別故，說是聖果」，此處卻說「修道不得果」？須菩提此時內心也必有此疑——所以他緊接著就提出問難。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　語境轉換的關鍵：取相之心&lt;/h2&gt;
&lt;p&gt;當須菩提以「修道得果不」反問時，佛陀自然要再度反詰：「佛上說分別修道、得道果，今云何言『不』？」論主於此處給出了極為關鍵的解析——&lt;strong&gt;佛陀的回答並非否定修行，而是針對提問者背後的「取相之心」&lt;/strong&gt;。&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;論 主 解 析&lt;/span&gt;
&lt;p&gt;&lt;b&gt;問曰：&lt;/b&gt;佛上說分別修道、得道果，今云何言「不」？&lt;/p&gt;
&lt;p&gt;&lt;b&gt;答曰：&lt;/b&gt;佛先說，&lt;strong&gt;非著心&lt;/strong&gt;；今須菩提以&lt;strong&gt;著心&lt;/strong&gt;問，欲從道中出果，如麻中出油。若爾者，道之與果，同為虛誑，是故言不。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;h5&gt;世俗諦 / 非著心&lt;/h5&gt;
&lt;p&gt;先說「有修有證」，依緣起法，自然有果。&lt;strong&gt;不否定假名因果&lt;/strong&gt;，不抹殺修證的世俗有效性。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;h5&gt;勝義諦 / 著心&lt;/h5&gt;
&lt;p&gt;今言「不」，針對須菩提此刻的「&lt;strong&gt;取相欲量&lt;/strong&gt;」心態。把道、果實體化後，二者反而同為虛誑。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;p style=&quot;text-align:center;font-size:17px;color:var(--accent);letter-spacing:2px;line-height:1.8;&quot;&gt;
        佛陀的回答&lt;strong&gt;並非否定修行行為&lt;/strong&gt;，&lt;br/&gt;而是&lt;strong&gt;否定提問者背後的「實體測量心態」&lt;/strong&gt;。
      &lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　如麻中出油——實體因果的謬誤&lt;/h2&gt;
&lt;p&gt;論主以一個極為精準的工坊隱喻，刻畫須菩提此刻的執著心態：&lt;/p&gt;
&lt;div class=&quot;metaphor&quot;&gt;
&lt;h5&gt;隱喻：榨油機&lt;/h5&gt;
&lt;p&gt;「&lt;strong&gt;欲從道中出果，如麻中出油&lt;/strong&gt;」——把「道」視為原料，把「果」視為產品，認為投入修道行為就能像榨油一樣榨出涅槃聖果。這是一個&lt;strong&gt;商業交易式&lt;/strong&gt;的因果觀。其背後的暗執是：&lt;/p&gt;
&lt;p style=&quot;margin-top:8px;&quot;&gt;　•　將「道」與「果」視為兩個獨立實存的實體（自性化）&lt;br/&gt;
      　•　認為投入 A，就能榨出 B&lt;br/&gt;
      　•　修證被簡化為一個機械式輸入輸出系統&lt;/p&gt;
&lt;p style=&quot;margin-top:8px;&quot;&gt;中觀的破斥則是：&lt;strong&gt;欲從道中出油，如麻中出油。若帶此實體心態，道與果「同為虛誑」&lt;/strong&gt;。為什麼？因為被自性化的東西本就是錯位的存在，建立其上的因果關係必然也是錯位的。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;h5&gt;聽者的次第誤解&lt;/h5&gt;
&lt;p&gt;論主進一步指出，聽者於此處又會生第二層誤解：「若修不得，不修應當得！」這是&lt;strong&gt;把「不修」也當成一種獲得的方法&lt;/strong&gt;。佛陀於是說：「&lt;strong&gt;修尚不得，何況不修！&lt;/strong&gt;」&lt;/p&gt;
&lt;div class=&quot;classical-text&quot; style=&quot;margin:10px 0;&quot;&gt;
&lt;p&gt;聽者生念：若修不得，不修應當得！是故佛言：「修尚不得，何況不修！」&lt;/p&gt;
&lt;p&gt;譬如二人欲有所到：一者、住，不行；二者、失道。二俱不到。若不修道，尚無少許攝心樂，何況道果！&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;論主此處藏著一個極為精微的階梯——這是修證實踐的真實次第，下一章將完整解析。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第四節　八不中道的因果觀&lt;/h2&gt;
&lt;p&gt;佛陀此「不」字所示的因果觀，正是&lt;strong&gt;八不中道&lt;/strong&gt;於修證論上的展開。八不中道的核心：「不生、不滅、不斷、不常」——所破除者，正是「投入 → 產出」的實體化思維。&lt;/p&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;strong&gt;若果定有性&lt;/strong&gt;因為何所起？果若已實有，何需從道中生？&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;strong&gt;若果本無性&lt;/strong&gt;修亦不能生。從無生有違反因果。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;strong&gt;不生&lt;/strong&gt;果報不是從道裡「生」出來的實體。&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;strong&gt;不滅&lt;/strong&gt;故無「實體被滅」的問題。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;verse&quot;&gt;
      不 生 亦 不 滅，&lt;br/&gt;
      不 斷 亦 不 常。&lt;br/&gt;
&lt;span style=&quot;font-size:14px;color:var(--text-muted);&quot;&gt;—— 八不中道於修證論的應用&lt;/span&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;p&gt;真正的修證因果不是「實體 A 投入 → 實體 B 產出」，而是&lt;strong&gt;緣起空性中的功用顯現&lt;/strong&gt;。在不取相的層次上，「修道」與「道果」並非兩個分離的實體，而是&lt;strong&gt;同一空性緣起在不同階位上的功用展現&lt;/strong&gt;。打破世俗交易式的修證觀，正是中觀對實體因果論的根本破斥。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;bridge bridge-outro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;承先啟後&lt;/div&gt;
&lt;p&gt;第三章用「不」字打破了修證的實體因果。然而須菩提仍未死心——他立刻轉向&lt;strong&gt;另一個更深的角度&lt;/strong&gt;反問：佛陀曾經明確「斷三結得須陀洹」（果位有差別、有階次），這豈不正是修證有果的鐵證？而且須陀洹果是「無為法」，&lt;strong&gt;無為中應該是無差別的&lt;/strong&gt;啊。第四章將處理這個無為法差別的邏輯死角，並揭示凡夫邏輯在「斷滅無」與「著心有」之間的鐘擺式危機。&lt;/p&gt;
&lt;/div&gt;
&lt;a class=&quot;next-link&quot; href=&quot;#chapter-4&quot;&gt;前往第四章 · 無為差別與斷滅之危 →&lt;/a&gt;
&lt;/div&gt;
&lt;/section&gt;



&lt;section class=&quot;chapter&quot; id=&quot;chapter-4&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第二品 · 第四章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;無 為 差 別 與 斷 滅 之 危&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;凡夫鐘擺 · 著有與斷無&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;本章要旨&lt;/div&gt;
&lt;p&gt;本章是須菩提在受教後的第三波反詰，也是凡夫邏輯最易陷入的&lt;strong&gt;邏輯死角&lt;/strong&gt;。前一章他從「修道得果」處被破，於是立刻轉向更鋒利的角度：「&lt;strong&gt;佛何以故說斷三結得須陀洹？&lt;/strong&gt;」更精微的是——須菩提自己肯認須陀洹果是「無為」，於是佛陀以一個極漂亮的反問把他逼入死角：「&lt;strong&gt;無為中有差別不？&lt;/strong&gt;」答曰：「不也！」於是佛陀說：「若無分別，汝云何作難？」這一問截斷了須菩提的執理路徑。第四章還必須處理一個與此緊密相連的危機——當凡夫看到「修不得、不修也不得」時，極易跌進&lt;strong&gt;斷滅空&lt;/strong&gt;，認為「既然修不到，乾脆放棄」。論主以「住不行 / 失道」二人的隱喻，刻畫這個鐘擺式危機並破之。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　無為法無差別的邏輯死角&lt;/h2&gt;
&lt;p&gt;須菩提此時祭出他認為的鐵證——既然佛陀曾經明說「斷三結得須陀洹」，這是經教中明明白白的果位差別，豈非「修必有果」的證明？&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;須 菩 提 反 詰&lt;/span&gt;
&lt;p&gt;爾時，須菩提問：「&lt;strong&gt;若爾者，佛何以故說斷三結得須陀洹，有如是等分別？&lt;/strong&gt;」&lt;/p&gt;
&lt;p&gt;佛以反問答：「於汝意云何：汝以須陀洹果等是有為、是無為？」&lt;/p&gt;
&lt;p&gt;須菩提言：「&lt;strong&gt;是無為。&lt;/strong&gt;」&lt;/p&gt;
&lt;p&gt;佛言：「&lt;strong&gt;若爾者，無為中有差別不？&lt;/strong&gt;」&lt;/p&gt;
&lt;p&gt;須菩提言：「不也！世尊！」&lt;/p&gt;
&lt;p&gt;「若無分別，汝云何作難？」&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;須菩提：若無果，為何有須陀洹等分別？&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;佛陀反問：須陀洹是有為還是無為？&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;須菩提：是無為。&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;佛陀：無為中有差別不？&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;須菩提：不也！&lt;/strong&gt;（執理路徑斷）&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;h5&gt;邏輯死角的真正所指&lt;/h5&gt;
&lt;p&gt;佛陀並未否定須陀洹等聖果的事實。他做的是一個極漂亮的&lt;strong&gt;邏輯反轉&lt;/strong&gt;：既是寂滅無相（無法），豈有高下之分？若無差別，汝云何強加分別作難？這意謂果位差別的真正所在&lt;strong&gt;並非無為法本身&lt;/strong&gt;（無為皆寂滅，無高下之分），而&lt;strong&gt;是世俗諦現象界中由「能否正確認知」而建立的修行假名&lt;/strong&gt;。回到第二章那張凡聖矩陣——本體皆空，認知有別。聖果是建立在「認知上正確分別二諦」之上的假名安立，不是無為法上實體化的差別。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　凡夫邏輯的鐘擺：斷滅與著有&lt;/h2&gt;
&lt;p&gt;佛陀斷然否定「實體因果」之後，凡夫聽者極易產生第二層危機——既然修不得、不修也不得，那&lt;strong&gt;乾脆什麼都不做、什麼都不認&lt;/strong&gt;，這就是落入「&lt;strong&gt;斷滅空&lt;/strong&gt;」的危險。中觀視角下，這是凡夫邏輯的典型鐘擺：&lt;/p&gt;
&lt;div class=&quot;spectrum&quot;&gt;
&lt;div class=&quot;sp-node sp-side&quot;&gt;斷 滅 無&lt;br/&gt;&lt;small&gt;聽者：「若修不得，那不修總該得了吧！」&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;sp-arrow&quot;&gt;←&lt;/div&gt;
&lt;div class=&quot;sp-node sp-mid&quot;&gt;中 道&lt;/div&gt;
&lt;div class=&quot;sp-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;sp-node sp-side&quot;&gt;著 心 有&lt;br/&gt;&lt;small&gt;須菩提：「修必有果」之取相&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;metaphor&quot;&gt;
&lt;h5&gt;鐘擺隱喻&lt;/h5&gt;
&lt;p&gt;佛言：「&lt;strong&gt;修尚不得，何況不修！&lt;/strong&gt;」此一句斬斷執著的刀刃過於鋒利，凡夫極易跌過頭，由「實體有」直接跌入「虛無主義」。中觀的全部用功處，正是要把這個鐘擺穩住於中道，&lt;strong&gt;既不取著、也不落空&lt;/strong&gt;。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　二俱不到——住不行與失道者&lt;/h2&gt;
&lt;p&gt;論主於此處給出一組精微的&lt;strong&gt;實踐隱喻&lt;/strong&gt;，刻畫鐘擺兩端的失敗狀態：&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;隱 喻 解 析&lt;/span&gt;
&lt;p&gt;譬如二人欲有所到：&lt;strong&gt;一者、住，不行；二者、失道&lt;/strong&gt;。二俱不到。若不修道，尚無少許攝心樂，何況道果！&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;metaphor-pair&quot;&gt;
&lt;div class=&quot;met-card bad&quot;&gt;
&lt;div class=&quot;met-title&quot;&gt;一者 · 住，不行&lt;/div&gt;
&lt;p style=&quot;font-size:14.5px;line-height:1.85;&quot;&gt;站著不動。連世俗的攝心禪定樂都沒有，&lt;br/&gt;遑論終極道果。&lt;strong&gt;這是斷滅一端的危險。&lt;/strong&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;met-card bad&quot;&gt;
&lt;div class=&quot;met-title&quot;&gt;二者 · 失道&lt;/div&gt;
&lt;p style=&quot;font-size:14.5px;line-height:1.85;&quot;&gt;取相著心修道。雖有短暫禪定樂，&lt;br/&gt;但猶如迷路者，永遠無法觸及實相。&lt;strong&gt;這是著心一端的危險。&lt;/strong&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;取相 vs 不取相的真正差別&lt;/h5&gt;
&lt;div class=&quot;classical-text&quot; style=&quot;margin-top:10px;&quot;&gt;
&lt;p&gt;若心取相修道，雖有攝心禪定樂，無有道果；&lt;strong&gt;若不取相著心修道，則有道果&lt;/strong&gt;。是故佛說：「菩薩行般若波羅蜜，不分別有為、無為性故，有道果差別。」&lt;/p&gt;
&lt;/div&gt;
&lt;p style=&quot;margin-top:10px;&quot;&gt;論主此處精準指出——道果的有無，&lt;strong&gt;並不取決於修不修這個外在行為&lt;/strong&gt;，而取決於修道者內心是否「&lt;strong&gt;取相著心&lt;/strong&gt;」。著心修道：有禪定樂，無道果；不著心修道：有道果。這是中觀對「修道得果」最精準的重新定義——以心態決定果，而非以行為決定果。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;bridge bridge-outro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;承先啟後&lt;/div&gt;
&lt;p&gt;第四章透過「無為差別」破斥執理、透過「住不行／失道」破斥廢事，把鐘擺穩住於中道。但這只是破，還未立。&lt;strong&gt;中道既然否定了實體因果，那緣起、修行、果位這些假名又如何成立？&lt;/strong&gt;第五章將注入中觀的引擎——「以有空義故，一切法得成」，並揭示「&lt;strong&gt;唯心真實，餘皆虛誑&lt;/strong&gt;」這句話的真正所指：不是建立一個叫做「心」的新實體，而是把所有差別歸源於心的迷悟階位，從而為「化人作佛事」這種極致心法奠定基礎。&lt;/p&gt;
&lt;/div&gt;
&lt;a class=&quot;next-link&quot; href=&quot;#chapter-5&quot;&gt;前往第五章 · 中觀引擎與唯心真實 →&lt;/a&gt;
&lt;/div&gt;
&lt;/section&gt;



&lt;section class=&quot;chapter&quot; id=&quot;chapter-5&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第二品 · 第五章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;中 觀 引 擎 與 唯 心 真 實&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;以有空義故 · 一切法得成&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;本章要旨&lt;/div&gt;
&lt;p&gt;第三、四章一連串的「不」破除實體因果之後，本章必須&lt;strong&gt;重新立起緣起假名&lt;/strong&gt;——否則中觀就成了純破無立的虛無論。中觀引擎在此啟動：「&lt;strong&gt;以有空義故，一切法得成&lt;/strong&gt;」（《中論》偈）。空不是什麼都不做，而是充滿無限可能性的基底；正因為一切無自性，才能透過緣起（修行）的改變才是可能的。再往前一步，論主直接揭示：「&lt;strong&gt;佛意：唯是心為真實，餘時皆虛誑&lt;/strong&gt;」——這句話必須極為小心讀，它不是建立一個叫做「心」的新實體，而是把萬法的差別與證果的階位，皆&lt;strong&gt;依「心」的迷悟程度而施設的假名&lt;/strong&gt;。最終以「化人作佛事」的極致心法為例，示範菩薩如何「作而不動」。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　以有空義故，一切法得成&lt;/h2&gt;
&lt;p&gt;當佛陀以「修道得果不？不」與「無為中有差別不？不也」兩重「不」字斷盡實體因果後，論主立刻啟動&lt;strong&gt;中觀的正立面&lt;/strong&gt;，揭示空義所開啟的真實可能性：&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;h5&gt;反 證&lt;/h5&gt;
&lt;p&gt;如果一切都是實體（不空），那麼凡夫永遠鎖死在凡夫狀態，&lt;strong&gt;無法改變&lt;/strong&gt;。修行毫無意義，亦無證果可能。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;h5&gt;正 理&lt;/h5&gt;
&lt;p&gt;正因為「空」（無自性），透過緣起（修行）的改變才是可能的。空是充滿無限可能性的基底。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;verse&quot;&gt;
      以 有 空 義 故，&lt;br/&gt;
      一 切 法 得 成。&lt;br/&gt;
&lt;span style=&quot;font-size:14px;color:var(--text-muted);&quot;&gt;——《中論》&lt;/span&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;p&gt;必須藉由「&lt;strong&gt;假名的修&lt;/strong&gt;」來證悟「&lt;strong&gt;真實的空&lt;/strong&gt;」。空不是什麼都不做，而是充滿無限可能性的基底。修行的真實作用，正是依緣起而展現的「&lt;strong&gt;動態功用&lt;/strong&gt;」——它不是榨油式地從修道實體中榨出果實體，而是在無自性的空性基底上，依緣起力顯現出證量的階位。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　唯心真實，餘皆虛誑&lt;/h2&gt;
&lt;p&gt;論主於此處下了一句極重的判語——但它的意涵必須極為小心讀：&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;論 主 揭 示&lt;/span&gt;
&lt;p&gt;又復問須菩提：「若善男子、善女人通達一切法一相，所謂無相，住三解脫門中，證涅槃時，是時有法分別若有為、若無為不？」答言：「不也！」&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;佛意：唯是心為真實，餘時皆虛誑，汝云何作難？&lt;/strong&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;h5&gt;關鍵釋義&lt;/h5&gt;
&lt;p&gt;「唯心真實」這句話極易被誤讀為建立一個叫做「心」的新實體。論主此處的真正所指是：&lt;strong&gt;萬法的差別與證果的階位，皆依「心」的迷悟程度而施設的假名&lt;/strong&gt;——法體本無高下，唯有覺醒度有別。&lt;/p&gt;
&lt;p style=&quot;margin-top:8px;&quot;&gt;在中觀脈絡下，這個「心」並非一個獨立實存的本體（這違反空義），而是&lt;strong&gt;緣起認知的當下功用&lt;/strong&gt;。聖人之所以是聖，正在於他能於當下心中正確分別二諦；凡夫之所以是凡，正在於他於當下心中錯亂取相。&lt;strong&gt;體同（皆空）而用異（迷悟之差）&lt;/strong&gt;——這就是「唯心真實」這四字的精確邏輯定位。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　化人作佛事——大清淨的修行心法&lt;/h2&gt;
&lt;p&gt;論主於此處將討論收於菩薩行般若波羅蜜的心法層面。引入一個極致的隱喻——&lt;strong&gt;化人作佛事&lt;/strong&gt;：&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;原 典 · 化 人 心 法&lt;/span&gt;
&lt;p&gt;菩薩行般若波羅蜜，不分別一切法，住內空等諸空中，是大清淨；自不著，亦教眾生令無所著，所謂檀波羅蜜乃至一切種智，菩薩道中皆教令不著。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;譬如佛所化人行布施等，亦不分別布施等，亦不受布施等法果報，但為利益度眾生故。&lt;/strong&gt;菩薩心亦如是。何以故？善通達諸法性故。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;metaphor&quot;&gt;
&lt;h5&gt;隱喻：佛所化人的極致心法&lt;/h5&gt;
&lt;p&gt;「化人」即魔術師（佛陀）變出的幻影。化人行布施等：&lt;/p&gt;
&lt;p style=&quot;margin-top:8px;&quot;&gt;　•　&lt;strong&gt;外相&lt;/strong&gt;：極度精勤地行善、布施&lt;br/&gt;
      　•　&lt;strong&gt;內心&lt;/strong&gt;：毫無「我在積累功德」或「我要成佛」的實體執著&lt;br/&gt;
      　•　&lt;strong&gt;本質&lt;/strong&gt;：「&lt;strong&gt;作而不動&lt;/strong&gt;」——做了一切，卻沒有任何「做了什麼」的痕跡留存&lt;/p&gt;
&lt;p style=&quot;margin-top:8px;&quot;&gt;這就是大清淨的修行心法：行為上完整地實踐六度萬行，但心態上不取「我在修、我得果」的相。菩薩心亦如是——這不是不作為的虛無，而是作而不動的絕對清淨。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;化人邏輯的精微之處&lt;/h5&gt;
&lt;p&gt;化人何以能精勤行善卻不取果報？因為化人本身&lt;strong&gt;即無自性&lt;/strong&gt;——他既不是真實的能行者，所行也不是真實的法，所成也不是真實的果。但其外在的功用（利益眾生）卻是真實顯現的。這正是中觀引擎的修證版本：「以有空義故，一切法得成」——正因為菩薩深知能修、所修、能證、所證皆無自性，他才能無罣無礙地行一切善法，且不染於相。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;bridge bridge-outro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;承先啟後&lt;/div&gt;
&lt;p&gt;第五章注入了中觀引擎，並以化人作佛事為心法典範。第六章將收束於菩薩善通達諸法性者的真實境界——「&lt;strong&gt;不取法性相，亦不住法性中&lt;/strong&gt;」、「於法性中不疑、不悶而說法，無罣、無礙、無遮」。這是全品的&lt;strong&gt;終極結語&lt;/strong&gt;，也是中觀學者需反覆涵泳的根本心訣。&lt;/p&gt;
&lt;/div&gt;
&lt;a class=&quot;next-link&quot; href=&quot;#chapter-6&quot;&gt;前往第六章 · 善通達法性者之境界 →&lt;/a&gt;
&lt;/div&gt;
&lt;/section&gt;



&lt;section class=&quot;chapter&quot; id=&quot;chapter-6&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第二品 · 第六章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;善 通 達 法 性 者 之 境 界&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;不取相 · 不住中 · 不疑悶&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;本章要旨&lt;/div&gt;
&lt;p&gt;本章是全品的&lt;strong&gt;終極收束&lt;/strong&gt;。前五章從工具論、認識論、修證論、引擎、心法層層推進，最終必須回答一個終極問題：什麼才算是「善通達法性者」？論主給出三句話的境界刻畫——「&lt;strong&gt;不取法性相，亦不住法性中；於法性中不疑、不悶而說法，無罣、無礙、無遮，是則通達法性&lt;/strong&gt;」。本章將解析這三組否定句的精微邏輯，並回顧全品邏輯——以對話推演總矩陣彙整四個悖論主題如何被一一破解，最後以中觀學者的核心記憶口訣作為本品的終極心法總持。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　菩薩行般若波羅蜜的實踐迴圈&lt;/h2&gt;
&lt;p&gt;論主把菩薩行般若波羅蜜的全部修行濃縮為一個&lt;strong&gt;三角迴圈&lt;/strong&gt;，三角的每一邊都不可或缺，缺一即墮入偏執：&lt;/p&gt;
&lt;div class=&quot;three-col&quot;&gt;
&lt;div class=&quot;col-card&quot; style=&quot;text-align:center;&quot;&gt;
&lt;h5&gt;自 不 著&lt;/h5&gt;
&lt;p&gt;住內空等諸空中，&lt;br/&gt;不分別一切法。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot; style=&quot;text-align:center;&quot;&gt;
&lt;h5&gt;化 眾 生&lt;/h5&gt;
&lt;p&gt;教眾生令無所著，&lt;br/&gt;引導他人放下實體執。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot; style=&quot;text-align:center;&quot;&gt;
&lt;h5&gt;大 清 淨&lt;/h5&gt;
&lt;p&gt;於一切種智無所得，&lt;br/&gt;循環往復，不留痕跡。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;三角迴圈的精微在於它的&lt;strong&gt;無起點性&lt;/strong&gt;——並非先「自不著」、再「化眾生」、最後「大清淨」這個線性序列。三者互為基礎、互相成立：唯有自不著才能真實化眾生、唯有化眾生才能真正大清淨、唯有大清淨才能保持自不著。任何一環陷入實體化執著，整個迴圈即斷。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　不取相、不住中、不疑悶&lt;/h2&gt;
&lt;p&gt;本品最後的關鍵原典刻畫了「善通達諸法性者」的三組境界：&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;境 界 解 析&lt;/span&gt;
&lt;p&gt;善通達者，&lt;strong&gt;不取法性相，亦不住法性中&lt;/strong&gt;；於法性中&lt;strong&gt;不疑、不悶&lt;/strong&gt;而說法，&lt;strong&gt;無罣、無礙、無遮&lt;/strong&gt;，是則通達法性。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;three-col&quot;&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;h5&gt;不 取 相&lt;/h5&gt;
&lt;p&gt;不抓取法性的表相。&lt;strong&gt;不把空、無自性當成一個可執取的概念&lt;/strong&gt;。連「我證了空」這個微細執也不留。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;h5&gt;不 住 中&lt;/h5&gt;
&lt;p&gt;不將空性當作避風港。&lt;strong&gt;不把法性安立為一個可棲息的處所&lt;/strong&gt;。連「中道」也不可作為新的執身之地。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;h5&gt;不 疑 悶&lt;/h5&gt;
&lt;p&gt;於法性中絕對勝解，&lt;strong&gt;不陷入虛無沈悶&lt;/strong&gt;。空性帶來的是無罣無礙的清明朗暢，而非虛無主義的灰暗。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;p style=&quot;text-align:center;font-size:18px;color:var(--accent);letter-spacing:2px;line-height:1.8;&quot;&gt;
        無 罣 · 無 礙 · 無 遮 而 說 法
      &lt;/p&gt;
&lt;p&gt;這正是中觀行者最終的修行果相——既能於勝義諦中不取法性相、不住法性中（內證的清淨），又能於世俗諦中無罣無礙無遮地宣說一切法（外用的圓滿）。&lt;strong&gt;內無所得而外無所不為&lt;/strong&gt;，即所謂「通達法性」。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　全邏輯回顧——對話推演總矩陣&lt;/h2&gt;
&lt;p&gt;本品自始至終的辯證，本質上是一張&lt;strong&gt;四欄四行的悖論破解矩陣&lt;/strong&gt;。把全品論點橫向展開，可看到須菩提每一波執著如何被佛陀以特定中觀原理破斥：&lt;/p&gt;
&lt;table class=&quot;matrix-table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;
&lt;th&gt;悖論主題&lt;/th&gt;
&lt;th&gt;須菩提執著&lt;/th&gt;
&lt;th&gt;佛陀破斥&lt;/th&gt;
&lt;th&gt;核心譬喻與中觀原理&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;
&lt;td style=&quot;font-weight:600;&quot;&gt;齊頭式平等&lt;/td&gt;
&lt;td&gt;凡聖皆空應無別&lt;/td&gt;
&lt;td&gt;體同而認知異&lt;/td&gt;
&lt;td&gt;鏡中盲與見&lt;br/&gt;（二諦並用）&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td style=&quot;font-weight:600;&quot;&gt;實體化因果&lt;/td&gt;
&lt;td&gt;修道必生實果&lt;/td&gt;
&lt;td&gt;無為法中無差別&lt;/td&gt;
&lt;td&gt;麻中出油&lt;br/&gt;（不生不滅）&lt;/td&gt;
&lt;/tr&gt;
&lt;tr&gt;
&lt;td style=&quot;font-weight:600;&quot;&gt;斷滅空陷阱&lt;/td&gt;
&lt;td&gt;不修應當得&lt;/td&gt;
&lt;td&gt;迷路與不行皆不到&lt;/td&gt;
&lt;td&gt;二俱不到&lt;br/&gt;（以有空義故得成）&lt;/td&gt;
&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;h2&gt;第四節　核心心法口訣與終極結語&lt;/h2&gt;
&lt;p&gt;本品最終可濃縮為中觀學者的&lt;strong&gt;四句記憶口訣&lt;/strong&gt;。每句各對應一個中觀層次，合則為完整的修證心要：&lt;/p&gt;
&lt;div class=&quot;final-mantra&quot;&gt;
&lt;div class=&quot;mantra-line&quot;&gt;因 緣 故 有 修&lt;span class=&quot;gloss&quot;&gt;確立世俗諦的造作&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;mantra-line&quot;&gt;自 性 故 無 得&lt;span class=&quot;gloss&quot;&gt;堅守勝義諦的空性&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;mantra-line&quot;&gt;無 為 無 差 別&lt;span class=&quot;gloss&quot;&gt;斬斷法執與果位攀緣&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;mantra-line&quot;&gt;化 人 作 佛 事&lt;span class=&quot;gloss&quot;&gt;成就大清淨的實踐&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;h5&gt;口訣的內在結構&lt;/h5&gt;
&lt;p&gt;「因緣故有修」——肯認世俗諦的緣起造作，不墮斷滅空。&lt;br/&gt;「自性故無得」——堅守勝義諦的空性徹底，不墮著心有。&lt;br/&gt;「無為無差別」——斬斷實體化的果位攀緣，不取法性相。&lt;br/&gt;「化人作佛事」——以無罣無礙的大清淨，外現一切善法。&lt;br/&gt;四句一氣貫通，&lt;strong&gt;有 → 空 → 無相 → 妙用&lt;/strong&gt;，正是中觀的全部修證次第。&lt;/p&gt;
&lt;/div&gt;
&lt;h4 style=&quot;text-align:center;margin-top:36px;color:var(--accent);letter-spacing:4px;&quot;&gt;終 極 結 語&lt;/h4&gt;
&lt;div class=&quot;verse&quot; style=&quot;font-size:19px;letter-spacing:3px;padding:24px 28px;&quot;&gt;

&lt;section class=&quot;preface&quot;&gt;
&lt;h2 class=&quot;preface-title&quot;&gt;編 者 前 言&lt;/h2&gt;
&lt;p&gt;本品是《大品般若經》中觀哲學的&lt;strong&gt;實踐辯證高峰&lt;/strong&gt;。從須菩提的開卷一問「云何菩薩善達諸法相」起，到最後「以法性前後中無異，是故是菩薩行般若波羅蜜，為利益眾生故，行菩薩道」作收，全品環繞一個看似不可解的悖論：&lt;strong&gt;若一切法如幻如化、無有實事，菩薩何故行六波羅蜜、成就眾生、淨佛國土？&lt;/strong&gt;&lt;/p&gt;
&lt;p&gt;論文以「中觀辯證螺旋」為框架，將本品拆解為五個遞進模塊——&lt;strong&gt;破立之初&lt;/strong&gt;建立化人隱喻的認識論基底；&lt;strong&gt;慈悲悖論&lt;/strong&gt;正面迎擊空與行的張力；&lt;strong&gt;空性賦能&lt;/strong&gt;翻轉地揭示無相恰是六度具足的充要條件；&lt;strong&gt;微觀解構&lt;/strong&gt;以五蘊般若觀的三重維度（相·生滅·如）逐一拆解現象；&lt;strong&gt;終極不二&lt;/strong&gt;則以工幻師譬喻收束，回到「色即是法性」的中觀大總持。&lt;/p&gt;
&lt;p&gt;本頁採卷-品-章-節四級編號（卷八十九 · 第三品 · 第X章 · 第X節）。第一章為經文原典依問答主題重組為六節；第二至六章對應論文五大模塊，逐節融入論主邏輯與哲學解析。讀者可循「經文 → 論述」順序閱讀，亦可從目次直接進入感興趣的章節。&lt;/p&gt;
&lt;/section&gt;
