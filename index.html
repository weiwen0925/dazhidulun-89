.ch-head::after{content:&quot;&quot;;position:absolute;bottom:-3px;left:50%;
  transform:translateX(-50%);width:80px;height:3px;background:var(--goldL);}
.ch-num{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14px;
  letter-spacing:6px;color:var(--goldL);margin-bottom:8px;}
.ch-name{font-size:30px;font-weight:700;letter-spacing:4px;color:#fff;line-height:1.4;}
.ch-sub{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14px;
  color:#c4956a;letter-spacing:2px;margin-top:10px;font-weight:300;}
.ch-body{max-width:880px;margin:32px auto;padding:0 32px;background:var(--bg);}

.ch-body p{margin:0 0 12px;text-indent:2em;font-size:17px;line-height:1.95;}
.ch-body h2{font-size:24px;font-weight:700;color:var(--accent);
  letter-spacing:2px;margin:32px 0 14px;
  padding:10px 0 10px 20px;border-left:4px solid var(--gold);
  background:linear-gradient(90deg,rgba(184,134,11,.08),transparent 60%);}
.ch-body h3{font-size:19.5px;font-weight:700;color:var(--text);
  margin:24px 0 10px;padding-bottom:6px;
  border-bottom:1px solid var(--border-light);letter-spacing:1px;}
.ch-body h4{font-size:17px;font-weight:600;color:var(--text2);
  margin:18px 0 8px;}
.ch-body h5{font-size:15.5px;font-weight:600;color:var(--gold);
  margin:14px 0 8px;letter-spacing:1px;}

/* Verse */
.verse{background:var(--verseBg);border-left:4px solid var(--verseBd);
  padding:14px 22px;margin:16px 0;line-height:2;
  text-align:center;font-size:18.5px;color:var(--text);
  border-radius:0 6px 6px 0;}
.verse small{font-size:0.8em;color:var(--text2);}

/* Cards */
.card,.insight,.commentary,.note{background:var(--card);
  border:1px solid var(--border);border-radius:8px;
  padding:16px 22px;margin:14px 0;
  box-shadow:0 1px 3px var(--shadow);}
.insight{background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border-left:5px solid var(--gold);}
.insight h5{color:var(--accent-red);font-size:14.5px;
  margin-bottom:8px;letter-spacing:2px;}
.commentary{background:#fdf9ed;border-left:4px solid var(--accentL);}
.card p{text-indent:0;margin:6px 0;}
.card ul,.card ol{margin:8px 0;padding-left:24px;}
.card ul li,.card ol li{margin:6px 0;line-height:1.85;}
.card h5{margin-bottom:10px;color:var(--accent);}

.text-label{display:inline-block;background:var(--text);color:#fff;
  padding:2px 10px;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:12px;
  letter-spacing:2px;border-radius:3px;margin-right:8px;
  vertical-align:middle;}

/* QA */
.qa{margin:18px 0;background:var(--card);border:1px solid var(--border-light);
  border-radius:8px;padding:14px 22px;}
.qa .q{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-weight:700;font-size:15px;
  color:#1e5a8c;background:rgba(30,90,140,.08);
  padding:4px 12px;border-radius:4px;display:inline-block;margin:10px 0 6px;
  border-left:3px solid #1e5a8c;}
.qa .a{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-weight:700;font-size:15px;
  color:var(--accent-red);background:rgba(139,37,0,.08);
  padding:4px 12px;border-radius:4px;display:inline-block;margin:10px 0 6px;
  border-left:3px solid var(--accent-red);}
.qa p{margin:6px 0 10px;text-indent:2em;}

/* Grid */
.four-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:16px 0;}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0;}
.three-col .col{background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:14px 18px;}
.three-col .col h5{margin-bottom:8px;}

/* Flow */
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:10px;margin:16px 0;padding:14px 18px;background:var(--card);
  border:1px solid var(--border);border-radius:8px;}
.flow.flow-v{flex-direction:column;}
.flow-box,.flow-step{background:var(--bg);border:1px solid var(--border);
  border-radius:8px;padding:12px 18px;min-width:160px;max-width:680px;
  text-align:center;font-size:15.5px;line-height:1.5;}
.flow-step{padding:14px 22px;width:100%;max-width:680px;}
.flow-arrow{font-size:22px;color:var(--gold);font-weight:700;}

/* Domino chain */
.domino-chain{display:flex;flex-wrap:wrap;align-items:center;
  justify-content:center;gap:8px;margin:16px 0;}
.domino{background:var(--card);border:1px solid var(--border);border-radius:6px;
  padding:10px 14px;text-align:center;font-size:14.5px;line-height:1.5;
  min-width:100px;}
.chain-arrow{color:var(--gold);font-size:20px;font-weight:700;}

/* Spectrum */
.spectrum{display:flex;align-items:stretch;gap:10px;margin:16px 0;
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:16px 18px;}
.spectrum .sp-node{flex:1;background:var(--bg);border:1px solid var(--border);
  border-radius:6px;padding:14px 12px;text-align:center;font-size:14.5px;}
.spectrum .sp-mid{flex:1.4;background:linear-gradient(135deg,var(--gold),var(--goldL));
  border-radius:8px;padding:14px 14px;text-align:center;color:#fff;
  display:flex;flex-direction:column;justify-content:center;
  text-shadow:0 1px 3px rgba(0,0,0,.35);}
.spectrum .sp-mid h5{color:#fff;font-size:18px;margin-bottom:4px;}
.spectrum .sp-mid small{color:rgba(255,255,255,.92);}

/* Triangle */
.triangle-diagram{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0;}
.triangle-diagram .tri-node{background:var(--card);border:1px solid var(--border);
  border-left:5px solid var(--gold);border-radius:8px;padding:14px 18px;}
.triangle-diagram .tri-node h5{color:var(--accent-red);margin-bottom:6px;}
.triangle-diagram .tri-node p{text-indent:0;font-size:15px;line-height:1.7;}

/* Table */
table{width:100%;border-collapse:collapse;margin:14px 0;background:var(--card);}
table th,table td{padding:10px 14px;border:1px solid var(--border);
  text-align:left;line-height:1.7;}
table thead th{background:var(--headGrad);color:#fff;font-weight:600;}

/* Read progress */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:8px 22px;border-radius:30px;
  border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
  font-family:&quot;Noto Sans TC&quot;,sans-serif;
  font-size:13px;letter-spacing:2px;
  display:flex;align-items:center;gap:12px;
  pointer-events:none;user-select:none;
  backdrop-filter:blur(6px);}
.read-progress .rp-bar{width:140px;height:3px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));
  width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;}
.read-progress .rp-label{font-size:11px;opacity:.75;letter-spacing:3px;}

/* Back to top */
#backTop{position:fixed;bottom:70px;right:20px;width:44px;height:44px;
  border-radius:50%;background:var(--gold);color:#fff;border:none;
  font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);
  display:none;z-index:110;transition:all .25s;}
#backTop:hover{background:var(--accent);transform:translateY(-2px);}
#backTop.show{display:block;}

/* Site footer */
.site-footer{background:#1a1610;color:#a09080;text-align:center;
  padding:32px 24px;font-family:&quot;Noto Sans TC&quot;,sans-serif;
  font-size:13px;letter-spacing:2px;line-height:2;margin-top:60px;}
.site-footer p{margin:4px 0;text-indent:0;}
.site-footer .footer-divider{width:40px;height:1px;background:var(--gold);
  opacity:.5;margin:14px auto;}

/* Mobile */
@media (max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);}
  .main{margin-left:0;}
  .four-grid,.three-col,.triangle-diagram{grid-template-columns:1fr;}
  .hero-title{font-size:32px;letter-spacing:4px;}
  .ch-name{font-size:24px;letter-spacing:2px;}
  .spectrum{flex-direction:column;}
}

&lt;div class=&quot;preface&quot;&gt;
&lt;h2&gt;編 者 前 言&lt;/h2&gt;
&lt;p&gt;本品立於《大智度論》卷八十九，承前品「無漏法相」之辯證，由&lt;strong&gt;須菩提&lt;/strong&gt;連發四重叩問、&lt;strong&gt;佛陀&lt;/strong&gt;逐一辯破——展開中觀視野下空性與萬行的完整空間拓撲。表面看似零散的對答，內裡實為一條極為嚴密的論證鏈：從聲聞乘的「四諦有相」破入大乘的「一切無漏無相」；再由「正以無相故有三乘諸道」翻轉「無相 vs 階位」的對立；接著以「三解脫門攝萬行」為菩薩道立綱領；終以「法性辯證的四步推演」與「幻師喻 · 從本已來常空」的雙軌心法，達成「權實不二之中道」的圓滿安立。&lt;/p&gt;
&lt;p&gt;論文《中觀視野下的空性與萬行：無漏實相與三乘解脫之邏輯推演》將此推演結構化為四大模塊（破相、攝行、法性、如幻）與四重悖論，本網頁即以此架構為骨幹，將原典 (DOCX 經文) 與論文邏輯 (PDF 視覺化解析) 融合為單品閱讀本，章節順序遵循「卷 → 品 → 章 → 節」四級體系。&lt;/p&gt;
&lt;p&gt;讀者若以中觀的核心姿態進入——「&lt;strong&gt;不是把有變成空，而是如實看見本來常空&lt;/strong&gt;」——則本品所有對答皆是同一空性在不同因緣中的展開。願本閱讀本，能讓四重悖論在心中逐層融解，讓「正以無相故有三乘諸道」的中觀總綱，落實為日用中的實踐心法。&lt;/p&gt;

&lt;div class=&quot;ch-body&quot;&gt;
&lt;h2&gt;第一節　全景導覽：空性與萬行的空間拓撲&lt;/h2&gt;
&lt;p&gt;本品立於《大智度論》卷八十九，承前品「無漏法相」之辯證脈絡，由&lt;strong&gt;須菩提&lt;/strong&gt;連發數問、&lt;strong&gt;佛陀&lt;/strong&gt;逐一辯破，所推演出的，正是&lt;strong&gt;中觀視野下「空性」與「萬行」之間的空間拓撲關係&lt;/strong&gt;。論文將此立體結構濃縮為四個核心模塊：&lt;/p&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h5&gt;① 破相&lt;/h5&gt;
&lt;p&gt;從聲聞乘的「有相」(苦相、集相、道相) 推進到大乘的「無相」(無漏法皆無相、無憶念)。摧破對「定相實有」的執取。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h5&gt;② 攝行&lt;/h5&gt;
&lt;p&gt;三解脫門 (空、無相、無作) 作為菩薩道的演算核心 (Master Key)，以最簡的法門統攝六波羅蜜乃至十八不共法。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h5&gt;③ 法性&lt;/h5&gt;
&lt;p&gt;體用不二、無性之性的本體論建構。法性無別性，亦無無性，故「無所學」即是「遍學一切法」。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h5&gt;④ 如幻&lt;/h5&gt;
&lt;p&gt;從「本已常空」推出如幻三昧的雙軌並行：菩薩內契畢竟空，外現六度萬行，遊戲神通而不離方便力。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　核心命題：以無相故，有三乘諸道&lt;/h2&gt;
&lt;div class=&quot;verse&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;核心命題&lt;/span&gt;&lt;br/&gt;
「正以無相故，有三乘諸道。」&lt;/div&gt;
&lt;p&gt;此一句是本品的&lt;strong&gt;邏輯支點&lt;/strong&gt;。表面上「無相」與「三乘階位」似乎矛盾——若一切法皆無分別相，何能立聲聞、緣覺、菩薩、佛之差別？然而，論主翻轉這個直觀：&lt;em&gt;正因為底層是空 (白紙)，上層才能安立三乘假名 (繪畫)；若有定相實有，反而彼此礙滯、無法轉化&lt;/em&gt;。&lt;/p&gt;
&lt;div class=&quot;verse&quot;&gt;「以有空義故，一切法得成；若無空義者，一切則不成。」&lt;br/&gt;
— 龍樹《中論·觀四諦品》&lt;/div&gt;
&lt;h2&gt;第三節　須菩提的根本叩問&lt;/h2&gt;
&lt;p&gt;本品開展的&lt;strong&gt;第一個問題場域&lt;/strong&gt;，是須菩提在前段討論「一切無漏法皆無相、無憶念」之後的疑情。他連續構作了四重悖論——每一重都直指「&lt;strong&gt;畢竟空&lt;/strong&gt;」與「&lt;strong&gt;實踐區分&lt;/strong&gt;」之間的張力：&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;第一重&lt;/strong&gt;　無漏法相之辯：&lt;br/&gt;四諦皆有相，何以說一切無漏法無相？&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;第二重&lt;/strong&gt;　三乘建立之辯：&lt;br/&gt;若皆無相，何能分立聲聞、緣覺、菩薩、佛？&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;第三重&lt;/strong&gt;　空有相攝之辯：&lt;br/&gt;三解脫門皆空，五眾諸法皆有相，云何學空即學有？&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;第四重&lt;/strong&gt;　幻事佛事之辯：&lt;br/&gt;若一切即法性而無分別，菩薩何故仍勤行六度？&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;論文觀察：這四問層層遞進，並非彼此獨立，而是「&lt;strong&gt;同一悖論的不同切面&lt;/strong&gt;」——須菩提以多重表述為佛陀提供反覆鍛打的&lt;strong&gt;辯證機會&lt;/strong&gt;，使中觀無相與菩薩萬行的對立，得以在每一層被融解、被重證。&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-2&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第五品 · 第二章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;大智度論第五品原典&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;兩段論主問答 · 經文全文&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;h2&gt;第一節　第一論主問答 · 無漏無相之辯&lt;/h2&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;div class=&quot;q&quot;&gt;問曰：&lt;/div&gt;
&lt;p&gt;四諦中，三諦皆有相——苦諦則有苦相，集諦則有集相，道諦則有道相；唯滅諦無相，亦有憶念，是無相涅槃，汝何以言「一切無漏法無相、無憶念」？&lt;/p&gt;
&lt;div class=&quot;a&quot;&gt;答曰：&lt;/div&gt;
&lt;p&gt;摩訶衍法與聲聞法異。摩訶衍法中說：「一切無漏法，無相、無憶念。」&lt;/p&gt;
&lt;p&gt;復次，有相、有憶念，皆是虛誑不實；若虛誑不實，即是諸煩惱漏，云何是無漏？&lt;/p&gt;
&lt;p&gt;復次，是三諦皆隨滅諦——見苦即捨，見集即斷，不言實定；見道為趣滅故，亦不住是道中；滅盡是主。是滅盡法，無相、無緣，云何有憶念？憶念皆是緣相著法。&lt;/p&gt;
&lt;p&gt;是故無漏法皆無相、無憶念。&lt;/p&gt;
&lt;p&gt;須菩提意：若無漏法是第一實，無相、無憶念，一切法性亦應無相、無憶念；但凡夫顛倒故，有相、有憶念。是故問佛：「若一切法無相、無憶念，云何數是聲聞法、是辟支佛法、是菩薩法、是佛法？」&lt;/p&gt;
&lt;p&gt;佛反問須菩提：「三乘法與無相法異不？」&lt;/p&gt;
&lt;p&gt;須菩提答曰：諸煩惱滅即是斷，斷即是無為法，亦知滅道諦即是無漏無相，是故言：「三乘不異無相法。」&lt;/p&gt;
&lt;p&gt;佛復問：「須陀洹乃至佛不即是無相法耶？」&lt;/p&gt;
&lt;p&gt;答言：「是。以是因緣故，當知一切法皆是無相。若無相，汝云何難言有諸道？正以無相故，有三乘諸道。」&lt;/p&gt;
&lt;p&gt;佛言：「若菩薩能如是學無相法，則能增益諸善法，所謂六波羅蜜乃至十八不共法。」此中佛自說因緣：「菩薩唯住三解脫門，不以餘法為要。」所以者何？三解脫門是實法，餘四念處等法雖實，皆方便說。&lt;/p&gt;
&lt;p&gt;三解脫門近涅槃，亦能攝一切實善法，是故說菩薩應學。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　第二論主問答 · 三解脫門攝萬行之辯&lt;/h2&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;div class=&quot;q&quot;&gt;問曰：&lt;/div&gt;
&lt;p&gt;若菩薩學是三解脫門即學五眾、十二入、十八界等，是三解脫門皆空、無相、無分別，是五眾諸法皆是有相、有分別法，云何學三解脫門故學是餘法？&lt;/p&gt;
&lt;div class=&quot;a&quot;&gt;答曰：&lt;/div&gt;
&lt;p&gt;菩薩學是三解脫門，則出三界、盡三漏故，於諸法中得實智慧，無所不通。先來五眾中，皆虛妄邪行；今得此三解脫門故，得正通達。&lt;/p&gt;
&lt;p&gt;此中佛自說因緣：「菩薩行是三解脫門無相法時，知色生、知色滅、知色如，乃至識亦爾。」如經中廣說。&lt;/p&gt;
&lt;p&gt;須菩提復問：「如佛所言，菩薩知色等相，知色等生，知色等滅，知色等如。若如是分別，將無色性壞法性耶？」&lt;/p&gt;
&lt;p&gt;佛答：「若有法出法性者，色性應壞法性。」&lt;/p&gt;
&lt;p&gt;一切法實相名為法性，是故一切法皆入法性中；色性實相即是法性，同一性，云何色性能壞法性？佛更說因緣：「諸佛賢聖不見出法性更有法者，不得故不說。」諸佛賢聖最可信者，菩薩應如是學法性。&lt;/p&gt;
&lt;p&gt;須菩提白佛：「若菩薩學法性，是為無所學。」所以者何？法性無性故。&lt;/p&gt;
&lt;p&gt;佛答：法性無性者，若菩薩學法性，為學一切法。若法性當別有性、若無性是性，應但學法性、不學一切法；今法性實無別性，亦無無性故，遍學一切法。但諸法實相是法性，是故得實相則正遍學一切法。&lt;/p&gt;
&lt;p&gt;爾時，須菩提白佛：「世尊！若一切法即是法性，菩薩摩訶薩以何等故學六波羅蜜，乃至陀羅尼門？何以故？諸法實相即是法性，若一切法即是法性，菩薩更何所求？復次，法性中無分別是六波羅蜜乃至陀羅尼；今菩薩分別行是法，將無墮顛倒中耶？」&lt;/p&gt;
&lt;p&gt;佛可須菩提意而答：「若菩薩出法性見有法者，不求阿耨多羅三藐三菩提。何以故？出法性有法者，是常顛倒、無明，不可轉令實，云何斷一切法中無明得作佛？菩薩知一切法即是畢竟空、常寂滅相，無戲論、無名字；憐愍眾生，以方便力故以名相說，所謂是色，是受、想、行、識，乃至阿耨多羅三藐三菩提。」&lt;/p&gt;
&lt;p&gt;如經中所說幻喻：幻師即是菩薩，幻法即是六波羅蜜等諸法。雖行是諸法，無著心；如幻師雖幻作種種物，知其無實而不著。智者是佛及大菩薩；無智者，凡夫人及新發意，而大歡喜，歎未曾有。&lt;/p&gt;
&lt;p&gt;菩薩行菩薩道，雖出法性更不見有法，亦不見有一定眾生，而大利益自身及眾生。如經中說：「是菩薩自行布施等，亦教他人，讚歎布施法，歡喜讚歎行布施者。乃至十八不共法亦如是。」&lt;/p&gt;
&lt;p&gt;此中佛自說因緣：「若法性先無後有，菩薩不能得阿耨多羅三藐三菩提，亦不能以方便力說。」所以者何？若法性先無後有、從因緣生者，則與凡夫共法無異！若法性先有後無，眾生及諸法則墮斷滅。以諸法性先空，中、後亦爾，非智慧力故令空。眾生及諸法非以入無餘涅槃時乃空，從本已來常空。&lt;/p&gt;
&lt;p&gt;菩薩教眾生：「何以不觀其實性而著顛倒？若觀諸法畢竟空性者，則知從本已來常空，今無所失。」如是行般若波羅蜜菩薩，則能祐利眾生。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-3&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第五品 · 第三章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;第一重論辯 · 無漏法相之辯&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;破相：從四諦有相到無漏無相&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;h2&gt;第一節　須菩提的根本叩問 · 畢竟空中的實踐悖說&lt;/h2&gt;
&lt;p&gt;本章對應論文模塊一「破相」。須菩提的&lt;strong&gt;第一重悖論&lt;/strong&gt;挑戰的是大乘「一切無漏法無相、無憶念」的命題。他以&lt;strong&gt;聲聞乘的四諦觀&lt;/strong&gt;為據——&lt;strong&gt;苦諦、集諦、道諦皆有相，唯滅諦無相&lt;/strong&gt;——反詰：若是這樣，則「一切無漏法皆無相」並不成立，至少道諦本身仍是有相之法。&lt;/p&gt;
&lt;h3&gt;一、聲聞四諦的偶限：唯滅諦無相&lt;/h3&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;苦諦&lt;/h5&gt;&lt;p&gt;有「苦相」可緣可觀。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;集諦&lt;/h5&gt;&lt;p&gt;有「集相」可斷可離。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;道諦&lt;/h5&gt;&lt;p&gt;有「道相」可修可趣。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-color:var(--gold)&quot;&gt;&lt;h5&gt;滅諦&lt;/h5&gt;&lt;p&gt;無相，趣向涅槃寂滅。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;聲聞乘將「無相」局限於滅諦一處，視前三諦為實有之相、實有之法。這正是須菩提發問的預設：在他的修行直覺裡，&lt;strong&gt;修道必須有相可循&lt;/strong&gt;，否則「云何分別三乘聖位」？&lt;/p&gt;
&lt;h2&gt;第二節　大乘破斥 · 有相即虛誑的邏輯必然&lt;/h2&gt;
&lt;p&gt;佛 (摩訶衍立場) 以三層回應翻轉之：&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;第一層 · 教判&lt;/strong&gt;　摩訶衍法與聲聞法異。摩訶衍中說：一切無漏法皆無相、無憶念。&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;第二層 · 邏輯&lt;/strong&gt;　若有相、有憶念，則必虛誑不實；虛誑不實即是煩惱漏。&lt;br/&gt;&lt;span style=&quot;color:var(--accent-red)&quot;&gt;→ 故「有相 ≠ 無漏」&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;第三層 · 攝歸&lt;/strong&gt;　苦、集、道皆隨滅諦而立——見苦即捨、見集即斷、見道趣滅。三諦不能作為實體執取。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;論文 Diagnostic Note&lt;/h5&gt;
&lt;p&gt;此段揭示：聲聞乘對前三諦的「有相」執著，正是被滅諦本身所迴遮的——三諦皆指向滅，自身卻不能作為終極實體。「&lt;strong&gt;滅盡是主&lt;/strong&gt;」一語為整段定錨：修行的最終主體唯是無相、無緣的滅盡法。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　三諦歸滅 · 以滅盡為主體的動態結構&lt;/h2&gt;
&lt;div class=&quot;verse&quot;&gt;「見苦即捨，見集即斷，不言實定；&lt;br/&gt;見道為趣滅故，亦不住是道中。&lt;br/&gt;滅盡是主。」&lt;/div&gt;
&lt;p&gt;論文以「動態結構」(dynamic structure) 解此一段：苦、集、道並非被認知的「&lt;strong&gt;實體靜態相&lt;/strong&gt;」，而是行者在修道中&lt;strong&gt;逐步歸屬於滅&lt;/strong&gt;的「&lt;strong&gt;過程動態&lt;/strong&gt;」。三諦如三支箭，箭箭指向滅；一旦執取為定相，反而失去其作為「方向指標」的功能。&lt;/p&gt;
&lt;div class=&quot;domino-chain&quot;&gt;
&lt;div class=&quot;domino&quot;&gt;苦相&lt;br/&gt;&lt;small&gt;見即捨&lt;/small&gt;&lt;/div&gt;
&lt;span class=&quot;chain-arrow&quot;&gt;→&lt;/span&gt;
&lt;div class=&quot;domino&quot;&gt;集相&lt;br/&gt;&lt;small&gt;見即斷&lt;/small&gt;&lt;/div&gt;
&lt;span class=&quot;chain-arrow&quot;&gt;→&lt;/span&gt;
&lt;div class=&quot;domino&quot;&gt;道相&lt;br/&gt;&lt;small&gt;趣滅不住&lt;/small&gt;&lt;/div&gt;
&lt;span class=&quot;chain-arrow&quot;&gt;→&lt;/span&gt;
&lt;div class=&quot;domino&quot; style=&quot;background:var(--gold);color:#fff&quot;&gt;滅&lt;br/&gt;&lt;small&gt;主體無相&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;是故，「無漏法皆無相、無憶念」不是抽象結論，而是&lt;strong&gt;修道結構的內在必然&lt;/strong&gt;。憶念皆是緣相著法；一旦達於滅盡，則無相可緣、無念可起。第一重悖論至此自然解消。&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-4&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第五品 · 第四章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;第二重論辯 · 三乘建立之辯&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;攝行：正以無相，故有三乘諸道&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;h2&gt;第一節　第二重悖論 · 若皆無相，何來三乘階位？&lt;/h2&gt;
&lt;p&gt;須菩提推進&lt;strong&gt;第二重叩問&lt;/strong&gt;：若無漏法的終極相是「無相、無憶念」，則「一切法性亦應無相、無憶念」——但凡夫顛倒故，妄見有相。這帶出更尖銳的疑問：&lt;/p&gt;
&lt;div class=&quot;verse&quot;&gt;「若一切法無相、無憶念，云何數是聲聞法、是辟支佛法、是菩薩法、是佛法？」&lt;/div&gt;
&lt;p&gt;無相之中，差異從何而生？若無分別，三乘如何安立？&lt;/p&gt;
&lt;h2&gt;第二節　中觀之解 · 正以無相故有三乘諸道&lt;/h2&gt;
&lt;p&gt;佛以&lt;strong&gt;反問法&lt;/strong&gt;引導須菩提自證：&lt;/p&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;div class=&quot;q&quot;&gt;佛問：&lt;/div&gt;&lt;p&gt;三乘法與無相法異不？&lt;/p&gt;
&lt;div class=&quot;a&quot;&gt;須菩提答：&lt;/div&gt;&lt;p&gt;諸煩惱滅即是斷，斷即是無為法，亦知滅道諦即是無漏無相——故三乘不異無相法。&lt;/p&gt;
&lt;div class=&quot;q&quot;&gt;佛問：&lt;/div&gt;&lt;p&gt;須陀洹乃至佛不即是無相法耶？&lt;/p&gt;
&lt;div class=&quot;a&quot;&gt;須菩提答：&lt;/div&gt;&lt;p&gt;是。以是因緣故，當知一切法皆是無相。&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;佛因此導出本品&lt;strong&gt;核心命題&lt;/strong&gt;：&lt;/p&gt;
&lt;div class=&quot;verse&quot; style=&quot;font-size:23px;color:var(--accent-red);font-weight:700&quot;&gt;
「若無相，汝云何難言有諸道？&lt;br/&gt;正以無相故，有三乘諸道。」
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;論文 Core Principle&lt;/h5&gt;
&lt;p&gt;此處的中觀辯證並非「無相抹殺差異」，而是「&lt;strong&gt;唯有無相，才能容攝緣起&lt;/strong&gt;」。底層邏輯是空 (白紙)，方能安立三乘假名 (繪畫)。若每一乘各有其「定相實有」，反而彼此礙滯、無法相互轉化、亦無法統攝於一道。&lt;/p&gt;
&lt;p&gt;援龍樹《中論·觀四諦品》：「&lt;strong&gt;以有空義故，一切法得成；若無空義者，一切則不成。&lt;/strong&gt;」&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　以簡馭繁 · 三解脫門的核心地位&lt;/h2&gt;
&lt;p&gt;悖論既解，佛轉而提示菩薩道的&lt;strong&gt;核心法門&lt;/strong&gt;：&lt;/p&gt;
&lt;div class=&quot;verse&quot;&gt;「若菩薩能如是學無相法，則能增益諸善法，所謂六波羅蜜乃至十八不共法。」&lt;br/&gt;
「菩薩唯住三解脫門，不以餘法為要。」&lt;/div&gt;
&lt;p&gt;所以者何？論主自釋：&lt;/p&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;&lt;strong&gt;三解脫門是實法&lt;/strong&gt;，餘四念處等法雖實，皆&lt;strong&gt;方便說&lt;/strong&gt;。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;三解脫門近涅槃&lt;/strong&gt;，亦能&lt;strong&gt;攝一切實善法&lt;/strong&gt;，是故說菩薩應學。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第四節　三門實法解析 · 解脫的底層代碼&lt;/h2&gt;
&lt;p&gt;這三道法門並非並列的修行選項，而是&lt;strong&gt;透視一切法本質的三種絕對維度&lt;/strong&gt;，是最接近涅槃、破除虛妄憶想的直接工具。&lt;/p&gt;
&lt;div class=&quot;triangle-diagram&quot;&gt;
&lt;div class=&quot;tri-node&quot;&gt;&lt;h5&gt;空解脫門&lt;/h5&gt;&lt;p&gt;一切法&lt;strong&gt;自相空&lt;/strong&gt;。&lt;br/&gt;&lt;small&gt;觀待緣起，無我我所&lt;/small&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tri-node&quot;&gt;&lt;h5&gt;無相解脫門&lt;/h5&gt;&lt;p&gt;一切法&lt;strong&gt;無相&lt;/strong&gt;。&lt;br/&gt;&lt;small&gt;無男女、生滅、一異等相&lt;/small&gt;&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tri-node&quot;&gt;&lt;h5&gt;無作解脫門&lt;/h5&gt;&lt;p&gt;一切法&lt;strong&gt;無作無起相&lt;/strong&gt;。&lt;br/&gt;&lt;small&gt;不作、不願、不取後有&lt;/small&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第五節　無相攝萬行 · 總攝善法的機制&lt;/h2&gt;
&lt;p&gt;為什麼只學三解脫門就能增益所有善法？&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;p&gt;因為三解脫門近於涅槃，能作為「&lt;strong&gt;底層算法&lt;/strong&gt;」涵攝並淨化一切實善法。佛經中說：&lt;/p&gt;
&lt;div class=&quot;verse&quot;&gt;「一切善法皆入三解脫門……自具足是善法，亦教他人令具足善法，無相故。」&lt;/div&gt;
&lt;p&gt;三解脫門如&lt;strong&gt;主控鑰匙 (Master Key)&lt;/strong&gt;，掌握核心樞紐，即能驅動外層的所有萬行；無需逐一去握住每一個外鎖。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;flow&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;&lt;strong&gt;三解脫門&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;(Master Key · 實法)&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;四念處&lt;br/&gt;四正勤&lt;br/&gt;四如意足&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;五根、五力&lt;br/&gt;七覺支、八正道&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;六波羅蜜&lt;br/&gt;十八不共法&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-5&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第五品 · 第五章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;第三重論辯 · 法性與萬法之辯&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;法性：體用不二·無性之性&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;h2&gt;第一節　第三重悖論 · 學「無相」何以通達「有相」？&lt;/h2&gt;
&lt;p&gt;悖論的&lt;strong&gt;第三層次&lt;/strong&gt;由此而起。須菩提發問：若菩薩學三解脫門即等同於學五眾、十二入、十八界等——但&lt;strong&gt;三解脫門皆空、無相、無分別&lt;/strong&gt;，&lt;strong&gt;五眾諸法皆是有相、有分別法&lt;/strong&gt;——空與有的鴻溝如何跨越？&lt;/p&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-left:5px solid var(--gold)&quot;&gt;
&lt;h5&gt;三解脫門&lt;/h5&gt;
&lt;p&gt;空、無相、無分別&lt;br/&gt;(若白紙、若虛空)&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-left:5px solid var(--accent-red)&quot;&gt;
&lt;h5&gt;五眾、十二入、十八界&lt;/h5&gt;
&lt;p&gt;有相、有分別&lt;br/&gt;(現象界諸法)&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;「&lt;strong&gt;云何學三解脫門故學是餘法？&lt;/strong&gt;」——這個提問迫使佛陀必須給出一條&lt;strong&gt;從空入有、又攝有歸空的方法論橋樑&lt;/strong&gt;。&lt;/p&gt;
&lt;h2&gt;第二節　以實帶權 · 透視現象的實相&lt;/h2&gt;
&lt;p&gt;佛答的第一層是「&lt;strong&gt;實智慧&lt;/strong&gt;」：&lt;/p&gt;
&lt;div class=&quot;verse&quot;&gt;「菩薩學是三解脫門，則出三界、盡三漏故，於諸法中得實智慧，無所不通。&lt;br/&gt;
先來五眾中，皆虛妄邪行；今得此三解脫門故，得正通達。」&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;論文 Insight&lt;/h5&gt;
&lt;p&gt;過去凡夫在五蘊中因執著外相而行「&lt;strong&gt;虛妄邪行&lt;/strong&gt;」——以表象為實。今透過三解脫門獲得的，是諸法的「&lt;strong&gt;實智慧&lt;/strong&gt;」(Mechanism: 知色生、知色滅、知色如)，能&lt;strong&gt;以實帶權&lt;/strong&gt;，內契空性而外不離緣起。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;flow&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;五眾諸法&lt;br/&gt;&lt;small&gt;(有相·虛妄邪行)&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot; style=&quot;background:var(--gold);color:#fff&quot;&gt;三解脫門&lt;br/&gt;&lt;small&gt;(實智慧)&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;知色生&lt;br/&gt;知色滅&lt;br/&gt;知色如&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　法性辯證的四步推演&lt;/h2&gt;
&lt;p&gt;當佛說菩薩「知色等相、知色等生、知色等滅、知色等如」時，須菩提立即捕捉到一個更深的問題：&lt;strong&gt;若如是分別，將無「色性壞法性」耶？&lt;/strong&gt;論文將佛陀對此的回應整理為「法性辯證的&lt;strong&gt;四步推演&lt;/strong&gt;」——進入《大智度論》最深層的本體論探討。&lt;/p&gt;
&lt;h3&gt;一、推演一 · 體用不二 (色性不壞法性)&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;div class=&quot;q&quot;&gt;須菩提：&lt;/div&gt;&lt;p&gt;菩薩知色等相、生、滅、如；若如是分別，將無色性壞法性耶？&lt;/p&gt;
&lt;div class=&quot;a&quot;&gt;佛答：&lt;/div&gt;&lt;p&gt;若有法出法性者，色性應壞法性。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;論主深釋：一切法實相名為法性，是故一切法皆入法性中；色性實相即是法性，&lt;strong&gt;同一性&lt;/strong&gt;，云何色性能壞法性？「&lt;strong&gt;諸佛賢聖不見出法性更有法者，不得故不說。&lt;/strong&gt;」&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;verse&quot;&gt;「若有法出法性者，色性應壞法性。」&lt;br/&gt;
&lt;span style=&quot;font-size:0.85em;color:var(--text2)&quot;&gt;— 體用不二 (色性 = 法性)&lt;/span&gt;&lt;/div&gt;
&lt;h3&gt;二、推演二 · 法性遍在的拓撲學&lt;/h3&gt;
&lt;p&gt;若色性即法性，那麼任何「&lt;strong&gt;外於法性&lt;/strong&gt;」的法皆不可得：&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;ul style=&quot;list-style:none;padding:0&quot;&gt;
&lt;li&gt;● 法性沒有外部邊界。&lt;/li&gt;
&lt;li&gt;● 「諸佛賢聖不見出法性更有法者，不得故不說。」&lt;/li&gt;
&lt;li&gt;● 離開現象界去尋找一個獨立的、純粹的「法性」是徒勞的。&lt;/li&gt;
&lt;li&gt;● 一切法皆入無相無為性中。&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;p&gt;論文以拓撲學比喻：&lt;strong&gt;法性是包覆一切現象的「無邊界球面」&lt;/strong&gt;——你向任何方向延伸，都不會出於法性之外，因此「找一個外於法性的純粹法性」這件事本身就是不成立的。&lt;/p&gt;
&lt;h3&gt;三、推演三 · 無性之性 (為何無所學即遍學？)&lt;/h3&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;div class=&quot;q&quot;&gt;須菩提：&lt;/div&gt;&lt;p&gt;若菩薩學法性，是為無所學。何以故？法性無性故。&lt;/p&gt;
&lt;div class=&quot;a&quot;&gt;佛答：&lt;/div&gt;
&lt;p&gt;法性無性者，若菩薩學法性，為學一切法。&lt;strong&gt;若法性當別有性、若無性是性&lt;/strong&gt;，應但學法性、不學一切法；今法性&lt;strong&gt;實無別性，亦無無性&lt;/strong&gt;故，遍學一切法。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;論文 Resolution&lt;/h5&gt;
&lt;p&gt;若法性有特定性質 (例如「方」)，則學它便排除了其他性質 (如「圓」)。正因為法性「&lt;strong&gt;實無別性，亦無無性&lt;/strong&gt;」，它沒有任何排他性的預設。透徹了這個「無定性」的底層邏輯，就等於具備了學習和統攝「一切法」的能力。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;The Empty Template ⇄ Diverse Phenomena&lt;/strong&gt;。&lt;/p&gt;
&lt;/div&gt;
&lt;h3&gt;四、推演四 · 得實相即正遍學一切法&lt;/h3&gt;
&lt;div class=&quot;verse&quot;&gt;「但諸法實相是法性，&lt;br/&gt;是故得實相則正遍學一切法。」&lt;/div&gt;
&lt;p&gt;論文小結整個本體論路徑：&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;諸法實相 = 法性&lt;br/&gt;&lt;small&gt;(Dharmata is the truth-content of all phenomena)&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓ therefore&lt;/div&gt;
&lt;div class=&quot;flow-step&quot; style=&quot;background:var(--gold);color:#fff&quot;&gt;得實相 = 正遍學一切法&lt;br/&gt;&lt;small&gt;(Realising reality = universally learning all dharmas)&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第四節　本體論小結 · 全知智的獲取路徑&lt;/h2&gt;
&lt;p&gt;第三重悖論的最終解答指向&lt;strong&gt;全知智的另類路徑&lt;/strong&gt;——一切智 (Omniscience) 並非藉由無限累加外在知識來達成，而是透過直擊現象底層的「&lt;strong&gt;空性&lt;/strong&gt;」來實現「&lt;strong&gt;矩陣式的解碼&lt;/strong&gt;」。&lt;strong&gt;得一即得一切。&lt;/strong&gt;&lt;/p&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;是故「無所學」與「遍學」並不矛盾——前者就「定相實有」之學而言為「無所學」(無一定性可學)；後者就「實相通達」之學而言為「遍學」(因實相 = 法性 = 一切法之共相)。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-6&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第五品 · 第六章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;第四重論辯 · 幻事佛事之辯&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;幻師喻 · 方便力 · 從本已來常空&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;h2&gt;第一節　第四重悖論 · 幻事佛事的實踐張力&lt;/h2&gt;
&lt;p&gt;須菩提的&lt;strong&gt;終極質疑&lt;/strong&gt;：既然一切法即是法性、法性中毫無分別，菩薩為何還要辛苦修習六波羅蜜乃至陀羅尼門？若一切皆空，分別行持這些法門，難道不是墮入顛倒之中嗎？&lt;/p&gt;
&lt;div class=&quot;verse&quot;&gt;「世尊！若一切法即是法性，菩薩摩訶薩以何等故學六波羅蜜，乃至陀羅尼門？……今菩薩分別行是法，將無墮顛倒中耶？」&lt;/div&gt;
&lt;h2&gt;第二節　認知的致命危險 · 出法性見有法&lt;/h2&gt;
&lt;p&gt;佛陀首先嚴厲指出一個&lt;strong&gt;認知謬誤&lt;/strong&gt;：若認為在法性「之外」還有真實存在的法可以追求，這是「&lt;strong&gt;常顛倒、無明&lt;/strong&gt;」。&lt;/p&gt;
&lt;div class=&quot;card&quot; style=&quot;border-left:5px solid var(--accent-red)&quot;&gt;
&lt;h5&gt;Consequence&lt;/h5&gt;
&lt;p&gt;抱持這種「實體見」修行，永遠無法斷除無明，亦絕不能證得阿耨多羅三藐三菩提。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;verse&quot;&gt;「若菩薩出法性見有法者，不求阿耨多羅三藐三菩提。」&lt;/div&gt;
&lt;p&gt;關鍵的轉折在於：佛承認須菩提的疑問是合理的——若以「實有」之心修六度，確實是顛倒；但佛的解答並非否定六度，而是重新框定&lt;strong&gt;修行的內在心法&lt;/strong&gt;。&lt;/p&gt;
&lt;h2&gt;第三節　幻師喻 · 大乘行者的核心心法&lt;/h2&gt;
&lt;p&gt;菩薩深知一切如幻 (畢竟空)，但為了憐愍眾生，&lt;strong&gt;精心展現六波羅蜜的幻法&lt;/strong&gt;。論文以三段式拆解此心法：&lt;/p&gt;
&lt;div class=&quot;three-col&quot;&gt;
&lt;div class=&quot;col&quot; style=&quot;background:var(--card)&quot;&gt;
&lt;h5&gt;Input · 幻師&lt;/h5&gt;
&lt;p&gt;菩薩 / Wisdom&lt;br/&gt;&lt;strong&gt;無著心&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;知一切無實&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col&quot; style=&quot;background:var(--card)&quot;&gt;
&lt;h5&gt;Process · 幻法&lt;/h5&gt;
&lt;p&gt;六度 / Skillful Means&lt;br/&gt;&lt;strong&gt;如幻萬行&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;名相施設&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col&quot; style=&quot;background:var(--card)&quot;&gt;
&lt;h5&gt;Output · 觀眾&lt;/h5&gt;
&lt;p&gt;眾生 / Compassion&lt;br/&gt;&lt;strong&gt;受益者&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;大歡喜·歎未曾有&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;verse&quot;&gt;「幻師即是菩薩，幻法即是六波羅蜜等諸法。&lt;br/&gt;
雖行是諸法，無著心。&lt;br/&gt;
如幻師雖幻作種種物，知其無實而不著。」&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;Key Mindset&lt;/h5&gt;
&lt;p&gt;「&lt;strong&gt;知其無實而不著&lt;/strong&gt;」。魔術師知道變出來的物品是假的，但他依然以極高的專注力完美演出，利益大眾。智者 (佛及大菩薩) 看穿幻；無智者 (凡夫人及新發意) 卻大歡喜、歎未曾有——而菩薩的方便正在這「知幻而善用幻」之間。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第四節　方便力 · 以名相假施設拔濟眾生&lt;/h2&gt;
&lt;p&gt;法性本無戲論與名字。但眾生深陷名相虛妄中，菩薩出於大慈悲，特意使用「&lt;strong&gt;名相&lt;/strong&gt;」(如色、受、想、行、識，乃至阿耨多羅三藐三菩提) 作為拔出眾生的工具。&lt;/p&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;菩薩知一切法即是&lt;strong&gt;畢竟空、常寂滅相，無戲論、無名字&lt;/strong&gt;；憐愍眾生，&lt;strong&gt;以方便力故以名相說&lt;/strong&gt;，所謂是色，是受、想、行、識，乃至阿耨多羅三藐三菩提。&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;論文的方便力結構：&lt;/p&gt;
&lt;div class=&quot;flow&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;寂滅相&lt;br/&gt;無戲論·無名字&lt;br/&gt;&lt;small&gt;(Quiescence)&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;←橋接→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot; style=&quot;background:var(--gold);color:#fff&quot;&gt;方便力&lt;br/&gt;&lt;small&gt;(Upaya)&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;←橋接→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;虛妄憶想&lt;br/&gt;名相實執&lt;br/&gt;&lt;small&gt;(Sentient Beings)&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;菩薩在&lt;strong&gt;絕對寂滅&lt;/strong&gt;與&lt;strong&gt;眾生迷情&lt;/strong&gt;之間架起方便力的拱橋，於名字中教令離名字，指示其「本末皆無、自性空故」。&lt;/p&gt;
&lt;h2&gt;第五節　法性的時間觀 · 非智慧力故令空&lt;/h2&gt;
&lt;p&gt;論主進一步從&lt;strong&gt;時間維度&lt;/strong&gt;鞏固這個論述：&lt;/p&gt;
&lt;div class=&quot;verse&quot;&gt;「若法性先無後有，菩薩不能得阿耨多羅三藐三菩提，亦不能以方便力說。」&lt;br/&gt;
「若法性先有後無，眾生及諸法則墮斷滅。」&lt;br/&gt;
「以諸法性先空，中、後亦爾，&lt;strong&gt;非智慧力故令空&lt;/strong&gt;。」&lt;/div&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-left:5px solid var(--accent-red)&quot;&gt;
&lt;h5&gt;✘ 先無後有 (生)&lt;/h5&gt;
&lt;p&gt;若法性是因緣生 → 與凡夫共法無異，菩薩無從證得無上菩提。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-left:5px solid var(--accent-red)&quot;&gt;
&lt;h5&gt;✘ 先有後無 (滅)&lt;/h5&gt;
&lt;p&gt;若法性可被毀滅 → 眾生及諸法皆墮斷滅，違背中道。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-left:5px solid var(--gold)&quot;&gt;
&lt;h5&gt;★ Conclusion · 法性前、中、後無異&lt;/h5&gt;
&lt;p&gt;諸法性&lt;strong&gt;先空、中亦空、後亦空&lt;/strong&gt;。空性不是「智慧力把它變空」，而是「&lt;strong&gt;本來就空&lt;/strong&gt;」。智慧只是讓我們&lt;strong&gt;如實見其本然&lt;/strong&gt;而已。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-7&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第五品 · 第七章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;大乘安穩的極致根基&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;從本已來常空 · 醒夢的絕對安穩&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;h2&gt;第一節　從本已來常空 · 大乘安穩的極致根基&lt;/h2&gt;
&lt;div class=&quot;verse&quot; style=&quot;font-size:24px;color:var(--accent-red);font-weight:700&quot;&gt;
「眾生及諸法非以入無餘涅槃時乃空，&lt;br/&gt;
從本已來常空。」
&lt;/div&gt;
&lt;p&gt;這一句是整品的&lt;strong&gt;終極命題&lt;/strong&gt;。論文點出其重大意義：&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;p&gt;空，並非透過修行才被製造出來的「結果狀態」；空，&lt;strong&gt;從一開始就是法的本然狀態&lt;/strong&gt;。修行不是「把有變成空」(否則便是先有後無，落於斷滅)，而是「&lt;strong&gt;如實看見本來如是的空&lt;/strong&gt;」。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;論文點題&lt;/h5&gt;
&lt;p&gt;空、並非菩薩入滅才產生的狀態。亦非有真實眾生實法之消滅。魔法之力、亦非以諸法以後智慧力而令其變空。&lt;strong&gt;從本已來常空&lt;/strong&gt;——這正是大乘行者最深的安穩根基。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　醒夢的比喻 · 無所失的絕對安穩&lt;/h2&gt;
&lt;p&gt;論文以「&lt;strong&gt;醒夢的比喻&lt;/strong&gt;」說明此一狀態：眾生在輪迴中所失的種種，從究竟的角度看，&lt;strong&gt;並無所失&lt;/strong&gt;——因為從未真實「擁有」過。如同夢中所失，醒來方知未曾真有。&lt;/p&gt;
&lt;div class=&quot;spectrum&quot;&gt;
&lt;div class=&quot;sp-node&quot;&gt;輪迴 / 夢境&lt;br/&gt;&lt;small&gt;(Samsara)&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;sp-mid&quot;&gt;&lt;h5&gt;今無所失&lt;/h5&gt;&lt;small&gt;無實眾生·無實諸法可失&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;sp-node&quot;&gt;實相 / 醒覺&lt;br/&gt;&lt;small&gt;(Nirvana)&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;菩薩教眾生：「&lt;strong&gt;何以不觀其實性而著顛倒？若觀諸法畢竟空性者，則知從本已來常空，今無所失。&lt;/strong&gt;」如是行般若波羅蜜菩薩，則能祐利眾生。&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;「&lt;strong&gt;今無所失&lt;/strong&gt;」四字是大乘修行者面對輪迴時的核心姿態：不是抗拒、不是執取、不是逃避，而是&lt;strong&gt;看見本來如此、安住於本來如此&lt;/strong&gt;。從這個基底起步，菩薩才可能無懼於六道、無厭於輪迴、亦無焦於眾生未度。&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-8&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第五品 · 第八章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;如幻三昧與法界藍圖&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;雙軌並行 · 權實不二 · 全景回顧&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;h2&gt;第一節　最高心法 · 如幻三昧的雙軌並行&lt;/h2&gt;
&lt;p&gt;大乘行者的最高心法即是「&lt;strong&gt;如幻三昧的雙軌並行&lt;/strong&gt;」——內契畢竟空、外現如幻萬行；不離一邊、不執一邊。&lt;/p&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;card&quot; style=&quot;border-left:5px solid var(--gold)&quot;&gt;
&lt;h5&gt;內軌 · 智慧&lt;/h5&gt;
&lt;p&gt;畢竟空 / 知幻&lt;br/&gt;不見有實眾生與定相法&lt;br/&gt;&lt;small&gt;Wisdom Track&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-left:5px solid var(--accentL)&quot;&gt;
&lt;h5&gt;外軌 · 萬行&lt;/h5&gt;
&lt;p&gt;六波羅蜜如幻演出&lt;br/&gt;遊戲諸禪、解脫、三昧&lt;br/&gt;&lt;small&gt;Compassion Track&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　遊戲神通 · 從空性進發的無限萬行&lt;/h2&gt;
&lt;p&gt;因為不見有實體眾生與定相法，菩薩的利他行為不再是沈重的負擔，而轉化為「&lt;strong&gt;遊戲諸禪、解脫、三昧&lt;/strong&gt;」。以無礙的方便力，成就無量眾生。&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot; style=&quot;background:var(--gold);color:#fff;font-weight:700&quot;&gt;畢竟空&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓ 進發&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;布施　持戒　忍辱　精進　禪定　般若 (六波羅蜜)&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;四神足　八背捨　九次第定 (三昧諸法)&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;佛十力　十八不共法　淨佛國土 (究竟果德)&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　總結矩陣 · 權實不二之中道&lt;/h2&gt;
&lt;p&gt;論文以&lt;strong&gt;權實雙軌矩陣&lt;/strong&gt;總結菩薩道：菩薩道並非偏執於空或有，而是在「&lt;strong&gt;實相&lt;/strong&gt;」與「&lt;strong&gt;方便&lt;/strong&gt;」之間保持完美的動態平衡。&lt;/p&gt;
&lt;table style=&quot;width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);margin:18px 0&quot;&gt;
&lt;thead&gt;
&lt;tr style=&quot;background:var(--headGrad);color:#fff&quot;&gt;
&lt;th style=&quot;padding:12px;border:1px solid var(--border);width:18%&quot;&gt;維度&lt;/th&gt;
&lt;th style=&quot;padding:12px;border:1px solid var(--border);width:41%&quot;&gt;實 (Ontology · 畢竟空)&lt;/th&gt;
&lt;th style=&quot;padding:12px;border:1px solid var(--border);width:41%&quot;&gt;權 (Soteriology · 方便力)&lt;/th&gt;
&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td style=&quot;padding:12px;border:1px solid var(--border);font-weight:600;color:var(--accent)&quot;&gt;性質 Nature&lt;/td&gt;
&lt;td style=&quot;padding:12px;border:1px solid var(--border)&quot;&gt;無相、無為、無戲論&lt;/td&gt;
&lt;td style=&quot;padding:12px;border:1px solid var(--border)&quot;&gt;名相假施設、有差別&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td style=&quot;padding:12px;border:1px solid var(--border);font-weight:600;color:var(--accent)&quot;&gt;行法 Practice&lt;/td&gt;
&lt;td style=&quot;padding:12px;border:1px solid var(--border)&quot;&gt;唯住三解脫門&lt;/td&gt;
&lt;td style=&quot;padding:12px;border:1px solid var(--border)&quot;&gt;具足六波羅蜜乃至十八不共法&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td style=&quot;padding:12px;border:1px solid var(--border);font-weight:600;color:var(--accent)&quot;&gt;視角 Perspective&lt;/td&gt;
&lt;td style=&quot;padding:12px;border:1px solid var(--border)&quot;&gt;從本已來常空&lt;/td&gt;
&lt;td style=&quot;padding:12px;border:1px solid var(--border)&quot;&gt;遊戲神通·成就眾生&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td style=&quot;padding:12px;border:1px solid var(--border);font-weight:600;color:var(--accent)&quot;&gt;行者 Mindset&lt;/td&gt;
&lt;td style=&quot;padding:12px;border:1px solid var(--border)&quot;&gt;智者知其無實而不著&lt;/td&gt;
&lt;td style=&quot;padding:12px;border:1px solid var(--border)&quot;&gt;幻師以法娛樂眾人&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;h2&gt;第四節　全景回顧 · 無礙的法界藍圖&lt;/h2&gt;
&lt;p&gt;本品自須菩提的四重悖論起步，每解一重，便揭示中觀視野中一個更深的「&lt;strong&gt;對應原則&lt;/strong&gt;」。論文最後以&lt;strong&gt;法界藍圖&lt;/strong&gt;總攝整品結構：&lt;/p&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;① 破相&lt;/h5&gt;&lt;p&gt;四諦 → 滅諦無相 → 一切無漏皆無相&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;② 攝行&lt;/h5&gt;&lt;p&gt;三解脫門 → 統攝六度乃至十八不共法&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;③ 法性&lt;/h5&gt;&lt;p&gt;體用不二 → 法性遍在 → 無性之性 → 遍學一切法&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h5&gt;④ 如幻&lt;/h5&gt;&lt;p&gt;幻師喻 → 方便力 → 從本已來常空 → 如幻三昧雙軌並行&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;四個模塊並非線性遞進，而是&lt;strong&gt;法界本身的四個面向&lt;/strong&gt;：破相給予正見、攝行給予實踐、法性給予本體、如幻給予中道。任何一面都通向其餘三面，正如「得一即得一切」。&lt;/p&gt;
&lt;h2&gt;第五節　結語 · 若觀諸法畢竟空性者&lt;/h2&gt;
&lt;div class=&quot;verse&quot; style=&quot;font-size:25px;color:var(--accent-red);font-weight:700;border-left-color:var(--gold)&quot;&gt;
「若觀諸法畢竟空性者，&lt;br/&gt;
則知從本已來常空，&lt;br/&gt;
今無所失。」
&lt;/div&gt;
&lt;p&gt;本品至此圓滿。論主以一語為大乘行者點亮中觀的核心姿態——不是抗拒輪迴、不是急求涅槃，而是&lt;strong&gt;在每一念中如實看見本然&lt;/strong&gt;。空非滅、亦非作；空是本來如此。&lt;/p&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;「&lt;strong&gt;如是行般若波羅蜜菩薩，則能祐利眾生。&lt;/strong&gt;」這是論主給出的最終回向：通達畢竟空者，方真能廣利有情。空與行、實與權、智慧與慈悲——在「&lt;strong&gt;正以無相故有三乘諸道&lt;/strong&gt;」的中觀總綱下，融合為一條動態無礙的菩薩道。&lt;/p&gt;
&lt;/div&gt;
&lt;p style=&quot;text-align:center;margin-top:32px;color:var(--gold);letter-spacing:6px;font-size:18px&quot;&gt;— 卷八十九 第五品 終 —&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

  if(!window.frameElement) return;
  document.addEventListener('click',function(e){
    var a=e.target;
    while(a&amp;&amp;a.tagName!=='A') a=a.parentElement;
    if(!a) return;
    var h=a.getAttribute('href');

    }catch(ex){}
  },true);

<button id="backTop" title="回頂">↑</button>
<script>
(function(){
  // 防複製
  var blk=function(e){e.preventDefault();return false;};
  ['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){
    document.addEventListener(ev,blk,true);
  });
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(e.ctrlKey&&(k==='c'||k==='C'||k==='a'||k==='A'||k==='s'||k==='S'||k==='p'||k==='P'||k==='u'||k==='U'||k==='x'||k==='X')){blk(e);}
    if(k==='F12')blk(e);
    if(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C'||k==='K')){blk(e);}
  },true);
  setInterval(function(){
    if(window.getSelection) try{window.getSelection().removeAllRanges();}catch(e){}
  },500);
})();

// sb-brand 平滑回頂
var sbBrand=document.getElementById('sbBrand');
if(sbBrand){
  sbBrand.addEventListener('click',function(e){
    e.preventDefault();
    window.scrollTo({top:0,behavior:'smooth'});
  });
}

// 漢堡選單
var sbToggle=document.getElementById('sbToggle');
var sb=document.getElementById('sb');
if(sbToggle && sb){
  sbToggle.addEventListener('click',function(){
    sb.classList.toggle('open');
  });
}

// iframe 自動高度
function resizeFrame(f){
  try{
    var d=f.contentDocument||f.contentWindow.document;
    if(!d||!d.body) return;
    d.body.style.minHeight='0';
    d.body.style.height='auto';
    if(d.documentElement){
      d.documentElement.style.minHeight='0';
      d.documentElement.style.height='auto';
    }
    var h=d.body.scrollHeight;
    if(h>100){
      f.style.height=h+'px';
      f.style.minHeight='0';
    }
  }catch(e){}
}
function resizeAllFrames(){
  document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
  if(typeof updateProgress==='function') updateProgress();
}
function setupFrame(f){
  var tries=0;
  function tick(){
    tries++;
    resizeFrame(f);
    if(tries<30) setTimeout(tick,200);
  }
  if(f.contentDocument && f.contentDocument.readyState==='complete'){
    tick();
  }else{
    f.addEventListener('load',tick);
  }
}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);

// 進度條
var rpFill=document.getElementById('rpFill');
var rpPct=document.getElementById('rpPct');
function updateProgress(){
  var sh=document.documentElement.scrollHeight-window.innerHeight;
  var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;
  if(rpFill) rpFill.style.width=pct+'%';
  if(rpPct) rpPct.textContent=Math.round(pct)+'%';
}
window.addEventListener('scroll',updateProgress,{passive:true});
updateProgress();

// resize 重算
var rzT;
window.addEventListener('resize',function(){
  clearTimeout(rzT);
  rzT=setTimeout(resizeAllFrames,200);
});

// 錨點防錯跳
document.addEventListener('click',function(e){
  var a=e.target;
  while(a && a.tagName!=='A') a=a.parentElement;
  if(!a) return;
  var h=a.getAttribute('href');
  if(!h||h.charAt(0)!=='#'||h.length<2) return;
  var id=h.substring(1);
  var el=document.getElementById(id);
  if(!el) return;
  e.preventDefault();
  resizeAllFrames();
  setTimeout(function(){
    resizeAllFrames();
    var rect=el.getBoundingClientRect();
    var y=window.scrollY+rect.top-20;
    window.scrollTo({top:y,behavior:'smooth'});
  },60);
},true);

// 持續 polling 前 15 秒
var _rt=0,_riv=setInterval(function(){
  _rt++; resizeAllFrames();
  if(_rt>50) clearInterval(_riv);
},300);

// backTop
var backTop=document.getElementById('backTop');
window.addEventListener('scroll',function(){
  if(!backTop) return;
  if(window.scrollY>600) backTop.classList.add('show');
  else backTop.classList.remove('show');
},{passive:true});
if(backTop){
  backTop.addEventListener('click',function(){
    window.scrollTo({top:0,behavior:'smooth'});
  });
}

// sidebar active 高亮
function updateActive(){
  var chs=document.querySelectorAll('section.chapter');
  var threshold=window.innerHeight*0.35;
  var active=null;
  chs.forEach(function(c){
    if(c.getBoundingClientRect().top<threshold) active=c;
  });
  document.querySelectorAll('.sb-item').forEach(function(it){
    it.classList.remove('active');
  });
  if(active){
    var id=active.id;
    var item=document.querySelector('.sb-item[data-ch="'+id+'"]');
    if(item){
      item.classList.add('active');
      var sb=document.getElementById('sb');
      if(sb){
        var rect=item.getBoundingClientRect();
        var sbRect=sb.getBoundingClientRect();
        if(rect.top<sbRect.top+50 || rect.bottom>sbRect.bottom-50){
          sb.scrollTop+=rect.top-sbRect.top-sbRect.height/2;
        }
      }
    }
  }
}
window.addEventListener('scroll',updateActive,{passive:true});
updateActive();
</script>
</body>
