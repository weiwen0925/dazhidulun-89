<body><script id="wy-mainprot">(function(){
var KEY='wy89fp';
var ALLOWED_HOST='weiwen0925.github.io';
var ALLOWED_PATH='/dazhidulun-89/';

/* ============ 失敗處理：靜默 close + about:blank（無警告 / 無空白）============ */
var __wyDead=false;
function _silentLock(){
  if(__wyDead) return;
  __wyDead=true;
  try{document.documentElement.innerHTML='';}catch(e){}
  try{window.stop&&window.stop();}catch(e){}
  try{window.close();}catch(e){}

try{

  var bad=(navigator.webdriver===true)
    || /HeadlessChrome|PhantomJS|Selenium|puppeteer|playwright|Slimer|electron/i.test(ua)
    || (window.outerWidth===0 && window.outerHeight===0);
  if(bad){_silentLock();return;}
}catch(e){_silentLock();return;}

/* ============ L4 · Origin Lock（同步檢查）============ */
try{
  var h=location.hostname||'';
  var p=location.pathname||'';
  if(h!==ALLOWED_HOST || p.indexOf(ALLOWED_PATH)!==0){
    _silentLock();return;

}catch(e){_silentLock();return;}

/* ============ L2 · 列印攔截（靜默，無警告）============ */
try{
  var _origPrint=window.print;
  window.print=function(){};
  Object.defineProperty(window,'print',{value:function(){},writable:false,configurable:false});
}catch(e){}
document.addEventListener('keydown',function(e){
  var k=e.key||'';
  if((e.metaKey||e.ctrlKey) && (k==='p'||k==='P'||k==='s'||k==='S'||k==='u'||k==='U'||k==='a'||k==='A'||k==='c'||k==='C')){
    e.preventDefault();e.stopPropagation();return false;
  }
  if(k==='F12'){e.preventDefault();e.stopPropagation();return false;}

},true);
['contextmenu','copy','cut','dragstart'].forEach(function(ev){
  document.addEventListener(ev,function(e){e.preventDefault();return false;},true);
});

/* ============ L1/L5 · 解碼器 ============ */
function _wyDec(s){
  try{
    var raw=atob(s);
    var bytes=new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++){
      bytes[i]=raw.charCodeAt(i)^KEY.charCodeAt(i%KEY.length);
    }
    return new TextDecoder('utf-8').decode(bytes);
  }catch(e){return '';}
}
function _wyDecodeAll(){
  var nodes=document.querySelectorAll('[data-c]');
  for(var i=0;i<nodes.length;i++){
    try{
      var c=nodes[i].getAttribute('data-c');
      if(!c) continue;
      nodes[i].innerHTML=_wyDec(c);
      nodes[i].removeAttribute('data-c');
    }catch(e){}
  }
}

/* ============ L6 · 線上活性驗證（HEAD ping）============ */
var __wyReady=new Promise(function(resolve,reject){

  if(ctrl) opt.signal=ctrl.signal;

  }).catch(function(){

    reject(new Error('freshness_fail'));
  });
});
window.__wyReady=__wyReady;

/* ============ Pre-guard 解除（顯示頁面）============ */
function _reveal(){
  try{
    var pg=document.getElementById('wy-preguard');
    if(pg) pg.parentNode.removeChild(pg);
    document.documentElement.style.visibility='visible';
    document.body && (document.body.style.visibility='visible');

/* ============ 啟動序列：DOMContentLoaded + L6 通過 → 解碼 → 顯示 ============ */
function _start(){
  __wyReady.then(function(){
    _wyDecodeAll();
    _reveal();
  }).catch(function(){
    _silentLock();
  });
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',_start);
}else{

}

/* ============ 防禦性：DevTools 偵測（尺寸異常）============ */

/* classical / verse */
.classical-text{background:#FFFDF5;border:1px solid #E8E0D0;border-radius:10px;padding:20px 26px;margin:18px 0;line-height:1.95;position:relative;}
.text-label{display:inline-block;background:linear-gradient(135deg,#3d3225,#5a4e3a);color:#fff;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:12px;padding:3px 14px;border-radius:14px;letter-spacing:3px;margin-bottom:12px;}
.classical-text p{margin-bottom:10px;font-size:17px;line-height:2;color:var(--text);}
.verse,.gatha,blockquote{background:var(--verseBg);border-left:4px solid var(--verseBd);padding:14px 22px;margin:16px 0;line-height:2;white-space:normal;text-align:center;font-style:normal;font-size:18.5px;color:var(--text2);}

/* card */
.card,.insight,.commentary,.note,.metaphor{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 22px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.insight{border-left:4px solid var(--gold);background:linear-gradient(135deg,#fffdf5,#fbf6e8);}
.insight-title{font-size:18px;color:var(--accent);font-weight:600;margin-bottom:8px;letter-spacing:1px;}
.insight-content,.card-content{font-size:16.5px;line-height:1.95;color:var(--text2);}
.metaphor{border-left:4px solid var(--accentL);background:#fbf5e6;}

/* grid layouts */
.four-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0;}
.cell,.gx-cell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 20px;}
.cell .num{font-family:&quot;Noto Sans TC&quot;,sans-serif;color:var(--gold);font-weight:700;font-size:14px;letter-spacing:2px;margin-bottom:6px;}
.cell .term{font-size:18px;color:var(--accent);font-weight:600;margin-bottom:6px;letter-spacing:1px;}
.cell .desc{font-size:15.5px;color:var(--text2);line-height:1.85;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:18px 0;}
.col,.col-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;}
.col-title{font-size:17px;color:var(--accent);font-weight:600;margin-bottom:8px;letter-spacing:1px;}
.col-content{font-size:15.5px;color:var(--text2);line-height:1.85;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0;}

/* flow */
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:20px 0;}
.flow.flow-v{flex-direction:column;align-items:stretch;}
.flow-box,.flow-step{background:var(--card);border:2px solid var(--gold);border-radius:10px;padding:14px 22px;text-align:center;font-size:16px;font-weight:600;color:var(--accent);min-width:140px;}
.flow-box small,.flow-step small{display:block;font-size:13px;color:var(--text-muted);font-weight:400;margin-top:4px;letter-spacing:.5px;}
.flow-arrow{color:var(--gold);font-size:24px;font-weight:700;}
.flow.flow-v .flow-arrow{font-size:28px;}

/* qa */
.qa{margin:18px 0;}
.qa .q{padding:12px 18px;background:#eef5fb;border-left:4px solid #5478a8;color:#1d3a5e;border-radius:4px;margin-bottom:6px;line-height:1.9;}
.qa .a{padding:12px 18px;background:#fbf5e6;border-left:4px solid var(--accent);color:var(--text);border-radius:4px;line-height:1.9;}

/* venn */
.venn-wrap{position:relative;display:flex;justify-content:center;align-items:center;min-height:240px;gap:0;margin:24px 0;}
.venn-circle{display:flex;flex-direction:column;align-items:center;justify-content:center;width:220px;height:220px;border-radius:50%;border:2.5px solid var(--gold);background:rgba(184,134,11,.08);font-size:16px;line-height:1.55;padding:0 22px;box-sizing:border-box;gap:6px;color:var(--accent);font-weight:600;}
.venn-circle br{display:none;}
.venn-circle small{font-size:12.5px;display:block;width:100%;text-align:center;line-height:1.4;color:var(--text-muted);font-weight:400;}
.venn-a{margin-right:-50px;}
.venn-b{margin-left:-50px;background:rgba(196,149,106,.1);border-color:var(--accentL);}
.venn-mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;background:#fff;border:2px dashed var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--accent);text-align:center;letter-spacing:1px;z-index:2;}

/* spectrum */
.spectrum{display:flex;align-items:center;gap:0;margin:24px 0;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.sp-node{flex:1;padding:18px 14px;text-align:center;font-size:15.5px;}
.sp-edge{background:#f0e8d8;color:var(--text-muted);}
.sp-mid{background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff!important;font-weight:700;}
.sp-mid h5,.sp-mid *{color:#fff!important;text-shadow:0 1px 3px rgba(0,0,0,.35);}
.sp-mid small{color:rgba(255,255,255,.92)!important;}

/* matrix */
.matrix-2x2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0;}
.matrix-cell{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 22px;}
.matrix-cell .mc-title{font-size:16px;color:var(--gold);font-weight:700;margin-bottom:6px;letter-spacing:1.5px;font-family:&quot;Noto Sans TC&quot;,sans-serif;}
.matrix-cell .mc-en{font-size:12.5px;color:var(--text-muted);font-style:italic;margin-bottom:8px;letter-spacing:.5px;}
.matrix-cell .mc-body{font-size:15px;color:var(--text2);line-height:1.85;}

/* compare table */
.compare-table{width:100%;border-collapse:collapse;margin:20px 0;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.compare-table th,.compare-table td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--border-light);font-size:15.5px;line-height:1.85;}
.compare-table th{background:linear-gradient(135deg,#3d3225,#5a4e3a);color:#fff;letter-spacing:2px;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-weight:600;font-size:14.5px;text-align:center;}
.compare-table tr:last-child td{border-bottom:0;}
.compare-table .row-head{font-weight:600;color:var(--accent);background:#fbf5e6;}

/* circle ring (修道不得果) */
.ring4{display:grid;grid-template-areas:&quot;. top .&quot; &quot;left center right&quot; &quot;. bottom .&quot;;grid-template-columns:1fr 1.3fr 1fr;gap:12px;margin:24px auto;max-width:560px;align-items:center;justify-items:center;}
.ring4 .r-top{grid-area:top;}.ring4 .r-bottom{grid-area:bottom;}.ring4 .r-left{grid-area:left;}.ring4 .r-right{grid-area:right;}.ring4 .r-center{grid-area:center;}
.ring-node{background:var(--card);border:2px solid var(--accentL);border-radius:50%;width:130px;height:130px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14.5px;color:var(--accent);font-weight:600;line-height:1.5;padding:8px;}
.ring-center{width:160px;height:160px;background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff!important;border:none;font-size:15px;font-weight:700;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.3);}
.ring-center small{display:block;font-size:11.5px;opacity:.92;margin-top:4px;letter-spacing:.5px;}

/* mobius */
.mobius-banner{background:linear-gradient(135deg,#fffdf5 0%,#f5ecd8 50%,#fffdf5 100%);border:1px solid var(--gold);border-radius:14px;padding:26px 30px;margin:22px 0;text-align:center;}
.mobius-banner h4{color:var(--accent);margin-bottom:10px;font-size:19px;}
.mobius-banner .infinity{font-size:64px;color:var(--gold);line-height:1;margin:8px 0;}
.mobius-banner p{font-size:16.5px;color:var(--text2);margin:0;}

/* read-progress */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;background:rgba(30,26,20,.92);color:var(--gold);padding:8px 22px;border-radius:30px;border:1px solid rgba(184,134,11,.5);box-shadow:0 4px 18px rgba(0,0,0,.25);font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:13px;letter-spacing:2px;display:flex;align-items:center;gap:12px;pointer-events:none;user-select:none;backdrop-filter:blur(6px);}
.read-progress .rp-bar{width:140px;height:3px;background:rgba(212,196,168,.18);border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;}
.read-progress .rp-label{font-size:11px;opacity:.75;letter-spacing:3px;}

/* back to top */
#backTop{position:fixed;right:20px;bottom:24px;z-index:120;width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:20px;cursor:pointer;display:none;box-shadow:0 4px 14px rgba(91,58,41,.3);transition:.25s;}
#backTop:hover{background:var(--gold);transform:translateY(-3px);}
#backTop.show{display:block;}

/* footer */
.site-footer{background:var(--sbBg);color:rgba(212,196,168,.7);text-align:center;padding:40px 22px 60px;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:13.5px;letter-spacing:2px;line-height:1.95;}
.site-footer .gatha-end{font-family:&quot;Noto Serif TC&quot;,serif;font-style:normal;font-size:16px;color:var(--goldL);margin-bottom:18px;letter-spacing:4px;line-height:2;}
.site-footer hr{border:0;border-top:1px solid rgba(212,168,75,.2);margin:18px auto;max-width:340px;}

/* responsive */
@media(max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .25s;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:block;}
  .main{margin-left:0;}
  .hero-title{font-size:42px;letter-spacing:4px;}
  .ch-name{font-size:28px;}
  .four-grid,.three-col,.two-col,.matrix-2x2{grid-template-columns:1fr;}
  .venn-wrap{flex-direction:column;gap:10px;min-height:auto;}
  .venn-a,.venn-b{margin:0;}
  .venn-mid{position:static;transform:none;margin:8px auto;}
  .ring4{grid-template-columns:1fr;grid-template-areas:&quot;top&quot; &quot;left&quot; &quot;center&quot; &quot;right&quot; &quot;bottom&quot;;}
}

}

&lt;div class=&quot;preface&quot;&gt;
&lt;h2 class=&quot;preface-title&quot;&gt;編 者 前 言&lt;/h2&gt;
&lt;p&gt;本卷為《大智度論》卷八十九，是「釋四攝品第七十八」的續末段。雖名為「之餘」，論主在此並未停留於四攝法的細目補述，而是借「八十隨形好 → 四攝法 → 四十二字門 → 不可得 → 不縛不脫 → 不住諸法相 → 二諦對照 → 修道不得果 → 無所著」這一連貫推論，把整部《般若》的中觀架構，凝縮為一個能反覆運轉的閉迴路。&lt;/p&gt;
&lt;p&gt;整卷由三大模塊銜接：第一模塊「&lt;strong&gt;建立世俗諦&lt;/strong&gt;」承接前品，把菩薩有為法推到極致——身相（八十隨形好）、行為（四攝法）、語言（四十二字門）三者層層升華；第二模塊「&lt;strong&gt;辯證的樞紐&lt;/strong&gt;」由須菩提「不可得」逆推 + 佛陀以「空性矩陣」全面印可，把世俗諦解構為自性不可得；第三模塊「&lt;strong&gt;第一義諦的解構&lt;/strong&gt;」展開二諦對照、凡聖差別、修道不得果，最終以「一相無相 → 無所著清淨運作」收束，使行動與空性無縫銜接。&lt;/p&gt;
&lt;p&gt;三大模塊在邏輯上並非線性，而是莫比烏斯環式的迴圈：世俗諦的極致建立 → 第一義諦的徹底解構 → 又重新落回不二的實踐。般若波羅蜜並非停滯於「畢竟空」，而是透過「不可得」的機制完美貫穿世俗諦的菩薩行——這就是論主在本卷所要呈現的「中觀幾何」。&lt;/p&gt;
&lt;p&gt;本網頁將卷八十九第0品依此論文邏輯，劃分為七章二十一節：序論先給出全卷的幾何拓樸（中觀莫比烏斯環），第二章建立世俗諦三層極致，第三章引爆「不可得」辯證，第四章以四象限空性矩陣全面印可，第五章證成色與法性的本體不二，第六章展開二諦邏輯與凡聖之別的五層細辯，第七章以「無所著」收歸於菩薩的終極運作系統。經文原典按段插入對應章節，論文圖示則以網頁元件忠實重現其論證骨幹。&lt;/p&gt;
&lt;/div&gt;

&lt;section class=&quot;chapter&quot; id=&quot;chapter-1&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第0品 · 第一章&lt;/div&gt;
&lt;h2 class=&quot;ch-name&quot;&gt;序論：辯證之鏡與中觀幾何&lt;/h2&gt;
&lt;div class=&quot;ch-sub&quot;&gt;中觀莫比烏斯環 · 全卷論證軌跡縱覽&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;本章要旨&lt;/div&gt;
&lt;p&gt;本章為全卷論證的鳥瞰：先以「中觀的莫比烏斯環」勾畫卷八十九所要呈現的整體幾何——世俗諦的建立、第一義諦的解構、與不二實踐三圈無縫接合的閉迴路；再交代從「八十隨形好」到「無所著」的論證軌跡為何必須這樣推進。掌握此圖以後，後續六章每一節都是這個迴圈的一個點。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　中觀的莫比烏斯環 · 形式、空性與行動的無縫迴圈&lt;/h2&gt;
&lt;p&gt;《大智度論》卷八十九的論證骨幹，可以用一個三圈交織的迴圈來表示。第一圈是「&lt;strong&gt;建立世俗諦&lt;/strong&gt;」——把菩薩在世間最完美的形相（八十隨形好）、最極致的行動方式（四攝法）、與最究極的語言成就（四十二字門與無字法）一一推到頂點；第二圈是「&lt;strong&gt;第一義諦的解構&lt;/strong&gt;」——以「不可得」與「十八空」全面拆解前述世俗諦的自性執取；第三圈是「&lt;strong&gt;不二的實踐&lt;/strong&gt;」——以「化人化化人」「不住法」「二諦並行」三個機制，把前兩圈重新黏合為菩薩道的真實運作。&lt;/p&gt;
&lt;div class=&quot;mobius-banner&quot;&gt;
&lt;h4&gt;中觀莫比烏斯環&lt;/h4&gt;
&lt;div class=&quot;infinity&quot;&gt;∞&lt;/div&gt;
&lt;p&gt;建立世俗諦 — 第一義諦的解構 — 不二的實踐&lt;br/&gt;三圈接成一個沒有正反面的單一曲面&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;three-col&quot;&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;建立世俗諦&lt;/div&gt;
&lt;div class=&quot;col-content&quot;&gt;八十隨形好（身相）／四攝法（行為）／四十二字門（語言）三層極致，將菩薩的有為法推到飽和。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;第一義諦的解構&lt;/div&gt;
&lt;div class=&quot;col-content&quot;&gt;須菩提五重逆推「不可得」 + 佛陀以「空性矩陣」全面印可 + 十八空徹底拆解自性。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;不二的實踐&lt;/div&gt;
&lt;div class=&quot;col-content&quot;&gt;化人化化人、不住法、二諦並行——既不停留於「畢竟空」，又不落於有為法的執取。&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;中觀幾何的核心命題&lt;/div&gt;
&lt;div class=&quot;insight-content&quot;&gt;般若波羅蜜並非停滯於「畢竟空」，而是透過「不可得」的機制，&lt;strong&gt;完美貫穿世俗諦的菩薩行&lt;/strong&gt;。形式（有為）、空性（無為）、行動（菩薩道）三者，在中觀的莫比烏斯環上沒有正反面，順任一方向走完一圈，必定回到原點，又從原點出發。&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　從「八十隨形好」到「無所著」的論證軌跡&lt;/h2&gt;
&lt;p&gt;論主在卷八十九的論述順序，並非偶然。它從「&lt;strong&gt;佛身的視覺極致&lt;/strong&gt;」開始（八十隨形好），轉到「&lt;strong&gt;菩薩的行動極致&lt;/strong&gt;」（四攝法），再進到「&lt;strong&gt;語言的極致&lt;/strong&gt;」（四十二字門與無字法）；接著由須菩提發難，逆推出「眾生 → 五眾 → 六波羅蜜 → 八十隨形好 → 菩薩法」&lt;strong&gt;五重不可得&lt;/strong&gt;；佛陀以四象限空性矩陣全面印可，並以「化人化化人」的譬喻說明「行動發生但無實體執著」；之後展開二諦對照、凡聖差別、修道不得果、無為法無分別等五層細辯，最終以「一相所謂無相 → 無所著」收歸全卷。&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;八十隨形好&lt;small&gt;佛身的視覺極致&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;四攝法&lt;small&gt;菩薩的行動極致&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;四十二字門 / 無字法&lt;small&gt;語言的極致&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;五重不可得&lt;small&gt;須菩提的辯證樞紐&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;空性矩陣&lt;small&gt;佛陀的全面印可&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;不縛不脫 · 不住法&lt;small&gt;實踐的力學&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;二諦對照 · 凡聖之別&lt;small&gt;認識論的細辯&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;一相無相 · 無所著&lt;small&gt;運作的圓滿&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;metaphor&quot;&gt;
&lt;h5&gt;論證軌跡的設計意圖&lt;/h5&gt;
&lt;p&gt;三層世俗諦極致 → 五重不可得 → 四象限空性矩陣 → 二諦五層細辯 → 一相無相，這個推進是&lt;strong&gt;結構性的&lt;/strong&gt;而非鋪陳性的。每一層極致都被下一階段反向解構，每一輪解構又回到更高階的實踐——讀者跟著走完一遍，就會親身體會「中觀並不是否定有為，而是讓有為與無為在『不可得』的機制中無縫運轉」。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;bridge bridge-outro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;承先啟後&lt;/div&gt;
&lt;p&gt;下一章正式進入第一圈「建立世俗諦」，依序分析八十隨形好的幾何拓樸、四攝法的社會動力學、與四十二字門的語言奇點——這三層是菩薩有為法在卷八十九所達到的飽和狀態，也是後續所有解構的基準點。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-2&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第0品 · 第二章&lt;/div&gt;
&lt;h2 class=&quot;ch-name&quot;&gt;建立世俗諦：菩薩有為法的極致&lt;/h2&gt;
&lt;div class=&quot;ch-sub&quot;&gt;八十隨形好 · 四攝法 · 四十二字門 三層極致&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;本章要旨&lt;/div&gt;
&lt;p&gt;本章對應 PDF 模塊一的後三張投影片（p-03 八十隨形好幾何、p-04 四攝法社會動力學、p-05 四十二字門語言奇點）與經文起首三段。要旨在於：論主先把世俗諦的菩薩道推到飽和——身相、行為、語言三者皆達極致——讀者必須先充分理解這個飽和狀態，才能體會接下來「不可得」辯證的衝擊力。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　八十隨形好 · 幾何與能量拓撲&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;「云何為八十隨形好？一者、無見頂；二者、鼻直高好，孔不現；三者、眉如初生月，紺琉璃色；四者、耳輪埵成；五者、身堅實，如那羅延；六者、骨際如鉤鎖；七者、身一時迴如象王；八者、行時足去地四寸，而印文現……（中略）……七十六者、髮長好；七十七者、髮不亂；七十八者、髮旋好；七十九者、髮色好如青珠；八十者、手足有德相。須菩提！是八十隨形好，佛身成就。」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;論主將佛陀的八十種微細身相，視為「世俗諦的視覺極致」。PDF 將其依功能拓撲化為三大群組——&lt;strong&gt;身堅實&lt;/strong&gt;、&lt;strong&gt;威儀與音聲&lt;/strong&gt;、&lt;strong&gt;邊光與香氣&lt;/strong&gt;——三者並非任意分類，而是對應佛身對眾生產生作用的三個物理層面：結構張力、感官接收、能量輻射。&lt;/p&gt;
&lt;div class=&quot;three-col&quot;&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;身堅實 · 結構的完整&lt;/div&gt;
&lt;div class=&quot;col-content&quot;&gt;骨際如鉤鎖、身堅實如那羅延、身不傾動。&lt;br/&gt;&lt;br/&gt;佛身的力學基礎——即使在最微細的關節結構上也維持絕對的穩定，象徵世俗諦在物質層面的飽和。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;威儀與音聲 · 感官的圓滿&lt;/div&gt;
&lt;div class=&quot;col-content&quot;&gt;面淨滿如月、音響深、一發音報眾聲。&lt;br/&gt;&lt;br/&gt;佛身對眾生感官端的飽和——視覺與聽覺都達到最圓滿的接收狀態。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;邊光與香氣 · 能量的光輝&lt;/div&gt;
&lt;div class=&quot;col-content&quot;&gt;毛孔出香氣、邊光各一丈、光照身而行。&lt;br/&gt;&lt;br/&gt;佛身的能量輻射——超出物理身體之外的影響半徑，是世俗諦能量層面的飽和。&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;為何須先極致地「立有」？&lt;/div&gt;
&lt;div class=&quot;insight-content&quot;&gt;中觀的辯證並非從「空」開始，而是從「最完整的有」開始。八十隨形好把「佛身」這個世俗諦現象推到能想像的飽和——只有先承認這個飽和，才能在第三章須菩提發難時，使「眾生不可得 → 八十隨形好亦不可得」的逆推產生最大的辯證張力。&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　四攝法 · 菩薩的社會動力學&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;「如是，須菩提！菩薩摩訶薩以二施攝取眾生，所謂財施、法施，是為菩薩希有難及事。云何為菩薩摩訶薩愛語攝取眾生？菩薩摩訶薩以六波羅蜜為眾生說法，作是言：『汝行六波羅蜜，攝一切善法。』云何為菩薩摩訶薩利行攝取眾生？菩薩摩訶薩長夜教眾生，令行六波羅蜜。云何為菩薩摩訶薩同事攝取眾生？菩薩摩訶薩以五神通力故種種變化，入五道中，與眾生同事。以此四事而攝取之。」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;從佛身的視覺極致，論主轉入菩薩的&lt;strong&gt;行動極致&lt;/strong&gt;。四攝法不是任意排列，而是按「&lt;strong&gt;外在資源 → 概念引導 → 持續陶冶 → 本體認同&lt;/strong&gt;」的層層深化。PDF 用一個垂直流程圖呈現此動力學：從布施的資源的交換開始，最終深化為以五神通力進入五道的本體認同。&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;布 施&lt;small&gt;以二施（財施、法施）攝取眾生 · 資源的交換&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;愛 語&lt;small&gt;為眾生說法：「汝行六波羅蜜，攝一切善法」 · 概念的引導&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;利 行&lt;small&gt;長夜教眾生，令行六波羅蜜 · 持續的行為陶養&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;同 事&lt;small&gt;以五神通力種種變化，入五道中與眾生同事 · 以神通入本體的同化&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;metaphor&quot;&gt;
&lt;h5&gt;從資源給予到本體認同&lt;/h5&gt;
&lt;p&gt;四攝法呈現菩薩攝取眾生的&lt;strong&gt;遞進深度&lt;/strong&gt;：第一階是物質與道理的給予（布施），第二階是概念框架的引導（愛語），第三階是長期行為陶養（利行），第四階則是「以神通入五道與眾生同事」——從外在給予深化到本體層面的認同。這四階並非選項，而是同一過程的不同深度。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　四十二字門與無字法 · 語言的奇點&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;「復次，須菩提！菩薩摩訶薩行般若波羅蜜時，教化眾生：『善男子！當善學分別諸字，亦當善知一字乃至四十二字。一切語言，皆入初字門；一切語言，亦入第二字門；乃至第四十二字門，一切語言皆入其中。一字皆入四十二字，四十二字亦入一字。』是眾生應如是善學四十二字。善學四十二字已，能善說字法；善說字法已，善說無字法。須菩提！如佛善知字法、善知字、善知無字，為無字法故說字法。何以故？須菩提！過一切名字故，名為佛法。」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;第三層極致進入&lt;strong&gt;語言&lt;/strong&gt;。論主先確立一個結構命題：一切語言 → 皆入初字門 → 第二字門 → ……第四十二字門；同時「一字皆入四十二字，四十二字亦入一字」——語言系統具有&lt;strong&gt;全息對應性&lt;/strong&gt;。但這個結構並非自我滿足，它最終的指向是&lt;strong&gt;自我解構&lt;/strong&gt;——「善說字法已，善說無字法」。&lt;/p&gt;
&lt;div class=&quot;flow&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;一切語言&lt;small&gt;世間表達的全部&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;皆入初字門&lt;small&gt;進入語言的入口&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;四十二字門&lt;small&gt;一字↔四十二字&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;善說無字法&lt;small&gt;過一切名字&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;名為佛法&lt;small&gt;過一切名字&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;語言的奇點 — 自我解構&lt;/div&gt;
&lt;div class=&quot;insight-content&quot;&gt;「過一切名字故，名為佛法」是一個語言的奇點：論主刻意讓佛陀精通字法的目的，是&lt;strong&gt;為了通達「無字」&lt;/strong&gt;。這意味著最高的語言成就不是更精緻的表達，而是進入語言所不能到達之處。佛法之所以名為佛法，正是因為它「&lt;strong&gt;過一切名字&lt;/strong&gt;」——這預告了下一章須菩提的「不可得」推論：如果連名字都過了，眾生、五眾、菩薩法又何能「可得」？&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;metaphor&quot;&gt;
&lt;h5&gt;三層極致的逐層升華&lt;/h5&gt;
&lt;p&gt;第二章三節依序呈現了世俗諦的三個飽和層面：身（隨形好的能量拓撲）、行（四攝法的社會動力）、語（四十二字門的全息結構）。&lt;strong&gt;三者層層升華&lt;/strong&gt;，到了「過一切名字」這裡，世俗諦自身已開始向第一義諦傾斜。下一章，須菩提便正式發難。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;bridge bridge-outro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;承先啟後&lt;/div&gt;
&lt;p&gt;讀者若有跟著走完三層極致，會察覺一個共同特質：這三層各自完美，但都已暗暗指向自身的解構——隨形好的「無見頂」是視覺的隱沒、四攝法的「同事」是身分的消解、四十二字門的「無字法」是語言的退場。下一章，須菩提正是抓住這個傾向，逆推出「眾生畢竟不可得 → 一切都不可得」的辯證樞紐。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-3&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第0品 · 第三章&lt;/div&gt;
&lt;h2 class=&quot;ch-name&quot;&gt;辯證的樞紐：須菩提的「不可得」推論&lt;/h2&gt;
&lt;div class=&quot;ch-sub&quot;&gt;五重逆推 · 菩薩尚不可得，何況菩薩法&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;本章要旨&lt;/div&gt;
&lt;p&gt;本章對應 PDF p-06 與經文第八段。須菩提先承認「畢竟空、無始空故」，然後以五重逆推：眾生→五眾→六波羅蜜→八十隨形好→菩薩法皆不可得。這是全卷邏輯的樞紐——前兩章建立的世俗諦極致，在此被一次性逆向折疊。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　五重逆推 · 眾生 → 五眾 → 六度 → 隨形好 → 菩薩法&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;須菩提白佛言：「世尊！若眾生畢竟不可得，法亦不可得，法性亦不可得，畢竟空故、無始空故。世尊！菩薩摩訶薩行般若波羅蜜，行禪波羅蜜、毘梨耶波羅蜜、羼提波羅蜜、尸羅波羅蜜、檀波羅蜜時，行四禪、四無量心、四無色定，三十七助道法，十八空，行空、無相、無作三昧，八背捨、九次第定，佛十力、四無所畏、四無礙智、十八不共法、三十二相、八十隨形好，云何住報得五神通為眾生說法？眾生實不可得；眾生不可得故，色不可得，乃至識亦不可得；五眾不可得故，六波羅蜜乃至八十隨形好皆不可得。是不可得中，無眾生、無色乃至無八十隨形好。世尊！云何菩薩摩訶薩行般若波羅蜜，為眾生說法？世尊！菩薩行般若波羅蜜時，菩薩尚不可得，何況當有菩薩法！」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;須菩提的詰問並非情緒的反問，而是一個&lt;strong&gt;嚴格的逆向骨牌&lt;/strong&gt;。他先確立大前提「畢竟空、無始空故」，再從「眾生不可得」出發，依次推倒：&lt;/p&gt;
&lt;div class=&quot;flow&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;眾生畢竟&lt;br/&gt;不可得&lt;small&gt;畢竟空 · 無始空&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;五眾&lt;br/&gt;不可得&lt;small&gt;色不可得 乃至 識不可得&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;六波羅蜜乃至&lt;br/&gt;八十隨形好皆不可得&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;菩薩尚不可得&lt;br/&gt;何況當有菩薩法&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;為何能一路推倒？&lt;/div&gt;
&lt;div class=&quot;insight-content&quot;&gt;關鍵在於須菩提引用的兩個前提：「&lt;strong&gt;畢竟空&lt;/strong&gt;」與「&lt;strong&gt;無始空&lt;/strong&gt;」。前者切斷「自性自起」的可能（無自性立足點），後者切斷「外因相續」的可能（無時間中斷面）。一旦兩個前提成立，世俗諦中任何「能取所取」的分立都會自動崩塌——眾生不能成立，依眾生而起的識、五眾、六度、隨形好就一一不能獨立成立。這是中觀方法論在卷八十九的最簡明示範。&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　菩薩尚不可得 · 何況當有菩薩法&lt;/h2&gt;
&lt;p&gt;須菩提把推論推到極致：&lt;strong&gt;連「菩薩」這個能行者本身都不可得，何況菩薩所行的法？&lt;/strong&gt;這是辯證的最後一格——若連執行主體都崩塌，整個世俗諦的菩薩道在邏輯上似乎完全失效。&lt;/p&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;div class=&quot;q&quot;&gt;問：若一切皆不可得，菩薩如何「住報得五神通」為眾生說法？&lt;/div&gt;
&lt;div class=&quot;a&quot;&gt;須菩提自己給出問題的形式，但故意不給答案——他把這個答案留給佛陀。這個發難的策略性：以最徹底的不可得，逼佛陀必須給出一個能容納「不可得 + 仍能行菩薩道」的高階答案。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;metaphor&quot;&gt;
&lt;h5&gt;辯證樞紐的方法論意義&lt;/h5&gt;
&lt;p&gt;須菩提的詰問展現了中觀辯證的標準操作：&lt;strong&gt;先承認對方的前提，再用對方的邏輯推到對方無法承受的結論&lt;/strong&gt;。前兩章看似建立了堅固的世俗諦菩薩道，這裡只用一個「畢竟空、無始空故」就讓全部論題搖搖欲墜。但這不是要否定菩薩道——這是要逼出一個比「自性建立」更深的承載結構，那就是下一章佛陀的「&lt;strong&gt;空性矩陣&lt;/strong&gt;」。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;bridge bridge-outro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;承先啟後&lt;/div&gt;
&lt;p&gt;須菩提的逆推到「菩薩尚不可得」便戛然而止。下一章，佛陀以「如是！如是！如汝所言」全面接受須菩提的前提，但接著啟動一個橫跨本體論／現象論／主體性／道與果的「空性矩陣」，把「不可得」從問題轉化為菩薩道的運作機制。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-4&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第0品 · 第四章&lt;/div&gt;
&lt;h2 class=&quot;ch-name&quot;&gt;佛陀的印可：全面啟動的空性矩陣&lt;/h2&gt;
&lt;div class=&quot;ch-sub&quot;&gt;本體 · 現象 · 主體 · 道果 四象限&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;本章要旨&lt;/div&gt;
&lt;p&gt;本章對應 PDF p-07~p-10 與經文第九至十三段。佛陀並未轉換立場去否認須菩提，而是以「如是！如是！」全面接受並擴大其結論——將「不可得」展開為四象限的空性矩陣（本體／現象／主體／道果），再以「化人化化人」的譬喻說明行動如何在空性中發生，最後給出「不縛不脫」與「不住法住諸法相」兩個運作公式。這是全卷最關鍵的轉折——須菩提的問題在此變成菩薩道的解答。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　空性矩陣四象限 · 本體 / 現象 / 主體 / 道果&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;佛告須菩提：「如是！如是！如汝所言。眾生不可得故，當知是內空、外空、內外空、空空、大空、第一義空、有為空、無為空、畢竟空、無始空、散空、諸法空、自相空、性空、不可得空、無法空、有法空、無法有法空。當知五陰空、十二入空、十八界空，十二因緣空、四諦空，我空，壽者、命者、生者、養者、育者、眾數者、人者、作者、使作者、起者、使起者、受者、使受者、知者、見者皆空。眾生不可得故，當知四禪空、四無量心空、四無色定空，當知四念處空乃至八聖道分空，空空、無相空、無作空，八背捨空、九次第定空。眾生不可得故，當知佛十力空、四無所畏空，四無礙智空、十八不共法空，當知須陀洹果空、斯陀含果空、阿那含果空、阿羅漢果空、辟支佛道空，當知菩薩地空，當知阿耨多羅三藐三菩提空。」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;佛陀的回答有兩個關鍵動作：第一，以「&lt;strong&gt;如是！如是！&lt;/strong&gt;」全面承認須菩提的前提；第二，把單一的「不可得」展開為四個象限的全方位空性。PDF 將其命名為「空性矩陣」（空性矩陣），其內部結構如下：&lt;/p&gt;
&lt;div class=&quot;matrix-2x2&quot;&gt;
&lt;div class=&quot;matrix-cell&quot;&gt;
&lt;div class=&quot;mc-title&quot;&gt;本體論的空性&lt;/div&gt;
&lt;div class=&quot;mc-en&quot;&gt;本體論層面&lt;/div&gt;
&lt;div class=&quot;mc-body&quot;&gt;內空、外空、第一義空、有為空、無為空、畢竟空……乃至無法有法空。共十八空，徹底窮盡所有「自性」可能立足的位置。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;matrix-cell&quot;&gt;
&lt;div class=&quot;mc-title&quot;&gt;現象與感知的空性&lt;/div&gt;
&lt;div class=&quot;mc-en&quot;&gt;現象論層面&lt;/div&gt;
&lt;div class=&quot;mc-body&quot;&gt;五陰空、十二入空、十八界空、十二因緣空、四諦空。把眾生對世界的所有感知模型一併歸空。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;matrix-cell&quot;&gt;
&lt;div class=&quot;mc-title&quot;&gt;主體的空性&lt;/div&gt;
&lt;div class=&quot;mc-en&quot;&gt;主體性層面&lt;/div&gt;
&lt;div class=&quot;mc-body&quot;&gt;我空、壽者、命者、生者、養者、育者、眾數者、人者、作者、使作者、起者、使起者、受者、使受者、知者、見者皆空。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;matrix-cell&quot;&gt;
&lt;div class=&quot;mc-title&quot;&gt;道與果的空性&lt;/div&gt;
&lt;div class=&quot;mc-en&quot;&gt;解脫道層面&lt;/div&gt;
&lt;div class=&quot;mc-body&quot;&gt;四禪、四無量心、四無色定、四念處乃至八聖道分空，乃至佛十力、四無所畏、十八不共法空；須陀洹果、阿那含果、辟支佛道、菩薩地、阿耨多羅三藐三菩提皆空。&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;不僅沒有迴避，反而擴大&lt;/div&gt;
&lt;div class=&quot;insight-content&quot;&gt;佛陀的策略是不僅&lt;strong&gt;不否認&lt;/strong&gt;須菩提的不可得，反而把「不可得」擴展到修道的主體（我）、客體（眾生與法）、方法（道）與最終果位（阿耨多羅三藐三菩提）。這四象限之所以能稱為「矩陣」，是因為任何一格都能反向證成另外三格——這正是中觀方法論「無自性即互依」的形式化表達。&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　化人化化人 · 般若的重組&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;「須菩提！菩薩摩訶薩如是見一切法空，為眾生說法，不失諸空相。是菩薩如是觀時，知一切法無礙；知一切法無礙已，不壞諸法相，不二不分別，但為眾生如實說法。譬如佛所化人，化人復化作無量千萬億人，有教令布施者，有教持戒、有教忍辱、有教精進、有教禪定、有教智慧、有教四禪、四無量心、四無色定者。於汝意云何？佛所化人有分別破壞諸法不？」&lt;/p&gt;
&lt;p&gt;須菩提言：「不也！世尊！是化人無心、無心數法，云何分別破壞諸法？」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;四象限矩陣立完後，佛陀立刻給出運作的譬喻：「&lt;strong&gt;化人化化人&lt;/strong&gt;」——佛陀變化出的化人，再變化出無量化人，這些化人各自教令布施、持戒、忍辱……每個化人都在「行動」，但化人「無心、無心數法」，並沒有自己的執著。&lt;/p&gt;
&lt;div class=&quot;flow&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;佛&lt;small&gt;本體&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;化人&lt;small&gt;第一層化身&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;化化人&lt;small&gt;第二層化身&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;布施 · 持戒&lt;br/&gt;忍辱 · 精進&lt;small&gt;各自施行六度&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;div class=&quot;q&quot;&gt;問曰：化人有分別破壞諸法不？&lt;/div&gt;
&lt;div class=&quot;a&quot;&gt;答曰：不也！是化人無心、無心數法，云何分別破壞諸法？&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;行動發生，但無實體執著&lt;/div&gt;
&lt;div class=&quot;insight-content&quot;&gt;「化人化化人」是空性矩陣的運作示範：行動的&lt;strong&gt;發生&lt;/strong&gt;是真實的（六度確實在被推行），但行動的&lt;strong&gt;主體&lt;/strong&gt;是空的（化人無心）。菩薩在四象限空性中說法即是如此——「&lt;strong&gt;知一切法無礙，不壞諸法相，不二不分別，但為眾生如實說法&lt;/strong&gt;」。這正面回答了須菩提的詰問：菩薩不需要「主體實有」才能行菩薩道，正如化人不需要心，才能無錯地遍施六度。&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　不縛不脫法 · 存在的清淨本質&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;「以是故，須菩提！當知菩薩摩訶薩行般若波羅蜜，為眾生如應說法，拔出眾生於顛倒地，令眾生各得如所應住地，以不縛不脫法故。何以故？須菩提！是色不縛不脫，受、想、行、識不縛不脫；色無縛無脫不是色，受想行識無縛無脫不是識。何以故？色畢竟清淨故，受、想、行、識乃至一切法若有為、若無為，亦畢竟清淨故。」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;佛陀進一步揭示空性矩陣下諸法的&lt;strong&gt;本性樣態&lt;/strong&gt;：諸法本性「&lt;strong&gt;不縛不脫&lt;/strong&gt;」。菩薩「拔出眾生於顛倒地」並不是真有什麼東西被解開——因為從未真正被縛——而是讓眾生回到法本身的清淨狀態。&lt;/p&gt;
&lt;div class=&quot;venn-wrap&quot;&gt;
&lt;div class=&quot;venn-circle venn-a&quot;&gt;縛&lt;small&gt;對煩惱的執取&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;venn-circle venn-b&quot;&gt;脫&lt;small&gt;對解脫的執取&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;venn-mid&quot;&gt;不縛不脫&lt;br/&gt;&lt;small style=&quot;font-weight:400&quot;&gt;畢竟清淨&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;flow&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;菩薩拔出&lt;br/&gt;眾生於顛倒地&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;以不縛不脫法故&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;色無縛無脫&lt;br/&gt;不是色&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;metaphor&quot;&gt;
&lt;h5&gt;「不是色」的雙重否定&lt;/h5&gt;
&lt;p&gt;「色無縛無脫不是色」這句話極微妙：色法既然本來不縛不脫（畢竟清淨），那也就不能再以一般「色」的概念來理解它——一般概念裡的「色」總帶有縛或脫的影子。這是&lt;strong&gt;對概念本身的雙重否定&lt;/strong&gt;：既不是被縛的色，也不是被脫的色，這兩種色概念全部失效，剩下的才是「畢竟清淨」的諸法本性。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第四節　不住法而住諸法相 · 實踐的力學&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;「如是，須菩提！菩薩摩訶薩為眾生說法，亦不得眾生及一切法。一切法不可得故，菩薩以不住法故，住諸法相中，所謂色空，乃至有為、無為法空。何以故？色乃至有為、無為法自性不可得故，無有住處。無所有法不住無所有法，所有法不住所有法，自性法不住自性法，他性法不住他性法。何以故？是一切法皆不可得故。不可得法當住何處？如是，須菩提！菩薩摩訶薩行般若波羅蜜，以是諸空，能如是說法，如是行般若波羅蜜，於諸佛及聲聞、辟支佛無有過。何以故？諸佛、菩薩、辟支佛、阿羅漢得是法已，為眾生說法，亦不轉諸法相。何以故？如、法性、實際不可轉故。所以者何？諸法性無故。」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;佛陀給出實踐力學的核心公式：&lt;strong&gt;「以不住法故，住諸法相中」&lt;/strong&gt;。這看似矛盾的句法，正是中觀運作的關鍵——因為「自性不可得故，無有住處」，所以反而能在所有法相中自由運作。&lt;/p&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;實踐的力學核心公式&lt;/div&gt;
&lt;div class=&quot;insight-content&quot;&gt;
&lt;strong&gt;一切法不可得 → 自性不可得故，無有住處&lt;/strong&gt;&lt;br/&gt;
  · 無所有法不住無所有法&lt;br/&gt;
  · 所有法不住所有法&lt;br/&gt;
  · 自性法不住自性法&lt;br/&gt;
  · 他性法不住他性法&lt;br/&gt;
  → 是一切法皆不可得故。不可得法當住何處？
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;有為 / 色 / 空 / 無為&lt;small&gt;四面諸法相&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;自性不可得 → 無有住處&lt;small&gt;核心公式&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;不住法故，住諸法相中&lt;small&gt;菩薩運作的力學&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;metaphor&quot;&gt;
&lt;h5&gt;「無所過」的根據&lt;/h5&gt;
&lt;p&gt;佛陀以一句斬釘截鐵的話作結：「&lt;strong&gt;菩薩如是行般若波羅蜜，於諸佛及聲聞、辟支佛無有過&lt;/strong&gt;」——這個「無所過」的根據是「&lt;strong&gt;如、法性、實際不可轉故&lt;/strong&gt;」。法性既不可轉，菩薩、佛、聲聞、辟支佛在實相層面就站在同一個地基上。下一章須菩提便抓住這個「不可轉」的點，逼出本體等價性的問題。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;bridge bridge-outro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;承先啟後&lt;/div&gt;
&lt;p&gt;佛陀以四象限空性矩陣全面印可須菩提的「不可得」之後，又用化人、不縛不脫、不住法住諸法相三個機制把行動恢復起來。但須菩提注意到一個漏洞——既然「如、法性、實際不可轉」，那「色」與「法性」是否其實沒有差異？這就是下一章要處理的本體等價性問題。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-5&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第0品 · 第五章&lt;/div&gt;
&lt;h2 class=&quot;ch-name&quot;&gt;本體的等價性：色與法性的不二&lt;/h2&gt;
&lt;div class=&quot;ch-sub&quot;&gt;絕對非二元性 · 因果危機的引發&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;本章要旨&lt;/div&gt;
&lt;p&gt;本章對應 PDF p-11 與經文第十四、十五段。須菩提承上一章「法性、如、實際不可轉」追問：那麼色（受、想、行、識）跟法性、如、實際是否完全不異？佛陀直接答：「不也！色不異法性、不異如、不異實際」——這句不到二十字的回答，確立了中觀的絕對非二元性。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　色與法性、如、實際無異&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;須菩提白佛言：「世尊！若法性、如、實際不轉，色與法性異不？色與如、實際異不？受、想、行、識，乃至有為、無為法，世間、出世間，有漏、無漏異不？」&lt;/p&gt;
&lt;p&gt;佛言：「不也！色不異法性、不異如、不異實際；受、想、行、識，乃至有漏、無漏亦不異。」&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;venn-wrap&quot;&gt;
&lt;div class=&quot;venn-circle venn-a&quot;&gt;色 · 受 · 想 · 行 · 識&lt;small&gt;世俗諦現象&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;venn-circle venn-b&quot;&gt;法性 · 如 · 實際&lt;small&gt;第一義諦本體&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;venn-mid&quot;&gt;不 異&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;絕對非二元性&lt;/div&gt;
&lt;div class=&quot;insight-content&quot;&gt;佛陀的「不也！」確立了中觀的&lt;strong&gt;絕對非二元立場&lt;/strong&gt;：沒有一個獨立於世俗現象之外的「法性」或「實際」。色就是法性，法性就是色，兩者完全無異。&lt;strong&gt;這個結論直接堵死了「另尋一個更高真實」的所有路徑&lt;/strong&gt;——你不能離開色去找法性，離開受想行識去找如、去找實際。&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　絕對非二元 · 因果危機的引發&lt;/h2&gt;
&lt;p&gt;本體等價的命題一旦確立，立刻引爆一個倫理層面的危機：&lt;strong&gt;如果色與法性完全無異，那世俗法中的「黑法有黑報、白法有白報」要怎麼成立？&lt;/strong&gt;須菩提不會錯過這個破口，於是有了下一章開頭的業報詰問。&lt;/p&gt;
&lt;div class=&quot;metaphor&quot;&gt;
&lt;h5&gt;本體等價何以引發因果危機？&lt;/h5&gt;
&lt;p&gt;因果報應之所以能成立，前提是「行為（色法）」與「果報（色法）」之間有確定的對應；而對應之所以能確定，又必須假設行為與果報具有可區別的&lt;strong&gt;性質&lt;/strong&gt;（黑、白、黑白、不黑不白）。但若色不異法性，法性無有分別、無有差等——那「黑」與「白」的差別也只能是世俗諦的施設，第一義諦中根本沒有黑白可言。這個張力正是須菩提下一輪詰問要打開的。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;bridge bridge-intro&quot; style=&quot;border-left-color:var(--accentL);background:linear-gradient(135deg,#f9f3e6,#f2e6c8);&quot;&gt;
&lt;div class=&quot;bridge-label&quot; style=&quot;background:var(--accent);&quot;&gt;本章承接&lt;/div&gt;
&lt;p&gt;本章雖短，但是全卷的關鍵樞紐：它把第四章的「不可轉」推進到「不異」，從「&lt;strong&gt;運作不衝突&lt;/strong&gt;」進到「&lt;strong&gt;本體完全等價&lt;/strong&gt;」。下一章的二諦邏輯與凡聖之別，全部從這個「不異」所製造的張力中展開。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;bridge bridge-outro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;承先啟後&lt;/div&gt;
&lt;p&gt;色與法性、如、實際完全不異——這個本體層面的等價性，使一切「世俗諦中的差別」失去自性立足點，因果報應、修證階位、凡聖差等似乎都將崩塌。下一章須菩提便正式發動業報詰問，逼佛陀建立「二諦對照」的認識論框架，以容納本體不二與世俗差等的並存。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-6&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第0品 · 第六章&lt;/div&gt;
&lt;h2 class=&quot;ch-name&quot;&gt;二諦邏輯與凡聖之別&lt;/h2&gt;
&lt;div class=&quot;ch-sub&quot;&gt;業報詰問 · 二諦對照 · 凡聖差異 · 修道不得果 · 定義陷阱&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;本章要旨&lt;/div&gt;
&lt;p&gt;本章是全卷篇幅最長、層次最豐的核心章節，對應 PDF p-12~p-16 與經文第十六到二十六段。論主以五個層次回應第五章引發的因果危機：第一節爆發業報詰問，第二節以二諦對照表化解，第三節分析凡夫與聖人對二諦的不同認知，第四節揭示「修道不得果」的非線性邏輯，第五節由佛陀自己拆解「諸果定義」的陷阱——五層細辯共同證成：勝義諦無分別，世俗諦則為度眾生而施設一切階位名字。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　業報詰問 · 因果邏輯的崩潰危機&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;須菩提白佛言：「世尊！若色不異法性、不異如、不異實際，受、想、行、識，乃至有漏、無漏不異者，云何分別黑法有黑報，所謂地獄、餓鬼、畜生；白法有白報，所謂天及人；黑白法有黑白報；不黑不白法有不黑不白報，所謂須陀洹果、斯陀含果、阿那含果、阿羅漢果、辟支佛道、阿耨多羅三藐三菩提？」&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;num&quot;&gt;黑法&lt;/div&gt;&lt;div class=&quot;term&quot;&gt;黑報&lt;/div&gt;&lt;div class=&quot;desc&quot;&gt;地獄、餓鬼、畜生&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;num&quot;&gt;白法&lt;/div&gt;&lt;div class=&quot;term&quot;&gt;白報&lt;/div&gt;&lt;div class=&quot;desc&quot;&gt;天、人&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;num&quot;&gt;黑白法&lt;/div&gt;&lt;div class=&quot;term&quot;&gt;黑白報&lt;/div&gt;&lt;div class=&quot;desc&quot;&gt;混合果報&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;div class=&quot;num&quot;&gt;不黑不白法&lt;/div&gt;&lt;div class=&quot;term&quot;&gt;不黑不白報&lt;/div&gt;&lt;div class=&quot;desc&quot;&gt;四果、辟支佛道、阿耨多羅三藐三菩提&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;天平上的危機&lt;/div&gt;
&lt;div class=&quot;insight-content&quot;&gt;須菩提把問題擺到天平上：左盤是「色不異法性」（本體無差等），右盤是「黑法有黑報、白法有白報」（世俗有差等）。如果本體上一切等於空性，那世俗的善惡因果、出世間的修行階位是否全屬虛妄？這個詰問若不能化解，整個《般若》的菩薩道在倫理層面就會失效。&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　視角的轉化 · 二諦邏輯對照表&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;佛告須菩提：「世諦故，分別說有果報，非第一義；第一義中不可說因緣果報。何以故？是第一義，實無有相，無有分別，亦無言說，所謂色乃至有漏、無漏法，不生不滅相、不垢不淨，畢竟空、無始空故。」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;佛陀沒有否定因果，而是把因果嚴格&lt;strong&gt;劃定在世俗諦的認識論框架內&lt;/strong&gt;。PDF 將其呈現為一張二諦邏輯對照表：&lt;/p&gt;
&lt;table class=&quot;compare-table&quot;&gt;
&lt;thead&gt;
&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;世 諦&lt;br/&gt;世俗的真理&lt;/th&gt;&lt;th&gt;第一義諦&lt;br/&gt;究竟的真理&lt;/th&gt;&lt;/tr&gt;
&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td class=&quot;row-head&quot;&gt;果報運作&lt;br/&gt;&lt;span style=&quot;font-weight:400;font-size:13px;color:var(--text-muted)&quot;&gt;果報的運作&lt;/span&gt;&lt;/td&gt;&lt;td&gt;分別說有果報&lt;/td&gt;&lt;td&gt;不可說因緣果報&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td class=&quot;row-head&quot;&gt;法之相貌&lt;br/&gt;&lt;span style=&quot;font-weight:400;font-size:13px;color:var(--text-muted)&quot;&gt;諸法的相貌&lt;/span&gt;&lt;/td&gt;&lt;td&gt;黑白分明，階位具足&lt;/td&gt;&lt;td&gt;實無有相，無有分別，亦無言說，不生不滅，不垢不淨&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;不否定因果，而是嚴格劃定其有效範圍&lt;/div&gt;
&lt;div class=&quot;insight-content&quot;&gt;佛陀的策略是「&lt;strong&gt;視角分層&lt;/strong&gt;」而非「真假抉擇」。世諦中分別說有果報——這是真實的（不是虛妄）；第一義中不可說——這也是真實的（不是隱瞞）。&lt;strong&gt;兩者並非對立，而是同一實相在不同認識論層面的顯現&lt;/strong&gt;。這正是中觀「二諦並行」的精髓。&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　認知邊界 · 凡夫與聖人之別&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;須菩提白佛言：「世尊！若以世諦故，分別說有果報，非第一義者，一切凡夫人應有須陀洹果、斯陀含果、阿那含果、阿羅漢果、辟支佛道、阿耨多羅三藐三菩提！」&lt;/p&gt;
&lt;p&gt;佛告須菩提：「於汝意云何？凡夫人為知是世諦法、是第一義諦不？若知，是凡夫人應是須陀洹果乃至阿耨多羅三藐三菩提。須菩提！以凡夫人實不知世諦、不知第一義諦、不知道、不知分別道果，云何當有諸果？須菩提！聖人知世諦、知第一義諦，有道、有修道，以是故聖人差別有諸果。」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;須菩提發出第二個尖銳問題：如果世諦就有諸果，那凡夫不也活在世諦中嗎？凡夫應當也有諸果！佛陀的回答揭示了一個關鍵差別——&lt;strong&gt;差別不在「身處哪一諦」，而在「能否同時了知二諦」&lt;/strong&gt;。&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;凡 夫 人&lt;/div&gt;
&lt;div class=&quot;col-content&quot;&gt;「實不知世諦、不知第一義諦、不知道、不知分別道果」&lt;br/&gt;→ 被現象束縛，無有諸果。&lt;br/&gt;&lt;br/&gt;&lt;span style=&quot;color:var(--text-muted);font-size:14.5px&quot;&gt;即使生活在世諦中，也未真正「知」世諦——只是被世諦現象所困而不自覺。&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;聖 人&lt;/div&gt;
&lt;div class=&quot;col-content&quot;&gt;「知世諦、知第一義諦，有道、有修道」&lt;br/&gt;→ 洞察雙重真理，故能安立差別諸果。&lt;br/&gt;&lt;br/&gt;&lt;span style=&quot;color:var(--text-muted);font-size:14.5px&quot;&gt;聖人的「差別有諸果」不是因為他們在世諦中比凡夫更努力，而是因為他們對世諦與第一義諦同時了然。&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;果位來源於「全然了知」而非「身處」&lt;/div&gt;
&lt;div class=&quot;insight-content&quot;&gt;修行的果位並非單純因為身處「世俗諦」而自動產生，而是源於對「&lt;strong&gt;世俗與第一義雙重真理&lt;/strong&gt;」的全然了知。凡夫即使生於世間，仍因不知二諦而無諸果；聖人即使了達第一義，仍能在世諦中差別建立諸果。&lt;strong&gt;這把「修道」的本質從「努力做對的事」轉變為「全然了知二諦的視角能力」&lt;/strong&gt;。&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第四節　修道不得果 · 證悟的非線性邏輯&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;須菩提白佛言：「世尊！修道得果不？」&lt;/p&gt;
&lt;p&gt;佛言：「不也！須菩提！修道不得果，不修道亦不得果，亦不離道得果，亦不住道中得果。如是，須菩提！菩薩摩訶薩行般若波羅蜜時，為眾生故分別果，亦不分別是有為性、無為性。」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;須菩提以最簡的問句直擊核心：「修道得果不？」佛陀的回答是中觀邏輯最壯觀的一筆——&lt;strong&gt;四個面向同時否定&lt;/strong&gt;：&lt;/p&gt;
&lt;div class=&quot;ring4&quot;&gt;
&lt;div class=&quot;ring-node r-top&quot;&gt;修道&lt;br/&gt;不得果&lt;/div&gt;
&lt;div class=&quot;ring-node r-right&quot;&gt;不修道&lt;br/&gt;亦不得果&lt;/div&gt;
&lt;div class=&quot;ring-node r-bottom&quot;&gt;亦不離道&lt;br/&gt;得果&lt;/div&gt;
&lt;div class=&quot;ring-node r-left&quot;&gt;亦不住道&lt;br/&gt;中得果&lt;/div&gt;
&lt;div class=&quot;ring-node r-center ring-center&quot;&gt;達成的&lt;br/&gt;幻相&lt;br/&gt;&lt;small&gt;「果」不是實體目標&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;四面同時否定的意義&lt;/div&gt;
&lt;div class=&quot;insight-content&quot;&gt;這四個否定窮盡了「道與果」的所有關係——做、不做、離開、住於。四面同時無效，意味著&lt;strong&gt;「果」根本不是一個實體目標&lt;/strong&gt;。果是一種「不執著於過程（道）亦不偏廢過程的狀態」——它不是達成的東西，而是一種運作方式。菩薩為眾生故「分別果」，但其本身已超越了「有為性／無為性」的二元對立。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;metaphor&quot;&gt;
&lt;h5&gt;非線性的修證&lt;/h5&gt;
&lt;p&gt;線性修道的思維是：投入修道 → 累積資糧 → 達到果位。但佛陀拆解的是這條因果鏈本身——道與果的關係不是輸入輸出的線性函數，而是&lt;strong&gt;同步發生、互相非實&lt;/strong&gt;的非線性關係。這就是「&lt;strong&gt;達成的幻相&lt;/strong&gt;」的真意：「達成」這個概念本身就是執著的痕跡。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第五節　定義的陷阱 · 無為法中有分別不&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;須菩提：「世尊！若不分別有為性、無為性得諸果者，云何世尊自說：『三結盡，名須陀洹果；婬、怒、癡薄故，名斯陀含果；五此間結盡，名阿那含果；五彼間結盡，名阿羅漢果；所有集法皆滅散相，名辟支佛道；一切煩惱習斷故，名阿耨多羅三藐三菩提』？世尊！我當云何知不分別有為性、無為性得諸果？」&lt;/p&gt;
&lt;p&gt;佛告須菩提：「汝以須陀洹果、斯陀含果、阿那含果、阿羅漢果、辟支佛道、阿耨多羅三藐三菩提，是諸果是有為、是無為？」&lt;/p&gt;
&lt;p&gt;須菩提言：「世尊！皆是無為！」&lt;/p&gt;
&lt;p&gt;「須菩提！無為法中有分別不？」&lt;/p&gt;
&lt;p&gt;「不也！世尊！」&lt;/p&gt;
&lt;p&gt;「須菩提！若善男子、善女人通達一切法若有為、若無為一相，所謂無相，是時有分別若有為、若無為不？」&lt;/p&gt;
&lt;p&gt;「不也！世尊！」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;須菩提搬出佛陀過去自己給諸果下的定義（三結盡、五結盡……）來反駁。這是辯論中最危險的一招——你過去這樣定義，現在要怎麼自圓其說？佛陀的回應極其精巧：他不否認自己的定義，反而&lt;strong&gt;用須菩提自己的承認&lt;/strong&gt;來拆解定義的陷阱。&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col-card&quot; style=&quot;border-left:5px solid var(--accent);&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;世尊自說 · 過去的定義&lt;/div&gt;
&lt;div class=&quot;col-content&quot;&gt;
&lt;p style=&quot;margin-top:0&quot;&gt;‧ &lt;strong&gt;三結盡&lt;/strong&gt; = 須陀洹果&lt;/p&gt;
&lt;p&gt;‧ &lt;strong&gt;婬怒癡薄&lt;/strong&gt; = 斯陀含果&lt;/p&gt;
&lt;p&gt;‧ &lt;strong&gt;五此間結盡&lt;/strong&gt; = 阿那含果&lt;/p&gt;
&lt;p&gt;‧ &lt;strong&gt;五彼間結盡&lt;/strong&gt; = 阿羅漢果&lt;/p&gt;
&lt;p&gt;‧ &lt;strong&gt;集法滅散&lt;/strong&gt; = 辟支佛道&lt;/p&gt;
&lt;p style=&quot;margin-bottom:0&quot;&gt;‧ &lt;strong&gt;煩惱習斷&lt;/strong&gt; = 阿耨多羅三藐三菩提&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot; style=&quot;border-left:5px solid var(--gold);&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;無為法本質 · 勝義實相&lt;/div&gt;
&lt;div class=&quot;col-content&quot;&gt;
&lt;div class=&quot;qa&quot; style=&quot;margin:0&quot;&gt;
&lt;div class=&quot;q&quot; style=&quot;font-size:15.5px&quot;&gt;問：是諸果是有為、是無為？&lt;/div&gt;
&lt;div class=&quot;a&quot; style=&quot;font-size:15.5px&quot;&gt;答：皆是無為！&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;qa&quot; style=&quot;margin:6px 0 0&quot;&gt;
&lt;div class=&quot;q&quot; style=&quot;font-size:15.5px&quot;&gt;問：無為法中有分別不？&lt;/div&gt;
&lt;div class=&quot;a&quot; style=&quot;font-size:15.5px&quot;&gt;答：不也！&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;勝義諦中無分別 · 階位皆為度眾施設&lt;/div&gt;
&lt;div class=&quot;insight-content&quot;&gt;須菩提自己承認「諸果皆是無為」、「無為法中無分別」——既如此，「三結盡=須陀洹」這類定義在勝義諦中根本不存在。&lt;strong&gt;所有階位的名稱都是世俗諦中為度眾生而施設的假名&lt;/strong&gt;。佛陀「通達一切法若有為、若無為一相，所謂無相」一句，把第六章的五層細辯一次性收束：勝義諦中無分別，世俗諦的階位則是慈悲的權巧。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;bridge bridge-outro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;承先啟後&lt;/div&gt;
&lt;p&gt;本章五節從業報詰問→二諦對照→凡聖之別→修道不得果→無為無分別，層層遞進，最終由佛陀以「一相所謂無相」收束。下一章便從這個「一相無相」開展菩薩終極實踐——「無所著」的清淨運作系統。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-7&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第0品 · 第七章&lt;/div&gt;
&lt;h2 class=&quot;ch-name&quot;&gt;終極實踐：無所著的清淨運作&lt;/h2&gt;
&lt;div class=&quot;ch-sub&quot;&gt;一相無相 · 無所著矩陣 · 莫比烏斯環的圓滿&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;bridge bridge-intro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;本章要旨&lt;/div&gt;
&lt;p&gt;本章對應 PDF p-17~p-19 與經文最後三段。經過六章的辯證解構與重建，論主把全卷收歸於「無所著」這個運作核心：第一節以「一相所謂無相」確立萬法統一；第二節以「無所著矩陣」展開菩薩自得與教人令得的雙軌實踐；第三節以莫比烏斯環的圓滿為菩薩道的終極運作系統收尾——回到第一章開頭的圖像，但內涵已徹底轉化。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　一相所謂無相 · 萬法的統一&lt;/h2&gt;
&lt;p&gt;第六章末尾，佛陀已透過「無為法中無分別」逼出「一相所謂無相」這個結論。本節將其作為第七章的起點正式展開。&lt;/p&gt;
&lt;div class=&quot;venn-wrap&quot;&gt;
&lt;div class=&quot;venn-circle venn-a&quot; style=&quot;width:200px;height:200px&quot;&gt;一 相&lt;small&gt;萬法統一&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;venn-circle venn-b&quot; style=&quot;width:200px;height:200px&quot;&gt;無 相&lt;small&gt;無有分別、無有言說&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;verse&quot;&gt;
通達一切法若有為、若無為一相，所謂無相&lt;br/&gt;
是時有分別若有為、若無為不？— 不也！
&lt;/div&gt;
&lt;p&gt;「&lt;strong&gt;菩薩為眾生說法，不分別諸法，所謂內空故，乃至無法有法空故&lt;/strong&gt;」——這句總結指明「不分別」並非僵硬的空白，而是建立在十八空全部歸空的基礎上。空性不是消極的虛無，而是諸法本然的&lt;strong&gt;非二元相貌&lt;/strong&gt;。&lt;/p&gt;
&lt;div class=&quot;metaphor&quot;&gt;
&lt;h5&gt;正是因為不作二元分別，才能真正講說般若&lt;/h5&gt;
&lt;p&gt;若菩薩仍以二元分別（有為／無為）來說法，他講的就不是般若——他講的是某種更精緻的世俗法。唯有徹底通達「一相所謂無相」，菩薩的說法才能真正契合般若的本質。這把第二章的「四十二字門 → 善說無字法」推到最高位：&lt;strong&gt;無字法的真實內容，就是這個「一相無相」&lt;/strong&gt;。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　無所著矩陣 · 自得與教人令得&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;「如是，須菩提！菩薩摩訶薩為眾生說法，不分別諸法，所謂內空故，乃至無法有法空故。是菩薩自得無所著法，亦教人令得無所著法，若檀波羅蜜、尸羅波羅蜜、羼提波羅蜜、毘梨耶波羅蜜、禪波羅蜜、般若波羅蜜，初禪乃至第四禪，慈、悲、喜、捨，無邊虛空處乃至非有想非無想處，若四念處乃至一切種智。是菩薩自不著故，亦教他令得無所著，無所著故無所礙。」&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col-card&quot; style=&quot;border-top:4px solid var(--gold);&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;菩薩自得&lt;/div&gt;
&lt;div class=&quot;col-content&quot;&gt;於六波羅蜜、四禪、四無量心、四無色定、四念處乃至一切種智，&lt;strong&gt;自得無所著法&lt;/strong&gt;——並非自己「擁有」這些法，而是讓這些法在自身上自由運作而無執著。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot; style=&quot;border-top:4px solid var(--accent);&quot;&gt;
&lt;div class=&quot;col-title&quot;&gt;教人令得&lt;/div&gt;
&lt;div class=&quot;col-content&quot;&gt;同時「&lt;strong&gt;教人令得無所著法&lt;/strong&gt;」——把這個「無所著」的運作模式傳遞給眾生，使眾生也能於六度乃至一切種智自由運作而無執著。&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;mobius-banner&quot;&gt;
&lt;h4&gt;無所著的運作矩陣&lt;/h4&gt;
&lt;p style=&quot;font-size:18px;color:var(--accent);margin:14px 0;&quot;&gt;自不著故，亦教他令得無所著，無所著故無所礙&lt;/p&gt;
&lt;p style=&quot;font-size:15.5px;color:var(--text2);margin-top:10px&quot;&gt;六波羅蜜 · 四禪 · 慈悲喜捨 · 四念處 · 一切種智&lt;br/&gt;—— 一切世俗修行皆在此矩陣中保持絕對的自由&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;無所著的雙軌結構&lt;/div&gt;
&lt;div class=&quot;insight-content&quot;&gt;「自得 + 教人令得」是無所著矩陣的雙軌結構：自身的清淨並不停留為個人解脫（聲聞道），而&lt;strong&gt;必然外溢為對眾生的傳遞&lt;/strong&gt;（菩薩道）。這就是空性矩陣與聲聞空性最大的差別所在——空性在菩薩這裡不是終點，而是運作的&lt;strong&gt;動力&lt;/strong&gt;，因為「無所著」所以「無所礙」，因為無所礙所以能無限地教人令得無所著。&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　莫比烏斯環的圓滿 · 菩薩的終極運作系統&lt;/h2&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;span class=&quot;text-label&quot;&gt;經 文&lt;/span&gt;
&lt;p&gt;「譬如佛所化人布施，亦不受布施報，但為度眾生故；乃至行一切種智，不受一切種智報。菩薩摩訶薩亦如是，行六波羅蜜，乃至一切法有漏、無漏、有為、無為，不住亦不受報，但為度眾生故。何以故？是菩薩摩訶薩善達一切諸法相故。」&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;論主以「化人布施不受布施報」這個譬喻收束全卷——這個譬喻第四章已出現過（化人化化人），但在那時是&lt;strong&gt;論證&lt;/strong&gt;，到這裡是&lt;strong&gt;歸宿&lt;/strong&gt;。化人布施而不受報，&lt;strong&gt;因為化人本來無心&lt;/strong&gt;；菩薩行六度而不住不受，&lt;strong&gt;因為菩薩善達一切諸法相&lt;/strong&gt;。兩者並不是「相似」，而是同一個運作機制的不同層級展現。&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;化人布施&lt;small&gt;亦不受布施報，但為度眾生故&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;行一切種智&lt;small&gt;不受一切種智報&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;菩薩摩訶薩行六波羅蜜&lt;small&gt;乃至一切法有漏、無漏、有為、無為&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;不住亦不受報&lt;small&gt;但為度眾生故&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;善達一切諸法相&lt;small&gt;終極的運作&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;mobius-banner&quot; style=&quot;background:linear-gradient(135deg,#3d3225 0%,#5a4e3a 50%,#3d3225 100%);color:#fff;border:1px solid var(--gold);&quot;&gt;
&lt;h4 style=&quot;color:var(--goldL);&quot;&gt;迴 圈 的 圓 滿&lt;/h4&gt;
&lt;div class=&quot;infinity&quot; style=&quot;color:var(--goldL);&quot;&gt;∞&lt;/div&gt;
&lt;p style=&quot;color:rgba(255,255,255,.85);font-size:17px&quot;&gt;中觀的最高成就，不在於抹除世俗的特徵，而是「&lt;strong style=&quot;color:var(--goldL)&quot;&gt;善達一切諸法相&lt;/strong&gt;」——在空性中完美地萃取形式。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;div class=&quot;insight-title&quot;&gt;回到第一章的莫比烏斯環&lt;/div&gt;
&lt;div class=&quot;insight-content&quot;&gt;第一章開篇即指出，卷八十九的論證是一個三圈無縫的莫比烏斯環。走完七章後，再回看那個圖像會發現它的內涵已經被填滿——「建立世俗諦」（八十隨形好、四攝法、四十二字門）、「第一義諦的解構」（不可得、空性矩陣、二諦對照、修道不得果）、「不二的實踐」（化人化化人、不縛不脫、不住諸法相、無所著矩陣）三圈在「&lt;strong&gt;但為度眾生故&lt;/strong&gt;」這六個字上重新銜合。&lt;strong&gt;從「畢竟空」中萃取形式而不染著，從世俗諦中行動而不停滯——這就是論主在卷八十九所完成的「中觀幾何」&lt;/strong&gt;。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;metaphor&quot;&gt;
&lt;h5&gt;全卷終辭&lt;/h5&gt;
&lt;p&gt;「但為度眾生故」一句出現了兩次：化人「但為度眾生故」、菩薩「但為度眾生故」——這個重複不是修辭的偶然。&lt;strong&gt;「為度眾生」是中觀整套幾何學運作的唯一動力源&lt;/strong&gt;。沒有這個動力，空性會塌陷為虛無，世俗諦會固化為執著；有了這個動力，空性與世俗諦才能在莫比烏斯環上無限循環，無始無終。卷八十九的釋四攝品之餘，至此完整收束。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;bridge bridge-outro&quot;&gt;
&lt;div class=&quot;bridge-label&quot;&gt;承先啟後&lt;/div&gt;
&lt;p&gt;卷八十九釋四攝品第七十八之餘至此圓滿。論主以「但為度眾生故」六字作為整套中觀幾何的動力源，使「畢竟空」與「菩薩行」在同一個迴圈上互相支撐——這就是般若波羅蜜的真實運作。讀完全卷後再回頭翻閱經文，會發現每一句都已不再是孤立的命題，而是這個運作系統的一個側面。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

.ch-body h4{font-size:20px;color:var(--text2);font-weight:600;margin:18px 0 8px;}
.ch-body h5{font-size:18.5px;color:var(--gold);font-weight:600;margin:14px 0 6px;}
.ch-body p{margin:0 0 12px;line-height:1.95;font-size:20px;}
.ch-body p strong{color:var(--accent-red);font-weight:700;}
.ch-body ul,.ch-body ol{margin:10px 0 14px 1.5em;}
.ch-body li{margin:6px 0;line-height:1.9;font-size:20px;}

/* === 偈頌 / 引文 === */
.verse,.gatha,blockquote,.classical-text{
  background:var(--verseBg);border-left:4px solid var(--verseBd);
  padding:18px 26px;margin:18px 0;line-height:2.2;
  white-space:normal;text-align:center;
  font-size:22px;color:var(--text);font-weight:500;
  border-radius:0 8px 8px 0;
}
.classical-text{background:#FFFDF5;border:1px solid #E8E0D0;border-left:4px solid var(--gold);text-align:left;font-style:normal;}
.text-label{display:inline-block;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:13.5px;background:var(--accent);color:#fff;padding:3px 12px;border-radius:12px;letter-spacing:2px;margin-bottom:10px;}

/* === 卡片類 === */
.card,.insight,.commentary,.note,.metaphor,.practice{
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:18px 24px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.08);
  font-size:20px;line-height:1.95;
}
.card-title,.insight-title{color:var(--accent);font-weight:700;font-size:21.5px;margin-bottom:10px;letter-spacing:1px;}
.insight{background:linear-gradient(135deg,#fffdf5,#faf0d8);border-left:4px solid var(--gold);}
.commentary{background:#f7f3ec;border-left:4px solid var(--accent);}
.note{background:#fdf6e8;border-left:4px solid var(--goldL);}

/* === 雙欄/三欄 === */
.two-col,.col-card{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:16px 0;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:16px 0;}
.col{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 22px;}
.col-title{color:var(--accent);font-weight:700;font-size:21.5px;margin-bottom:8px;}

/* === 四象限 / 四格 === */
.four-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0;}
.four-grid .cell{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:8px;padding:16px 22px;font-size:19px;line-height:1.85;}
.four-grid .cell-num{display:inline-block;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-weight:700;color:var(--gold);font-size:18px;margin-right:8px;letter-spacing:2px;}
.four-grid .cell-title{font-weight:700;color:var(--accent);font-size:20px;margin-bottom:6px;}

/* === 流程圖 === */
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin:18px 0;padding:18px;background:#fdfaf0;border:1px solid var(--border);border-radius:10px;}
.flow.flow-v{flex-direction:column;}
.flow-box,.flow-step{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 22px;font-size:17.5px;text-align:center;min-width:180px;max-width:680px;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06);font-weight:500;}
.flow-box small,.flow-step small{display:block;color:var(--text-muted);font-size:14px;margin-top:4px;font-weight:400;}
.flow-arrow{font-size:24px;color:var(--gold);font-weight:700;}

/* === Q&amp;A === */
.qa{margin:14px 0;}
.qa .q,.qa .a{padding:12px 20px;margin:8px 0;border-radius:6px;font-size:20px;line-height:1.9;}
.qa .q{background:#e8f0f7;border-left:4px solid #4a6a8c;color:#2c4a66;}
.qa .a{background:#f7f0e8;border-left:4px solid var(--accent);color:var(--text);}
.ch-body p.qa-3{padding-left:3em;}
.ch-body p.qa-2{padding-left:2em;}

/* === Triangle / Spectrum / Domino === */
.triangle-diagram{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:18px 0;text-align:center;}
.tri-node{background:var(--card);border:2px solid var(--gold);border-radius:50%;width:140px;height:140px;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0 auto;font-size:17px;padding:12px;font-weight:600;color:var(--accent);}
.tri-conclusion{grid-column:1/-1;background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;padding:14px 22px;border-radius:8px;font-weight:700;font-size:18px;text-align:center;margin-top:10px;}

.spectrum{display:flex;align-items:stretch;margin:18px 0;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
.sp-node{flex:1;padding:14px 18px;text-align:center;font-size:15.5px;line-height:1.6;}
.sp-left{background:#e8d8c0;color:var(--text);}
.sp-mid{background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;}
.sp-mid h5,.sp-mid *{color:#fff!important;}
.sp-right{background:#e8d8c0;color:var(--text);}

.domino-chain{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:18px 0;padding:14px;background:#fdfaf0;border:1px solid var(--border);border-radius:10px;}
.domino{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:6px;padding:12px 16px;font-size:17px;font-weight:600;color:var(--accent);}
.chain-arrow{font-size:22px;color:var(--gold);font-weight:700;}

/* === Bridge === */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:1px solid var(--border);border-left:5px solid var(--gold);border-radius:10px;padding:20px 26px;margin:0 0 26px;box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);background:linear-gradient(135deg,#fdf8e8,#f2e6c8);margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:12.5px;background:var(--gold);color:#fff;padding:3px 12px;border-radius:12px;letter-spacing:2.2px;margin-bottom:10px;font-weight:600;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0 0 8px;color:var(--text2);line-height:2.1;font-size:18.5px;}

/* === 進度條 === */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;background:rgba(30,26,20,.92);color:var(--gold);padding:9px 24px;border-radius:30px;border:1px solid rgba(184,134,11,.5);box-shadow:0 4px 18px rgba(0,0,0,.25);font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14px;letter-spacing:2px;display:flex;align-items:center;gap:12px;pointer-events:none;user-select:none;backdrop-filter:blur(6px);}
.read-progress .rp-label{font-size:12px;opacity:.75;letter-spacing:3px;}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}

/* === Back to top === */
#backTop{position:fixed;right:24px;bottom:80px;width:44px;height:44px;border-radius:50%;background:var(--gold);color:#fff;border:0;font-size:22px;cursor:pointer;display:none;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:110;}
#backTop:hover{background:var(--goldL);}

/* === Footer === */
.site-footer{margin-top:60px;padding:36px 24px;background:#1e1a14;color:#a89870;text-align:center;border-top:2px solid var(--gold);}
.site-footer p{font-size:15px;margin:6px 0;letter-spacing:1px;}
.site-footer .ft-quote{font-size:16px;color:var(--goldL);font-style:italic;margin-bottom:10px;}

/* === Responsive === */
@media (max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:flex;align-items:center;justify-content:center;}
  .main{margin-left:0;}
  .hero-title{font-size:36px;letter-spacing:4px;}
  .hero-subtitle{font-size:17px;}
  .ch-head{padding:24px 20px;}
  .ch-name{font-size:24px;letter-spacing:2px;}
  .ch-body{padding:24px 22px;}
  .ch-body h2{font-size:22px;}
  .four-grid,.two-col,.three-col{grid-template-columns:1fr;}
  .triangle-diagram{grid-template-columns:1fr;}
  .preface{padding:22px 20px;}
}
@media (max-width:600px){
  body{font-size:18px;}
  .ch-body p,.ch-body li{font-size:18px;}
  .toc-section{padding:0 20px;}
  .verse{font-size:19px;}
}

&lt;div class=&quot;preface&quot;&gt;
&lt;h2 class=&quot;preface-title&quot;&gt;編 者 前 言&lt;/h2&gt;
&lt;p&gt;本品承〈八十隨形好義〉之餘緒，從「識滿足」一語切入，旋即跨入更宏大的議題：&lt;strong&gt;菩薩何以能用語言為畢竟空的眾生說無名字的諸法實相？&lt;/strong&gt;這並非單純的問答補充，而是龍樹菩薩以中觀辯證拓撲學，把「果報生識」、「四十二字義」、「化人說法」、「法性不異諸法」四組看似散落的問答，統攝在一條貫穿的軸線上——&lt;strong&gt;從現象界（俗諦）到實相界（真諦）的透鏡轉換&lt;/strong&gt;。&lt;/p&gt;
&lt;p&gt;本論文式解讀提出四大解構支柱：（一）&lt;strong&gt;身心不二的果報論&lt;/strong&gt;——識具足是緣起相依的硬知能力，而非造作；（二）&lt;strong&gt;語言解構的實相觀&lt;/strong&gt;——四十二字門的遞迴邏輯指向「諸法義中諸法無名字」；（三）&lt;strong&gt;悲智雙運的幻化行&lt;/strong&gt;——以「化人為化眾說法」化解菩薩說法的根本悖論；（四）&lt;strong&gt;體用一如的二諦觀&lt;/strong&gt;——「色即是法性，世諦故有分別，第一義中無分別」的圓融矩陣。&lt;/p&gt;
&lt;p&gt;本品因此被論文定位為《大智度論》中觀體系的「拓撲樞紐」：身體（足安立）、語言（四十二字）、心識（果報生識）、實相（法性不二）四維被一網收進「不轉法性而為眾生說法」的菩薩道核心命題之中。&lt;/p&gt;
&lt;/div&gt;
