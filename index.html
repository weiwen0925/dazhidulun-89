&lt;section class=&quot;chapter&quot; id=&quot;ch1&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第三品 · 第一章&lt;/div&gt;
&lt;h2 class=&quot;ch-name&quot;&gt;經 文 原 典&lt;/h2&gt;
&lt;div class=&quot;ch-sub&quot;&gt;大 智 度 論 · 釋 善 達 品 · 經 文 全 文&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;p style=&quot;text-align:center;color:var(--text-muted);font-size:17px;letter-spacing:2px;margin-bottom:30px;font-family:'Noto Sans TC',sans-serif;&quot;&gt;◎ 龍樹菩薩造 · 後秦鳩摩羅什譯&lt;/p&gt;&lt;h2&gt;第一節　善達諸法相 · 化人喻&lt;/h2&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;本節要旨&lt;/div&gt;&lt;p&gt;本節為全品開卷的「定義之問」。須菩提請佛開示「云何菩薩善達諸法相」，佛以&lt;strong&gt;化人不行八對範疇&lt;/strong&gt;作答——婬怒癡、色至識、內外法、煩惱結使、有漏無漏、世間出世間、有為無為、聖果——一一懸置。化人本無實體，故無一切「行」可言；菩薩善達諸法相亦如是，「無有是事，亦不分別是法」。此處奠定全品的認識論基底：&lt;strong&gt;善達非取得新知，而是徹底懸置對自性實有的執取&lt;/strong&gt;。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;p class=&quot;qa-q&quot;&gt;須菩提白佛言：「世尊！云何菩薩善達諸法相？」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;佛告須菩提：「譬如化人不行婬、怒、癡，不行色乃至識，不行內、外法，不行諸煩惱結使，不行有漏法、無漏法，世間法、出世間法，有為法、無為法，亦無聖果；菩薩亦如是，無有是事，亦不分別是法，是名善達諸法相。」&lt;/p&gt;
&lt;p class=&quot;qa-q&quot;&gt;須菩提言：「世尊！化人云何有修道？」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;佛言：「化人修道，不垢不淨，亦不在五道生死。須菩提！於汝意云何？佛所化人，有根本實事、有垢有淨不？」&lt;/p&gt;
&lt;p class=&quot;qa-q&quot;&gt;須菩提言：「不也！佛所化人，無有根本實事，亦無垢無淨，亦不在五道生死。」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;「如是，須菩提！菩薩摩訶薩善達諸法相，亦如是。」&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　萬法如化 · 菩薩行的悖論&lt;/h2&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;本節要旨&lt;/div&gt;&lt;p&gt;本節須菩提發出全品的核心質問：若色受想行識皆如化、化人無垢淨、無五道生死亦無解脫處，那麼&lt;strong&gt;菩薩有何等功用&lt;/strong&gt;？佛以「不見眾生從三界得解脫」作肯認，再以「眾生自不知諸法如幻如化」翻轉——菩薩的動力不在於拔出「實有的眾生」從「實有的苦」，而在於拔除眾生&lt;strong&gt;因『不知』而自起的虛妄苦&lt;/strong&gt;。這是中觀慈悲的根本不對稱性：菩薩知諸法如幻，眾生不知諸法如幻；正因為眾生不知，菩薩才於阿僧祇劫行六波羅蜜。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;p class=&quot;qa-q&quot;&gt;須菩提言：「世尊！一切色如化不？一切受、想、行、識如化不？」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;佛言：「一切色如化，一切受、想、行、識如化。」&lt;/p&gt;
&lt;p class=&quot;qa-q&quot;&gt;「世尊！若一切色如化、一切受想行識如化、一切法如化，化人無色、無受想行識、無垢無淨、無五道生死亦無解脫處，菩薩有何等功用？」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;佛告須菩提：「於汝意云何？菩薩摩訶薩本行菩薩道時，頗見有眾生從地獄、餓鬼、畜生、人、天中得解脫不？」&lt;/p&gt;
&lt;p class=&quot;qa-q&quot;&gt;須菩提言：「不也！世尊！」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;佛言：「如是！如是！須菩提！菩薩摩訶薩不見眾生從三界得解脫。何以故？菩薩摩訶薩見知一切法如幻、如化。」&lt;/p&gt;
&lt;p class=&quot;qa-q&quot;&gt;「世尊！若菩薩摩訶薩見知一切法如幻、如化，為何事故行六波羅蜜、四禪、四無量心、四無色定、三十七助道法，乃至行大慈大悲、淨佛國土、成就眾生？」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;佛告須菩提：「若眾生自知諸法如幻、如化，菩薩摩訶薩終不於阿僧祇劫為眾生行菩薩道。須菩提！以眾生自不知諸法如幻、如化，以是故，菩薩摩訶薩於無量阿僧祇劫行六波羅蜜，成就眾生、淨佛國土，得阿耨多羅三藐三菩提。」&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　名相虛妄 · 假名與相&lt;/h2&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;本節要旨&lt;/div&gt;&lt;p&gt;本節進一步追問：既然萬法如夢如化，&lt;strong&gt;眾生在何處住&lt;/strong&gt;？佛答：「眾生但住名相虛妄憶想分別中。」菩薩行般若，正是於此名相虛妄中拔出眾生。經文續開「名」與「相」二門：&lt;strong&gt;名是「強作假施設」&lt;/strong&gt;，男女、大小、地獄、天人、四果乃至佛道，皆是和合假名；&lt;strong&gt;相分二種——色相與無色相&lt;/strong&gt;，凡夫於空法中憶想分別著心，皆名為相。最後以反證收束：若諸法定有非但名相，菩薩行般若便不能自益亦不能利他；正因諸法但有名相、無有實事，般若才能具足六度乃至十八不共法。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;p class=&quot;qa-q&quot;&gt;須菩提白佛言：「世尊！若一切法如夢、如響、如影、如焰、如幻、如化，眾生在何處住，菩薩行六波羅蜜而拔出之？」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;「須菩提！眾生但住名相虛妄憶想分別中，是故菩薩行般若波羅蜜，於名相虛妄中拔出眾生。」&lt;/p&gt;
&lt;p class=&quot;qa-q&quot;&gt;須菩提白佛言：「世尊！何等是名？何等是相？」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;佛言：「此名強作假施設，所謂此色、此受想行識，此男、此女，此大、此小，此地獄、此畜生、此餓鬼，此人、此天，此有為、此無為，此須陀洹果、斯陀含果、阿那含果、阿羅漢果、辟支佛道，此佛道。須菩提！一切和合法皆是假名，以名取諸法，是故為名。一切有為法，但有名相，凡夫愚人於中生著。」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;「何等為相？須菩提！有二種相，凡夫人所著處。何等為二？一者、色相，二者、無色相。須菩提！何等名色相？諸所有色，若麁若細、若好若醜，皆是空；是空法中憶想分別著心，是名為色相。何等是無色相？諸無色法，憶想分別，著心取相故生煩惱，是名無色相。是菩薩摩訶薩教化眾生令遠離是相，安立眾生於無相性中。」&lt;/p&gt;
&lt;p class=&quot;qa-q&quot;&gt;須菩提白佛言：「世尊！若一切法但有名相，云何菩薩行般若波羅蜜能自饒益，亦教他人令得善利？云何菩薩具足諸地，從一地至一地，教化眾生令得三乘？」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;佛告須菩提：「若諸法根本定有、非但名相者，菩薩行般若波羅蜜時，不能自益，亦不能利益他人。須菩提！諸法無有根本實事、但有名相，是故菩薩行般若波羅蜜時，能具足禪波羅蜜，無相故；毘梨耶波羅蜜、羼提波羅蜜、尸羅波羅蜜、檀波羅蜜，無相故；具足四禪、四無量心、四無色定，乃至十八不共法，無相故。是菩薩自具足善法，亦教他人具足善法。」&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第四節　無相法即一切法&lt;/h2&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;本節要旨&lt;/div&gt;&lt;p&gt;本節以一連串「無相法與X異不？」「不也」的層層詰問，導出中觀對「分齊」問題的根本回應：&lt;strong&gt;無相法即是須陀洹果、斯陀含果、阿那含果、阿羅漢果、辟支佛法、菩薩法、佛法&lt;/strong&gt;。三乘四果在現象上有差別，但證入的法性基底毫無二致。最後以「一切善法皆入三解脫門」作總樞紐——空、無相、無作三解脫門是一切善法的入口。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;p class=&quot;qa-q&quot;&gt;須菩提白佛言：「世尊！若一切法無相、無憶念，云何數是聲聞法、是辟支佛法、是菩薩法、是佛法？」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;佛告須菩提：「於汝意云何？無相法與聲聞法異不？」&lt;/p&gt;
&lt;p class=&quot;qa-q&quot;&gt;「不也！世尊！」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;「無相法與辟支佛法、菩薩法、佛法異不？」&lt;/p&gt;
&lt;p class=&quot;qa-q&quot;&gt;「不也！世尊！」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;佛告須菩提：「無相法即是須陀洹果、斯陀含果、阿那含果、阿羅漢果、辟支佛法、菩薩法、佛法？」&lt;/p&gt;
&lt;p class=&quot;qa-q&quot;&gt;須菩提言：「如是！世尊！」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;「須菩提！以是因緣故，當知一切法皆是無相。須菩提！菩薩摩訶薩學是一切法無相，得增益善法，所謂六波羅蜜，四禪、四無量心、四無色定，四念處乃至十八不共法。何以故？菩薩不以餘法為要，如三解脫門，所謂空、無相、無作。所以者何？一切善法皆入三解脫門。」&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第五節　五蘊般若觀 · 相·生滅·如&lt;/h2&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;本節要旨&lt;/div&gt;&lt;p&gt;本節是般若觀照的微觀解構。佛以&lt;strong&gt;三重維度（相·生滅·如）&lt;/strong&gt;逐一觀照五蘊：色如水沫無堅固、受如水中泡一起一滅、想如陽焰水不可得而妄生水想、行如芭蕉葉葉除卻不得堅實、識如幻師幻作四種兵無有實。每一蘊皆答「云何知X相、云何知X生滅、云何知X如」三問，最終皆歸於「不生不滅、不來不去、不增不減、不垢不淨」的「如」。觀照範圍從五蘊延展到十二入、十八界、四聖諦、十二因緣，&lt;strong&gt;普適無餘&lt;/strong&gt;。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;p class=&quot;qa-q&quot;&gt;須菩提白佛言：「世尊！云何菩薩摩訶薩行般若波羅蜜，能學五受陰相？」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;佛告須菩提：「菩薩行般若波羅蜜，知色相，知色生滅，知色如。云何知色相？知色畢竟空，內分異、虛無實；譬如水沫無堅固，是為知色相。云何知色生滅？色生時無所從來、去無所至，若不來不去，是為知色生滅相。云何知色如？是色如不生不滅、不來不去、不增不減、不垢不淨。」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;「云何知受相？云何知受生滅？云何知受如？菩薩知諸受相如水中泡，一起一滅，是為知受相。知受生滅者，是受無所從來、去無所至，是為知受生滅。知受如者，是如不生不滅、不來不去、不增不減、不垢不淨，是為知受如。」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;「云何知想相？云何知想生滅？云何知想如？知想相者，是想如焰，水不可得，而妄生水想，是為知想相。知想生滅者，是想無所從來、去無所至，是為知想生滅。知想如者，諸想如不生不滅、不來不去、不增不減、不垢不淨，不轉於實相，是為知想如。」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;「云何知行相？云何知行生滅？云何知行如？知行相者，行如芭蕉，葉葉除卻，不得堅實，是為知行相。知行生滅者，諸行生無所從來、去無所至，是為知行生滅。知行如者，諸行不生不滅、不來不去、不增不減、不垢不淨，是為知行如。」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;「云何知識相？云何知識生滅？云何知識如？知識相者，如幻師幻作四種兵，無有實，識亦如是。知識生滅者，是識生時無所從來，滅時無所去，是為知識生滅。知識如者，知識不生不滅、不來不去、不垢不淨、不增不減，是為知識如。」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;「云何知諸入？眼，眼性空；乃至意，意性空。色，色性空；乃至法，法性空。云何知界？眼，眼界空；色，色界空；眼識，眼識界空；乃至意識界亦如是。云何知四聖諦？知苦聖諦時，遠離二法，知苦諦不二不別，是名苦聖諦；集、滅、道亦如是。云何知苦如？苦聖諦即是如，如即是苦聖諦。集、滅、道亦如是。云何知十二因緣？知十二因緣不生相，是名知十二因緣。」&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第六節　學法性即學一切法 · 工幻師喻&lt;/h2&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;本節要旨&lt;/div&gt;&lt;p&gt;本節為全品的辯證收束。先答「般若是否壞法性」之問：法性外法不可得，故般若不壞法性。再答「學法性是否無所學」之問：學法性即學一切法，因一切法皆入無相無為性中。須菩提乃發出最終疑難——若一切法即法性，何以菩薩學六度、四禪、四無量、十地乃至三十二相？「將無菩薩墮非道中？」佛肯認「色即是法性，法性即是色」，並以&lt;strong&gt;工幻師譬喻&lt;/strong&gt;作大總結：菩薩從初發意行六度乃至成佛三十二相，皆如工幻師幻作種種形色——無智之人歎為實有，有智之士知「中無實事，而以無所有法娛樂眾人」。「以法性前後中無異，是故是菩薩行般若波羅蜜，為利益眾生故，行菩薩道。」&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;p class=&quot;qa-q&quot;&gt;須菩提白佛言：「世尊！若菩薩摩訶薩行般若波羅蜜時，各各分別知諸法，將無以色性壞法性，乃至一切種智性壞法性耶？」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;佛告須菩提：「若法性外更有法者，應壞法性。法性外法不可得，是故不壞。何以故？須菩提！佛及佛弟子知法性外法不可得故，不說法性外有法。如是，須菩提！菩薩摩訶薩行般若波羅蜜，應學法性。」&lt;/p&gt;
&lt;p class=&quot;qa-q&quot;&gt;須菩提白佛言：「世尊！菩薩摩訶薩若學法性，為無所學？」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;佛告須菩提：「菩薩摩訶薩若學法性，則學一切法。何以故？一切法即是法性。」&lt;/p&gt;
&lt;p class=&quot;qa-q&quot;&gt;須菩提白佛言：「世尊！何因緣故一切法即是法性？」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;佛言：「一切法皆入無相無為性中，以是因緣故，學法性則學一切法。」&lt;/p&gt;
&lt;p class=&quot;qa-q&quot;&gt;須菩提白佛言：「世尊！若一切法即是法性，菩薩摩訶薩何以學般若波羅蜜……乃至何以學阿耨多羅三藐三菩提，學已得一切種智、知一切法？世尊！諸法法性中無是分別！世尊！將無菩薩墮非道中？何以故？世尊！法性中無如是分別。法性中無色，無受、想、行、識，諸法性亦不遠離色、受、想、行、識；色即是法性，法性即是色；受、想、行、識亦爾，一切法亦如是。」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;佛告須菩提：「如是！如是！如汝所言：『色即是法性，受、想、行、識即是法性。』須菩提！菩薩摩訶薩行般若波羅蜜時，若法性外見有法者，為不求阿耨多羅三藐三菩提。菩薩摩訶薩行般若波羅蜜時，知一切法性即是阿耨多羅三藐三菩提；以是故，菩薩摩訶薩行般若波羅蜜時，知一切法即是法性已，以無名相之法以名相說，所謂是色，是受、想、行、識，乃至是阿耨多羅三藐三菩提。」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;「須菩提！譬如工幻師若幻師弟子，多人處立，幻作種種形色：男、女，象、馬，端嚴園林，及諸廬館、流泉、浴池、衣服、臥具、香華、瓔珞、餚饍、飲食，作眾伎樂，以樂眾人。又復幻作人，令布施、持戒、忍辱、精進、禪定、修智慧。是幻師復幻作剎利大姓、婆羅門大姓、居士大家，四天王天處、須彌山三十三天、夜摩天、兜率陀天、化樂天、他化自在天以示眾人，復幻作梵眾天乃至非有想非無想天，復幻作須陀洹、斯陀含、阿那含、阿羅漢、辟支佛。菩薩摩訶薩從初發意行檀波羅蜜、尸羅波羅蜜、羼提波羅蜜、毘梨耶波羅蜜、禪波羅蜜、般若波羅蜜，行初地乃至行十地，入菩薩位，遊戲神通，成就眾生，淨佛國土，遊戲諸禪、解脫、三昧，行佛十力、四無所畏、四無礙智、十八不共法、大慈大悲，具足佛身三十二相、八十隨形好，以示眾人。是中無智之人歎：『未曾有！是人多能，巧為眾事，娛樂眾人，種種形色，乃至三十二相、八十隨形好莊嚴佛身。』其中有智之士思惟言：『未曾有也！是中無有實事，而以無所有法娛樂眾人，令有形相，無事事相，無有有相。』」&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;「如是，須菩提！菩薩摩訶薩不見離法性有法，行般若波羅蜜，以方便力故，雖不得眾生，而自布施，亦教人布施……自行十善，亦教人行十善……自受八戒齋……自行初禪乃至自行第四禪，自行慈、悲、喜、捨……自行四念處乃至八聖道分。自行三解脫門，佛十力，乃至自行十八不共法，亦教他人行十八不共法，讚歎十八不共法，歡喜讚歎行十八不共法者。須菩提！若法性前、後、中有異者，是菩薩摩訶薩不能以方便力示法性、成就眾生。須菩提！以法性前、後、中無異，是故是菩薩行般若波羅蜜，為利益眾生故，行菩薩道。」&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;ch2&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第三品 · 第二章&lt;/div&gt;
&lt;h2 class=&quot;ch-name&quot;&gt;破 立 之 初&lt;/h2&gt;
&lt;div class=&quot;ch-sub&quot;&gt;化 人 隱 喻 與 認 識 論 基 底&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;本章導讀&lt;/div&gt;
&lt;p&gt;論文以「中觀辯證螺旋」五階為主結構：&lt;strong&gt;破立之初 → 慈悲悖論 → 空性賦能 → 微觀解構 → 終極不二&lt;/strong&gt;。第一階「破立之初」要解決的是&lt;strong&gt;認識論基底&lt;/strong&gt;——當佛說菩薩「善達諸法相」時，「達」的是什麼？「相」又是什麼？論文以化人隱喻為錨點，揭示菩薩的認識論不是「對實體的精細分析」，而是&lt;strong&gt;對自性實有的徹底懸置&lt;/strong&gt;。穿透表象的「不分別」，方為真達。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　何 謂 「 善 達 諸 法 相 」 ？&lt;/h2&gt;
&lt;p&gt;須菩提發出全品的開卷一問：「云何菩薩善達諸法相？」這個問題背後埋伏著一個常識假設——「達」是某種更精細、更全面的認識。但佛的回答完全顛覆了這個預設。&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;經文&lt;/span&gt;
譬如化人不行婬、怒、癡，不行色乃至識，不行內、外法，不行諸煩惱結使，不行有漏法、無漏法，世間法、出世間法，有為法、無為法，亦無聖果；菩薩亦如是，無有是事，亦不分別是法，是名善達諸法相。
&lt;/div&gt;
&lt;p&gt;佛沒有正面定義「相」是什麼，也沒有列舉菩薩需要「達」哪些內容。相反，佛用了一連串&lt;strong&gt;否定性的對舉&lt;/strong&gt;——煩惱對清淨、有漏對無漏、世間對出世間、有為對無為——說化人「不行」這些，菩薩亦如是「無有是事，亦不分別是法」。&lt;/p&gt;
&lt;p&gt;關鍵字在&lt;strong&gt;「亦不分別是法」&lt;/strong&gt;。「分別」不是普通的辨識，而是中觀特指的、執自性實有的概念分割。菩薩的認識論不是建構更精細的概念地圖，而是&lt;strong&gt;對自性實有的徹底懸置（epoché）&lt;/strong&gt;。「達」之所以稱為「善達」，恰恰因為它穿透表象的概念分別，而非堆積更多分別。&lt;/p&gt;
&lt;h2&gt;第二節　化 人 隱 喻 · 本 質 的 懸 置&lt;/h2&gt;
&lt;p&gt;論文用「Substantial Reality vs Non-substantial Emanation」標示這一節的核心——&lt;strong&gt;實體眾生 vs 化人/菩薩&lt;/strong&gt;。化人是佛教經典中反覆出現的譬喻：佛或菩薩以神通力幻化出來的人形，能行走說話、修道布施，卻沒有「根本實事」。&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;有 根 本 實 事&lt;/div&gt;
&lt;p&gt;實體眾生：被預設為有「自性」的存在者。一切煩惱、業行、修道、果位皆基於這個預設運作。凡夫的認識基底。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;無 根 本 實 事&lt;/div&gt;
&lt;p&gt;化人 / 菩薩：因緣現起、無自性的顯現。所有「行」皆是緣起的呈現，不存在「行的實體主體」。菩薩善達諸法相的認識基底。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;須菩提隨即印證：「不也！佛所化人，無有根本實事，亦無垢無淨，亦不在五道生死。」這個印證的關鍵不在於「化人不存在」——化人在現象上完全可見、可動、可說話——而在於&lt;strong&gt;化人的『可見可動』與『有自性實事』完全脫鉤&lt;/strong&gt;。&lt;/p&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;哲學洞察&lt;/div&gt;
&lt;p&gt;化人隱喻的真正力量在於：它示範了一種&lt;strong&gt;「現象上有、本體上空」&lt;/strong&gt;的可能。一切凡夫關於「眾生」「修道」「成佛」的概念，都建立在「有根本實事」的預設上；菩薩的善達，正是把這個預設拔除，同時不否認現象的可見性。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　化 人 修 道 · 超 越 二 元 對 立&lt;/h2&gt;
&lt;p&gt;須菩提問得進一步：「化人云何有修道？」——既然無實事，怎麼還能修道？佛答：「化人修道，不垢不淨，亦不在五道生死。」&lt;/p&gt;
&lt;div class=&quot;spectrum&quot;&gt;
&lt;div class=&quot;sp-node sp-left&quot;&gt;
&lt;h5&gt;垢 / 凡夫&lt;/h5&gt;
&lt;small&gt;在五道生死中&lt;/small&gt;
&lt;/div&gt;
&lt;div class=&quot;sp-node sp-mid&quot;&gt;
&lt;h5&gt;化 人 修 道&lt;/h5&gt;
&lt;small&gt;不垢不淨 · 不在五道生死&lt;/small&gt;
&lt;/div&gt;
&lt;div class=&quot;sp-node sp-right&quot;&gt;
&lt;h5&gt;淨 / 解脫&lt;/h5&gt;
&lt;small&gt;出五道生死&lt;/small&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;注意「不垢不淨，亦不在五道生死」這句話的精妙：它不是把化人定位在「淨」這一端，也不是把化人歸於「不在生死的解脫」一端。&lt;strong&gt;化人超出整個「垢↔淨」「生死↔解脫」的二元光譜&lt;/strong&gt;——因為這個光譜本身假設了一個有自性的「能生死、能解脫」的主體。&lt;/p&gt;
&lt;p&gt;佛收束：「如是，須菩提！菩薩摩訶薩善達諸法相，亦如是。」菩薩的認識基底就在這裡確立——不是站在「淨」這一邊壓制「垢」，而是徹底懸置整個二元結構，讓現象按其緣起本然顯現。這個懸置一旦完成，下一階「慈悲悖論」就不可避免地浮出來：既然如此，菩薩何故還要行六度？&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;ch3&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第三品 · 第三章&lt;/div&gt;
&lt;h2 class=&quot;ch-name&quot;&gt;慈 悲 悖 論&lt;/h2&gt;
&lt;div class=&quot;ch-sub&quot;&gt;萬 法 如 化 中 的 菩 薩 行&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;本章導讀&lt;/div&gt;
&lt;p&gt;第一階「破立之初」確立了菩薩的認識論基底——一切如化、無有實事。但這個基底立刻引爆一個實踐悖論：&lt;strong&gt;既然眾生如化、五道如化、解脫如化，菩薩為何要於阿僧祇劫行六波羅蜜？&lt;/strong&gt;論文標示為「Logical Chasm（邏輯斷崖）」——本體論的空（Ontological Emptiness）與救度論的行（Soteriological Action）之間的張力。本章拆解佛如何以「認知不對稱性」翻轉這個悖論，並一路深入「眾生但住名相中」「假名與相」的本體論陷阱。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　須 菩 提 的 詰 問 · 實 踐 的 悖 論&lt;/h2&gt;
&lt;p&gt;須菩提把問題推到極限：「若一切色如化、一切受想行識如化、一切法如化，化人無色、無受想行識、無垢無淨、無五道生死亦無解脫處，&lt;strong&gt;菩薩有何等功用&lt;/strong&gt;？」&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;&lt;strong&gt;本體論前提（Ontological Emptiness）&lt;/strong&gt;&lt;small&gt;萬法如化、無實體、無解脫處&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot; style=&quot;border-left-color:#8B2500;background:#fef5f0;&quot;&gt;&lt;strong&gt;邏輯斷崖（Logical Chasm）&lt;/strong&gt;&lt;small&gt;看似推不出菩薩行的必要性&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;&lt;strong&gt;救度論質問（Soteriological Action）&lt;/strong&gt;&lt;small&gt;菩薩何故行六度、淨佛國土、成就眾生？&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;這個質問的鋒銳處在於：它不是質疑空義，也不是反對慈悲，而是&lt;strong&gt;把空義推到底，問慈悲行動還能否站得住&lt;/strong&gt;。如果一切真的如化，那麼救度本身似乎就是一種徒勞——救誰？從何處救出？救到哪裡去？&lt;/p&gt;
&lt;p&gt;佛的初步回應令人意外：「菩薩摩訶薩本行菩薩道時，頗見有眾生從地獄、餓鬼、畜生、人、天中得解脫不？」須菩提答：「不也！世尊！」佛肯認：「菩薩摩訶薩不見眾生從三界得解脫。」——佛沒有反駁須菩提的本體論前提，反而把它推得更徹底：菩薩自己也&lt;strong&gt;不見&lt;/strong&gt;眾生從三界得解脫。&lt;/p&gt;
&lt;h2&gt;第二節　認 知 的 不 對 稱 性 · 拔 除 虛 妄 苦&lt;/h2&gt;
&lt;p&gt;關鍵翻轉在這裡：「&lt;strong&gt;若眾生自知諸法如幻、如化，菩薩摩訶薩終不於阿僧祇劫為眾生行菩薩道。須菩提！以眾生自不知諸法如幻、如化，以是故，菩薩摩訶薩於無量阿僧祇劫行六波羅蜜，成就眾生、淨佛國土，得阿耨多羅三藐三菩提。&lt;/strong&gt;」&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;菩 薩 視 角 · 知&lt;/div&gt;
&lt;p&gt;見知一切法如幻、如化。不見眾生從三界得解脫，因為在如化的層面確實無「實體眾生」可解脫。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;眾 生 視 角 · 不 知&lt;/div&gt;
&lt;p&gt;自不知諸法如幻、如化。把如化的現象當作實有，於是於虛妄上起虛妄分別，自起無量痛苦。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;菩薩行的真正動力，不在於拔除「實有的眾生」從「實有的苦」中——那本就不存在；&lt;strong&gt;而在於拔除眾生『因不知如化而起的虛妄苦』&lt;/strong&gt;。這個翻轉一次解決兩個問題：&lt;/p&gt;
&lt;ul class=&quot;checklist&quot;&gt;
&lt;li&gt;本體論層面，菩薩沒有預設「實有的眾生」，所以不違背空義。&lt;/li&gt;
&lt;li&gt;救度論層面，眾生的「不知」是現象上真實發生的，由此產生的痛苦也是現象上真實感受到的——所以菩薩行有對象可拔、有效用可立。&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;論文核心命題&lt;/div&gt;
&lt;p&gt;菩薩的動力建立在「知」與「不知」的&lt;strong&gt;認知不對稱性&lt;/strong&gt;上。空義不取消慈悲，反而給予慈悲一個徹底乾淨的基底：菩薩不是在拯救實體，而是在化解虛妄。這個基底一旦確立，「為利益眾生故行菩薩道」與「不見眾生從三界得解脫」就不再矛盾。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　眾 生 但 住 名 相 中 · 虛 妄 的 牢 籠&lt;/h2&gt;
&lt;p&gt;須菩提繼續追問：「若一切法如夢、如響、如影、如焰、如幻、如化，眾生在何處住，菩薩行六波羅蜜而拔出之？」這是一個極其精細的補充問——既然連眾生本身都如化，「拔出」的場所何在？&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;佛 答&lt;/span&gt;
須菩提！眾生但住&lt;strong&gt;名相虛妄憶想分別&lt;/strong&gt;中，是故菩薩行般若波羅蜜，於名相虛妄中拔出眾生。
&lt;/div&gt;
&lt;p&gt;「眾生但住名相虛妄憶想分別中」——這句話定位了菩薩行的真正戰場。眾生不是住在某個本體論的實處，而是&lt;strong&gt;住在名相虛妄中&lt;/strong&gt;。菩薩行般若，要拔的不是物理的眾生，而是&lt;strong&gt;眾生憶想分別所構築的虛妄牢籠&lt;/strong&gt;。&lt;/p&gt;
&lt;div class=&quot;domino-chain&quot;&gt;
&lt;div class=&quot;domino&quot;&gt;名相&lt;/div&gt;
&lt;span class=&quot;chain-arrow&quot;&gt;→&lt;/span&gt;
&lt;div class=&quot;domino&quot;&gt;虛妄憶想&lt;/div&gt;
&lt;span class=&quot;chain-arrow&quot;&gt;→&lt;/span&gt;
&lt;div class=&quot;domino&quot;&gt;分別執取&lt;/div&gt;
&lt;span class=&quot;chain-arrow&quot;&gt;→&lt;/span&gt;
&lt;div class=&quot;domino&quot;&gt;煩惱&lt;/div&gt;
&lt;span class=&quot;chain-arrow&quot;&gt;→&lt;/span&gt;
&lt;div class=&quot;domino&quot;&gt;虛妄苦&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;這條因果鏈一路推下去，「眾生」與「苦」其實都是名相分別的產物。菩薩行般若，正是從這條鏈的源頭——名相——下手。&lt;/p&gt;
&lt;h2&gt;第四節　假 名 與 相 · 語 言 的 本 體 論 陷 阱&lt;/h2&gt;
&lt;p&gt;須菩提乘勢追問：「何等是名？何等是相？」佛分別開示。&lt;/p&gt;
&lt;h3&gt;一、名 — 強 作 假 施 設&lt;/h3&gt;
&lt;div class=&quot;classical-text&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;經文&lt;/span&gt;
此名強作假施設，所謂此色、此受想行識，此男、此女，此大、此小，此地獄、此畜生、此餓鬼，此人、此天，此有為、此無為，此須陀洹果、斯陀含果、阿那含果、阿羅漢果、辟支佛道，此佛道。&lt;strong&gt;須菩提！一切和合法皆是假名，以名取諸法，是故為名。&lt;/strong&gt;一切有為法，但有名相，凡夫愚人於中生著。
&lt;/div&gt;
&lt;p&gt;佛列舉的「名」極為徹底——從色受想行識、男女大小，到六道、有為無為、四果乃至佛道，&lt;strong&gt;全部&lt;/strong&gt;都歸入「強作假施設」。「強作」二字尤為精妙：名相不是自然生成，而是&lt;strong&gt;被強加&lt;/strong&gt;於緣起和合上的概念標籤。「以名取諸法，是故為名」——名相的功能就是「取」，把流動的因緣切成可指認的塊，凡夫於這些塊上生著，便落入語言的本體論陷阱。&lt;/p&gt;
&lt;h3&gt;二、相 — 凡 夫 二 種 著 處&lt;/h3&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;色 相&lt;/div&gt;
&lt;p&gt;諸所有色，若麁若細、若好若醜，皆是空；是空法中憶想分別著心，是名為色相。&lt;br/&gt;&lt;small&gt;對「形色現象」的執取——把流動的色當作有自性的對象。&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;無 色 相&lt;/div&gt;
&lt;p&gt;諸無色法，憶想分別，著心取相故生煩惱，是名無色相。&lt;br/&gt;&lt;small&gt;對「無色概念」（如空、無、靜止等）的執取——把抽象的概念當作可把捉的實體。&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;「無色相」這個範疇尤為重要。它預先堵住了一個常見的誤讀——「我已經知道一切是空，所以我不執著色相了」。&lt;strong&gt;對「空」「無」「無相」本身的執取也是相&lt;/strong&gt;。菩薩的教化目標是「令遠離是相，安立眾生於無相性中」——不是在「色相 vs 無色相」中選邊，而是徹底超出整個著相結構。&lt;/p&gt;
&lt;h3&gt;三、邏 輯 反 證 · 若 諸 法 實 有&lt;/h3&gt;
&lt;p&gt;須菩提再進一步：若一切法但有名相，菩薩行般若如何能自饒益、利他、具足諸地、教化三乘？佛的反證極為犀利：&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;反 證&lt;/span&gt;
若諸法&lt;strong&gt;根本定有、非但名相&lt;/strong&gt;者，菩薩行般若波羅蜜時，&lt;strong&gt;不能自益，亦不能利益他人&lt;/strong&gt;。
&lt;/div&gt;
&lt;p&gt;邏輯翻轉：諸法若實有，菩薩才反而&lt;strong&gt;不能&lt;/strong&gt;行六度——因為實有的東西不可改變，沒有可塑性，亦沒有教化空間。&lt;strong&gt;正因為諸法無有根本實事、但有名相，般若才能具足六波羅蜜、四禪、四無量、乃至十八不共法。&lt;/strong&gt;「無相」不是行的障礙，而是行的條件。這就為下一章「空性賦能」鋪好了底。&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;ch4&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第三品 · 第四章&lt;/div&gt;
&lt;h2 class=&quot;ch-name&quot;&gt;空 性 賦 能&lt;/h2&gt;
&lt;div class=&quot;ch-sub&quot;&gt;無 相 作 為 六 度 的 充 要 條 件&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;本章導讀&lt;/div&gt;
&lt;p&gt;第三章揭露了名相的本體論陷阱，並以反證指出：諸法若實有，菩薩反不能行六度。本章正面開展「空性賦能」這一中觀獨特的辯證翻轉——&lt;strong&gt;無相不是六度的障礙，而是六度具足的充要條件&lt;/strong&gt;。系統正因為「無相」才具備無限的可塑性與流動性；凡夫所執之相，反而是真正的束縛。論文以此章作為從「破」到「立」的轉軸：前面破除了實體執著，這裡立起了無相的動能。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　色 相 與 無 色 相 的 雙 層 結 構&lt;/h2&gt;
&lt;p&gt;承接前章「相分二種」的開示，本節再深入辨析&lt;strong&gt;執取的雙層結構&lt;/strong&gt;。論文指出，破除對「空 / 無色」的實體化執著，是般若智的核心特徵。&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;第 一 層 · 色 相 執 取&lt;/div&gt;
&lt;p&gt;於有色法（形色、聲音、現象）上著心取相。&lt;small&gt;對應一般人對外在世界的實體執取。&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;第 二 層 · 無 色 相 執 取&lt;/div&gt;
&lt;p&gt;於無色法（空、無、無相、寂滅、概念抽象）上著心取相。&lt;small&gt;對應修行人對內在境界的實體執取——更隱蔽、更難破除。&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;修行最危險的階段，往往是已破色相而執無色相的階段。「我已經明白空了」「我已經到無相境界」——這些說法本身就把「空」「無相」物化為一個可達到、可保持的境界。佛在此明確指出：&lt;strong&gt;對「無」的執取，與對「有」的執取，同屬凡夫著處&lt;/strong&gt;。&lt;/p&gt;
&lt;h2&gt;第二節　雙 遣 的 方 便 力 · 教 化 離 兩 邊&lt;/h2&gt;
&lt;p&gt;菩薩的教學法因此必須是「雙遣」——既不立眾生於色相，也不立眾生於著無相。論文標示這一節的核心命題為：&lt;/p&gt;
&lt;div class=&quot;verse&quot;&gt;教學目標：教化眾生遠離相，令住無相性中。&lt;br/&gt;中道實踐：令不著二法，所謂是相、是無相。&lt;/div&gt;
&lt;p&gt;「無相性」與「無相」必須細辨。「無相」若被執取為一個境界、一個對象，就成了著無相；&lt;strong&gt;「無相性」則是萬法的本然性質&lt;/strong&gt;——它不是某個可以取得的東西，而是現象本身的緣起無自性的事實。&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;&lt;strong&gt;第一階段&lt;/strong&gt; · 凡夫執色相 → 教令觀色空，遠離色相&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;&lt;strong&gt;第二階段&lt;/strong&gt; · 修行人執無色相 → 教令觀「空亦空」，遠離無色相&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot; style=&quot;border-left-color:var(--gold);background:#fff8e8;&quot;&gt;&lt;strong&gt;第三階段（究竟）&lt;/strong&gt; · 安立眾生於無相性中——不立任何相，亦不立任何「離相」之境界&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　邏 輯 反 證 · 若 諸 法 實 有 則 菩 薩 無 能&lt;/h2&gt;
&lt;p&gt;佛在前章已開出反證的雛形，本節進一步把它的邏輯結構展開。論文以「邏輯反證」為標題：&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col-card&quot; style=&quot;border-left:4px solid #8B2500;&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;前 提 假 設&lt;/div&gt;
&lt;p&gt;若諸法根本定有、非但名相者……&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot; style=&quot;border-left:4px solid #8B2500;&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;邏 輯 後 果&lt;/div&gt;
&lt;p&gt;菩薩行般若波羅蜜時，不能自益，亦不能利益他人。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;這個反證的形式在中觀論典中極為常見（《中論》〈觀四諦品〉的核心論式即此）：&lt;strong&gt;實有導致無能&lt;/strong&gt;。若諸法有自性實有，則：&lt;/p&gt;
&lt;ul class=&quot;checklist&quot;&gt;
&lt;li&gt;不可變化——煩惱便不能斷、福德便不能增、眾生便不能成佛。&lt;/li&gt;
&lt;li&gt;不可教化——眾生有自性，便沒有從不知到知、從凡夫到菩薩的轉化空間。&lt;/li&gt;
&lt;li&gt;不能相互——一個有自性的法不能與另一法產生實質作用，「行六度」便無實質意義。&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;反過來說：&lt;strong&gt;正因諸法無自性、但有名相，世間一切轉化、教化、修證才有可能發生。&lt;/strong&gt;「無相」是動能的條件，不是動能的取消。&lt;/p&gt;
&lt;h2&gt;第四節　無 相 的 動 能 · 六 度 具 足&lt;/h2&gt;
&lt;p&gt;佛在此正面開出「無相賦能」的清單：&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;經文&lt;/span&gt;
諸法無有根本實事、但有名相，是故菩薩行般若波羅蜜時，能&lt;strong&gt;具足禪波羅蜜，無相故&lt;/strong&gt;；毘梨耶波羅蜜、羼提波羅蜜、尸羅波羅蜜、檀波羅蜜，&lt;strong&gt;無相故&lt;/strong&gt;；具足四禪、四無量心、四無色定，乃至十八不共法，&lt;strong&gt;無相故&lt;/strong&gt;。
&lt;/div&gt;
&lt;p&gt;每一句都以「無相故」結尾——無相是六度具足、四禪四無量具足、乃至十八不共法具足的&lt;strong&gt;充要條件&lt;/strong&gt;。論文以一個圖示總結：&lt;/p&gt;
&lt;div class=&quot;triangle-diagram&quot;&gt;
&lt;div class=&quot;tri-node&quot;&gt;&lt;h5&gt;六 波 羅 蜜&lt;/h5&gt;&lt;small&gt;檀 · 尸 · 羼 · 毘梨耶 · 禪 · 般若&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;tri-node&quot;&gt;&lt;h5&gt;四 禪 / 四 無 量 心 / 四 無 色 定&lt;/h5&gt;&lt;small&gt;定學的全幅&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;tri-node&quot;&gt;&lt;h5&gt;佛 十 八 不 共 法&lt;/h5&gt;&lt;small&gt;佛地圓滿德相&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p style=&quot;text-align:center;color:var(--gold);font-weight:600;font-size:21px;margin-top:14px;&quot;&gt;↑ 一切善法 · 皆以「無相」為入口 · 為動能 · 為條件 ↑&lt;/p&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;論文核心洞察&lt;/div&gt;
&lt;p&gt;因為「無相」，系統才具備&lt;strong&gt;無限的可塑性與流動性&lt;/strong&gt;，菩薩因此能「自具足善法，亦教他人具足善法」。空性不是動能的取消，而是動能的源頭——一切善法在「無相」中得以無限增益。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第五節　三 乘 同 歸 · 法 性 無 異&lt;/h2&gt;
&lt;p&gt;本節處理一個延伸問題：若一切法無相、無憶念，云何分立「聲聞法、辟支佛法、菩薩法、佛法」？&lt;/p&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;p class=&quot;qa-q&quot;&gt;&lt;strong&gt;佛問：&lt;/strong&gt;無相法與聲聞法異不？&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;&lt;strong&gt;答：&lt;/strong&gt;不也！世尊。&lt;/p&gt;
&lt;p class=&quot;qa-q&quot;&gt;&lt;strong&gt;佛問：&lt;/strong&gt;無相法與辟支佛法、菩薩法、佛法異不？&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;&lt;strong&gt;答：&lt;/strong&gt;不也！世尊。&lt;/p&gt;
&lt;p class=&quot;qa-q&quot;&gt;&lt;strong&gt;佛肯認：&lt;/strong&gt;無相法即是須陀洹果、斯陀含果、阿那含果、阿羅漢果、辟支佛法、菩薩法、佛法。&lt;/p&gt;
&lt;/div&gt;
&lt;p&gt;論文標示這是「三乘佛法的基底同一性」——&lt;strong&gt;現象與果位有差異，但證悟的法性基底毫無二致&lt;/strong&gt;。聲聞、緣覺、菩薩、佛在道相、果相、行相上各有差別，但這些差別都是名相分別；&lt;strong&gt;所證的法性，唯是無相&lt;/strong&gt;。&lt;/p&gt;
&lt;p&gt;「以是因緣故，當知一切法皆是無相。」——這是佛從前面所有反證、推論、雙遣推到的最終結論。&lt;/p&gt;
&lt;h2&gt;第六節　總 樞 紐 · 一 切 善 法 入 三 解 脫 門&lt;/h2&gt;
&lt;p&gt;本章最後以「總樞紐」收束：菩薩學一切法無相，得增益善法——六波羅蜜、四禪、四無量、四無色定、四念處乃至十八不共法。但這些善法的&lt;strong&gt;共同入口&lt;/strong&gt;，唯是三解脫門。&lt;/p&gt;
&lt;div class=&quot;triangle-diagram&quot;&gt;
&lt;div class=&quot;tri-node&quot; style=&quot;border-color:var(--gold);background:#fff8e8;&quot;&gt;
&lt;h5&gt;空 解 脫 門&lt;/h5&gt;
&lt;small&gt;一切法無自性&lt;/small&gt;
&lt;/div&gt;
&lt;div class=&quot;tri-node&quot; style=&quot;border-color:var(--gold);background:#fff8e8;&quot;&gt;
&lt;h5&gt;無 相 解 脫 門&lt;/h5&gt;
&lt;small&gt;一切法無相&lt;/small&gt;
&lt;/div&gt;
&lt;div class=&quot;tri-node&quot; style=&quot;border-color:var(--gold);background:#fff8e8;&quot;&gt;
&lt;h5&gt;無 作 解 脫 門&lt;/h5&gt;
&lt;small&gt;一切法無作無起相&lt;/small&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;classical-text&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;經文&lt;/span&gt;
菩薩不以餘法為要，如三解脫門，所謂空、無相、無作。所以者何？&lt;strong&gt;一切善法皆入三解脫門。&lt;/strong&gt;
&lt;/div&gt;
&lt;p&gt;「皆入」二字精妙——不是「相應」，不是「對應」，而是「皆入」。一切善法的本性即是三解脫門；偏離三解脫門的善法，是有漏世間有限福德，難契究竟。第四章至此完成「破→立」的轉軸：破除實有後，立起的不是另一個實體，而是&lt;strong&gt;空、無相、無作三解脫門作為一切善法的總樞紐&lt;/strong&gt;。&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;ch5&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第三品 · 第五章&lt;/div&gt;
&lt;h2 class=&quot;ch-name&quot;&gt;微 觀 解 構&lt;/h2&gt;
&lt;div class=&quot;ch-sub&quot;&gt;五 蘊 般 若 觀 的 三 重 維 度&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;本章導讀&lt;/div&gt;
&lt;p&gt;前四章完成了從認識論基底到「空性賦能」的宏觀辯證。本章進入&lt;strong&gt;微觀解構（Analysis）&lt;/strong&gt;——以三重維度（相 · 生滅 · 如）逐一觀照五蘊，並一路延展到十二入、十八界、四聖諦、十二因緣。論文標示的核心是：般若波羅蜜的解構具有&lt;strong&gt;普適性&lt;/strong&gt;，核心皆指向「性空」與「實相不二」。每一蘊都用一個經典譬喻——水沫、水泡、陽焰、芭蕉、幻兵——示範「相無實體、生滅無來去、如不增減」的般若觀照法。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　般 若 觀 照 的 三 重 維 度&lt;/h2&gt;
&lt;p&gt;須菩提問：「云何菩薩摩訶薩行般若波羅蜜，能學五受陰相？」佛的回答開出了般若觀照的&lt;strong&gt;標準三維結構&lt;/strong&gt;——對每一蘊都觀其「相、生滅、如」三面：&lt;/p&gt;
&lt;div class=&quot;triangle-diagram&quot;&gt;
&lt;div class=&quot;tri-node&quot;&gt;
&lt;h5&gt;知 「 相 」&lt;/h5&gt;
&lt;small&gt;Marks · Phenomenal Appearance&lt;br/&gt;該蘊在現象上呈現的特徵&lt;/small&gt;
&lt;/div&gt;
&lt;div class=&quot;tri-node&quot;&gt;
&lt;h5&gt;知 「 生 滅 」&lt;/h5&gt;
&lt;small&gt;Arising &amp;amp; Ceasing · Dynamics&lt;br/&gt;該蘊的流動：來無所從、去無所至&lt;/small&gt;
&lt;/div&gt;
&lt;div class=&quot;tri-node&quot;&gt;
&lt;h5&gt;知 「 如 」&lt;/h5&gt;
&lt;small&gt;Thusness · Absolute Reality&lt;br/&gt;該蘊的本然性：不生不滅、不增不減&lt;/small&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;這三維不是並列的三個視角，而是&lt;strong&gt;同一觀照的三個層次&lt;/strong&gt;：先觀現象（相），再觀流動（生滅），最終契入本然（如）。三者收於同一答案——「不生不滅、不來不去、不增不減、不垢不淨」。&lt;/p&gt;
&lt;h2&gt;第二節　五 蘊 解 剖 五 譬 喻&lt;/h2&gt;
&lt;p&gt;佛以五個經典譬喻一一解剖五蘊：&lt;/p&gt;
&lt;h3&gt;一、色 蘊 — 如 水 沫&lt;/h3&gt;
&lt;div class=&quot;classical-text&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;經文&lt;/span&gt;
知色畢竟空，內分異、虛無實；&lt;strong&gt;譬如水沫無堅固&lt;/strong&gt;，是為知色相。色生時無所從來、去無所至，若不來不去，是為知色生滅相。色如不生不滅、不來不去、不增不減、不垢不淨。
&lt;/div&gt;
&lt;p&gt;水沫是色蘊的標準譬喻。表面有形可見，伸手一觸即散；色法亦然——看似有堅固的物質實體，緣起拆分後，&lt;strong&gt;內分異、虛無實&lt;/strong&gt;。「無堅固」是色蘊般若觀照的核心結論。&lt;/p&gt;
&lt;h3&gt;二、受 蘊 — 如 水 中 泡&lt;/h3&gt;
&lt;div class=&quot;classical-text&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;經文&lt;/span&gt;
菩薩知諸&lt;strong&gt;受相如水中泡，一起一滅&lt;/strong&gt;。受無所從來、去無所至。受如不生不滅、不來不去、不增不減、不垢不淨。
&lt;/div&gt;
&lt;p&gt;水中泡是受蘊的譬喻——「一起一滅」捕捉了感受的剎那性。樂受、苦受、不苦不樂受看似實在，但每一受都是水面忽然鼓起又破滅的氣泡，無從來處、無至去處。&lt;/p&gt;
&lt;h3&gt;三、想 蘊 — 如 陽 焰&lt;/h3&gt;
&lt;div class=&quot;classical-text&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;經文&lt;/span&gt;
是&lt;strong&gt;想如焰，水不可得，而妄生水想&lt;/strong&gt;。想無所從來、去無所至。諸想如不生不滅、不來不去、不增不減、不垢不淨，&lt;strong&gt;不轉於實相&lt;/strong&gt;。
&lt;/div&gt;
&lt;p&gt;陽焰（鹿野中的海市蜃樓）是想蘊的譬喻。陽焰中本無水，遠望卻見水相；想蘊亦然——本無實體可分別，憶想分別卻自起種種「水想」（即概念取相）。「妄生水想」四字尤為精準。&lt;/p&gt;
&lt;h3&gt;四、行 蘊 — 如 芭 蕉&lt;/h3&gt;
&lt;div class=&quot;classical-text&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;經文&lt;/span&gt;
&lt;strong&gt;行如芭蕉，葉葉除卻，不得堅實&lt;/strong&gt;。諸行生無所從來、去無所至。諸行不生不滅、不來不去、不增不減、不垢不淨。
&lt;/div&gt;
&lt;p&gt;芭蕉樹幹外觀粗壯，剝開來層層皆是空心葉鞘——這是行蘊的譬喻。行蘊（造作意志、業行）看似有實體，逐層拆解每一念、每一意行，&lt;strong&gt;葉葉除卻，不得堅實&lt;/strong&gt;。&lt;/p&gt;
&lt;h3&gt;五、識 蘊 — 如 幻 兵&lt;/h3&gt;
&lt;div class=&quot;classical-text&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;經文&lt;/span&gt;
&lt;strong&gt;如幻師幻作四種兵，無有實，識亦如是&lt;/strong&gt;。是識生時無所從來，滅時無所去。知識不生不滅、不來不去、不垢不淨、不增不減。
&lt;/div&gt;
&lt;p&gt;幻師幻作四種兵（步、馬、車、象）——觀眾看見千軍萬馬，實則無一真實兵卒。識蘊亦然——眼識、耳識、鼻識、舌識、身識、意識看似各有所主，實則皆是緣起幻現，&lt;strong&gt;無有實&lt;/strong&gt;。&lt;/p&gt;
&lt;div class=&quot;four-grid&quot; style=&quot;margin-top:24px;&quot;&gt;
&lt;div class=&quot;col-card&quot;&gt;&lt;div class=&quot;col-head&quot;&gt;五 蘊 五 譬 喻 速 查&lt;/div&gt;
&lt;p style=&quot;font-size:18px;line-height:2;&quot;&gt;色 — 水沫，無堅固&lt;br/&gt;受 — 水中泡，一起一滅&lt;br/&gt;想 — 陽焰，妄生水想&lt;br/&gt;行 — 芭蕉，葉葉除卻&lt;br/&gt;識 — 幻兵，無有實&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;&lt;div class=&quot;col-head&quot;&gt;三 維 觀 照 統 一 結 論&lt;/div&gt;
&lt;p style=&quot;font-size:18px;line-height:2;&quot;&gt;不生 — 不來自任何處&lt;br/&gt;不滅 — 不去往任何處&lt;br/&gt;不增 — 不可累積&lt;br/&gt;不減 — 不可損耗&lt;br/&gt;不垢 — 不可染污&lt;br/&gt;不淨 — 不可清洗&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h2&gt;第三節　普 適 延 展 · 從 五 蘊 到 萬 法&lt;/h2&gt;
&lt;p&gt;觀照不止於五蘊。佛將同一三維結構推廣至四個範疇：&lt;/p&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;十 二 入&lt;/div&gt;
&lt;p&gt;眼，眼性空；乃至意，意性空。色，色性空；乃至法，法性空。&lt;small&gt;內六根 + 外六塵的全幅性空。&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;十 八 界&lt;/div&gt;
&lt;p&gt;眼，眼界空；色，色界空；眼識，眼識界空；乃至意識界亦如是。&lt;small&gt;六根、六塵、六識的整體界域皆空。&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;四 聖 諦&lt;/div&gt;
&lt;p&gt;知苦聖諦時，遠離二法，&lt;strong&gt;知苦諦不二不別&lt;/strong&gt;，是名苦聖諦；集、滅、道亦如是。苦聖諦即是如，如即是苦聖諦。&lt;small&gt;苦諦與如不二——苦的本然即是如。&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;十 二 因 緣&lt;/div&gt;
&lt;p&gt;知&lt;strong&gt;十二因緣不生相&lt;/strong&gt;，是名知十二因緣。&lt;small&gt;緣起本身即是「不生相」——這是中觀對緣起最精純的理解。&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;論文核心洞察&lt;/div&gt;
&lt;p&gt;般若波羅蜜的解構具有&lt;strong&gt;普適性&lt;/strong&gt;——不論觀的對象是五蘊、十二入、十八界、四聖諦還是十二因緣，核心皆指向「性空」與「不二」。「不二」這個詞特別重要：苦諦不二、苦諦即如、如即苦諦——不是說苦諦消失了，而是&lt;strong&gt;苦諦的真實樣貌，本來就是如&lt;/strong&gt;。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第四節　「 如 」 的 終 極 定 義&lt;/h2&gt;
&lt;p&gt;本章五蘊到萬法的解構，最終都歸於同一個詞——&lt;strong&gt;如&lt;/strong&gt;。佛在《大智度論》他處對「如」的定義：&lt;/p&gt;
&lt;div class=&quot;verse&quot;&gt;如，名如實不虛&lt;br/&gt;如前，如後，如中&lt;br/&gt;不變不異&lt;/div&gt;
&lt;p&gt;「如」是中觀本體論的核心字眼，常譯為 Tathatā（真如）、Thusness、Suchness。它的關鍵性質：&lt;/p&gt;
&lt;ul class=&quot;checklist&quot;&gt;
&lt;li&gt;&lt;strong&gt;如實&lt;/strong&gt;——不是建構，而是現象本然如此。&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;不虛&lt;/strong&gt;——不是虛無，而是空性中的真實性。&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;前後中不變不異&lt;/strong&gt;——時間、空間、條件變化中，「如」始終如一。&lt;/li&gt;
&lt;/ul&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;章節結語&lt;/div&gt;
&lt;p&gt;這條前後中皆不變不異的「如」之線，&lt;strong&gt;正是菩薩能在萬千生滅法中如如不動的本體論基礎&lt;/strong&gt;。一切法生滅、來去、垢淨、增減，都不影響「如」的不變不異——這就是菩薩行般若、不見眾生得解脫卻仍行六度的最終本體論依據。下一章將以此為基礎，走入「終極不二」的辯證收束。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;ch6&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第三品 · 第六章&lt;/div&gt;
&lt;h2 class=&quot;ch-name&quot;&gt;終 極 不 二&lt;/h2&gt;
&lt;div class=&quot;ch-sub&quot;&gt;法 性 無 異 與 工 幻 師 境 界&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;本章導讀&lt;/div&gt;
&lt;p&gt;第五章建立了「如」的本體論基礎。本章作為論文「螺旋辯證」的最後一階——&lt;strong&gt;終極不二（Holism）&lt;/strong&gt;——把所有前章的張力收束於一個總命題：&lt;strong&gt;色即是法性，法性即是色&lt;/strong&gt;。論文以工幻師譬喻為核心圖式，回答須菩提的最終疑難「無分別中的分別」，並以「法性前後中無異，故能行菩薩道」作全品的辯證收束。底層邏輯：從破除實有走向建立方便，最終歸於世俗與勝義的不二。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第一節　般 若 不 壞 法 性 · 解 構 非 消 滅&lt;/h2&gt;
&lt;p&gt;須菩提發出本章的開卷疑難：「若菩薩摩訶薩行般若波羅蜜時，各各分別知諸法，&lt;strong&gt;將無以色性壞法性，乃至一切種智性壞法性耶&lt;/strong&gt;？」——既然第五章用般若觀照逐一解構五蘊到十二因緣，是否因此而「破壞」了法性？&lt;/p&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;p class=&quot;qa-q&quot;&gt;&lt;strong&gt;本體論探問：&lt;/strong&gt;將無以色性壞法性，乃至一切種智性壞法性耶？&lt;/p&gt;
&lt;p class=&quot;qa-a&quot;&gt;&lt;strong&gt;佛答：&lt;/strong&gt;若&lt;strong&gt;法性外更有法者&lt;/strong&gt;，應壞法性。法性外法不可得，是故不壞。何以故？須菩提！佛及佛弟子知法性外法不可得故，不說法性外有法。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;辯證關鍵&lt;/div&gt;
&lt;p&gt;論文標出此處的核心命題——&lt;strong&gt;解構現象並非消滅實體&lt;/strong&gt;，因為現象從未在法性之外獨立存在過。般若觀照所「解構」的，不是法性本身，而是凡夫對「法性外另有實體法」的虛妄分別。法性與現象是同一張紙的兩面：般若拿掉的是貼在紙上的實有標籤，紙本身完好如初。&lt;/p&gt;
&lt;/div&gt;
&lt;h2&gt;第二節　無 所 學 即 學 一 切 法&lt;/h2&gt;
&lt;p&gt;須菩提乘勢追問：「菩薩摩訶薩若學法性，為無所學？」——既然法性外無法可得，那麼學法性就等於「學無所學」？佛的回答完成第一個翻轉：&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;經文&lt;/span&gt;
菩薩摩訶薩若學法性，&lt;strong&gt;則學一切法&lt;/strong&gt;。何以故？&lt;strong&gt;一切法即是法性&lt;/strong&gt;。
&lt;/div&gt;
&lt;p&gt;緊接著開出底層邏輯：「一切法皆入無相無為性中，以是因緣故，學法性則學一切法。」&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;&lt;strong&gt;表面提問&lt;/strong&gt; · 學法性 = 無所學？&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot; style=&quot;border-left-color:var(--gold);&quot;&gt;&lt;strong&gt;佛答翻轉&lt;/strong&gt; · 學法性 = 學一切法&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;&lt;strong&gt;底層邏輯&lt;/strong&gt; · 一切法皆入無相無為性中——掌握了基底，即掌握了全集&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;這個翻轉的精妙處在於：它不是把「法性」與「一切法」對立起來再二選一，而是顯示&lt;strong&gt;它們本來就是同一個範疇從不同角度的描述&lt;/strong&gt;。「學法性」與「學一切法」是同一件事——前者從本體看，後者從現象看。&lt;/p&gt;
&lt;h2&gt;第三節　須 菩 提 的 終 極 疑 難 · 無 分 別 中 的 分 別 ?&lt;/h2&gt;
&lt;p&gt;但須菩提仍把問題推到極限——他列舉了一個極長的清單，幾乎涵蓋整個菩薩道修學內容：&lt;/p&gt;
&lt;div class=&quot;three-col&quot;&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;六 度 · 定 慧&lt;/div&gt;
&lt;p style=&quot;font-size:17px;line-height:1.85;&quot;&gt;六波羅蜜&lt;br/&gt;四禪、四無量心、四無色定&lt;br/&gt;四念處、四正勤、四如意足&lt;br/&gt;五根、五力、七覺分、八聖道分&lt;br/&gt;空、無相、無作三解脫門&lt;br/&gt;八背捨、九次第定&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;果 位 · 神 通&lt;/div&gt;
&lt;p style=&quot;font-size:17px;line-height:1.85;&quot;&gt;佛十力、四無所畏&lt;br/&gt;四無礙智、十八不共法&lt;br/&gt;六神通&lt;br/&gt;三十二相、八十隨形好&lt;br/&gt;聲聞地、辟支佛地、菩薩法位&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;事 業 · 階 位&lt;/div&gt;
&lt;p style=&quot;font-size:17px;line-height:1.85;&quot;&gt;初發意地至第十地&lt;br/&gt;生剎利大姓、婆羅門大姓&lt;br/&gt;生四天王天乃至非想非非想&lt;br/&gt;淨佛國土、成就眾生&lt;br/&gt;諸陀羅尼、樂說法&lt;br/&gt;阿耨多羅三藐三菩提&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;classical-text&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;須菩提終極疑難&lt;/span&gt;
世尊！諸法法性中無是分別！世尊！&lt;strong&gt;將無菩薩墮非道中&lt;/strong&gt;？何以故？世尊！法性中無如是分別。法性中無色，無受、想、行、識，諸法性亦不遠離色、受、想、行、識；&lt;strong&gt;色即是法性，法性即是色&lt;/strong&gt;；受、想、行、識亦爾，一切法亦如是。
&lt;/div&gt;
&lt;p&gt;這個疑難代表了學者面對「空有之爭」時的核心難題：若法性中無如是分別，菩薩立此分別豈不墮入非道？論文標示為「&lt;strong&gt;本體無分別 vs 現象有分別&lt;/strong&gt;」的張力——須菩提自己也意識到，「色即是法性，法性即是色」似乎是化解這個張力的鑰匙，但他需要佛的明確肯認。&lt;/p&gt;
&lt;h2&gt;第四節　中 觀 大 總 結 · 色 即 是 法 性&lt;/h2&gt;
&lt;p&gt;佛的回答給出了中觀的大總結——&lt;strong&gt;絕對不二&lt;/strong&gt;：&lt;/p&gt;
&lt;div class=&quot;verse&quot;&gt;如是！如是！如汝所言：&lt;br/&gt;「色即是法性，受、想、行、識即是法性。」&lt;/div&gt;
&lt;p&gt;佛先肯認須菩提自己的命題，然後給出實踐指引：&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col-card&quot; style=&quot;border-left:4px solid var(--gold);background:#fff8e8;&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;絕 對 不 二&lt;/div&gt;
&lt;p&gt;法性中無色……諸法性亦不遠離色；色即是法性，法性即是色。&lt;small&gt;本體論的最終定位：法性與現象不一不異。&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot; style=&quot;border-left:4px solid var(--accent);&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;實 踐 指 引&lt;/div&gt;
&lt;p&gt;知一切法即是法性已，&lt;strong&gt;以無名相之法，以名相說&lt;/strong&gt;。&lt;small&gt;方法論的最終定位：菩薩不廢名相，因為名相本當即是法性。&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;「以無名相之法，以名相說」——這句話是中觀方法論的精髓。&lt;strong&gt;「無名相」是體，「以名相說」是用&lt;/strong&gt;。菩薩不立名相為實有，但也不廢名相不用；正因深知名相當體即是法性，菩薩才能毫無顧慮地以名相說色、說受想行識，乃至說阿耨多羅三藐三菩提。&lt;/p&gt;
&lt;h2&gt;第五節　工 幻 師 譬 喻 · 無 智 與 有 智 之 別&lt;/h2&gt;
&lt;p&gt;佛以全品最壯觀的譬喻——&lt;strong&gt;工幻師&lt;/strong&gt;——作大總結。幻師於眾人前幻作種種形色：男女、象馬、園林、廬館、流泉、浴池，乃至幻作人「令布施、持戒、忍辱、精進、禪定、修智慧」，幻作四王天、忉利天乃至非想非非想天，幻作四果聖人。對應菩薩從初發意行六度乃至成就佛三十二相、八十隨形好。&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;譬喻&lt;/span&gt;
譬如工幻師若幻師弟子，多人處立，幻作種種形色：男、女，象、馬，端嚴園林……作眾伎樂，以樂眾人。又復幻作人，令布施、持戒、忍辱、精進、禪定、修智慧。&lt;br/&gt;……菩薩摩訶薩從初發意行檀波羅蜜……行初地乃至行十地，入菩薩位，遊戲神通，成就眾生，淨佛國土，遊戲諸禪、解脫、三昧，行佛十力、四無所畏、四無礙智、十八不共法、大慈大悲，具足佛身三十二相、八十隨形好，以示眾人。
&lt;/div&gt;
&lt;p&gt;對於同一場幻作景象，&lt;strong&gt;有兩種觀者&lt;/strong&gt;，反映兩種視角：&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col-card&quot; style=&quot;border-left:4px solid #6B5B4B;&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;無 智 之 人 · 世 俗 視 角&lt;/div&gt;
&lt;p&gt;歎：「未曾有！是人多能，巧為眾事，娛樂眾人，種種形色，乃至三十二相、八十隨形好莊嚴佛身。」&lt;small&gt;嘆未曾有，見形色與莊嚴，&lt;strong&gt;以為實有眾事&lt;/strong&gt;。&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col-card&quot; style=&quot;border-left:4px solid var(--gold);background:#fff8e8;&quot;&gt;
&lt;div class=&quot;col-head&quot;&gt;有 智 之 士 · 般 若 視 角&lt;/div&gt;
&lt;p&gt;思惟言：「未曾有也！是中無有實事，而以無所有法娛樂眾人，令有形相，無事事相，無有有相。」&lt;small&gt;知無有實事，&lt;strong&gt;以無所有法娛樂眾人，令有形相&lt;/strong&gt;。&lt;/small&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;同一場幻作，兩種人皆說「未曾有！」——但驚歎的內容截然不同。無智之人驚歎於「能力之巧」，有智之士驚歎於「無實事而能令有形相」。&lt;strong&gt;菩薩道的真實樣貌，唯有有智之士能見&lt;/strong&gt;——它的偉大不在於「實有的眾事」，而在於「以無所有法娛樂眾人」。&lt;/p&gt;
&lt;h2&gt;第六節　終 極 結 論 · 法 性 無 異 故 能 成 就 眾 生&lt;/h2&gt;
&lt;p&gt;本品的辯證螺旋至此完全收束。佛開出最終命題：&lt;/p&gt;
&lt;div class=&quot;classical-text&quot;&gt;&lt;span class=&quot;text-label&quot;&gt;總 結&lt;/span&gt;
如是，須菩提！菩薩摩訶薩&lt;strong&gt;不見離法性有法&lt;/strong&gt;，行般若波羅蜜，&lt;strong&gt;以方便力故，雖不得眾生，而自布施，亦教人布施&lt;/strong&gt;……自行十善，亦教人行十善……自行四念處乃至八聖道分，自行三解脫門……乃至自行十八不共法，亦教他人行。
&lt;/div&gt;
&lt;div class=&quot;verse&quot;&gt;須菩提！若法性前、後、中有異者，是菩薩摩訶薩不能以方便力示法性、成就眾生。&lt;br/&gt;&lt;strong&gt;須菩提！以法性前、後、中無異，是故是菩薩行般若波羅蜜，為利益眾生故，行菩薩道。&lt;/strong&gt;&lt;/div&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-box&quot; style=&quot;border-left-color:var(--accent);&quot;&gt;&lt;strong&gt;反 證&lt;/strong&gt; · 若法性前後中有異者，菩薩不能以方便力示法性、成就眾生&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-box&quot; style=&quot;border-left-color:var(--gold);background:#fff8e8;&quot;&gt;&lt;strong&gt;正 論&lt;/strong&gt; · 以法性前後中無異，是故是菩薩行般若波羅蜜，為利益眾生故，行菩薩道&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;&lt;div class=&quot;insight-title&quot;&gt;全 品 辯 證 螺 旋 全 景&lt;/div&gt;
&lt;p style=&quot;font-size:19px;line-height:2;&quot;&gt;
&lt;strong&gt;第一階 · 破立之初&lt;/strong&gt;——化人隱喻奠定認識論基底，菩薩善達諸法相非取得新知，而是徹底懸置自性實有。&lt;br/&gt;
&lt;strong&gt;第二階 · 慈悲悖論&lt;/strong&gt;——萬法如化下菩薩何故行六度？答：建立在「知 / 不知」的認知不對稱性上，拔除眾生因不知而起的虛妄苦。&lt;br/&gt;
&lt;strong&gt;第三階 · 空性賦能&lt;/strong&gt;——無相反而是六度具足的充要條件；諸法若實有，菩薩反不能行；一切善法皆入空、無相、無作三解脫門。&lt;br/&gt;
&lt;strong&gt;第四階 · 微觀解構&lt;/strong&gt;——以三重維度（相·生滅·如）逐一觀照五蘊到十二因緣；五蘊五譬喻；如是萬法的不變不異基礎。&lt;br/&gt;
&lt;strong&gt;第五階 · 終極不二&lt;/strong&gt;——色即是法性，以無名相之法以名相說；工幻師譬喻收束；以法性前後中無異，故菩薩行般若、為利益眾生故行菩薩道。
&lt;/p&gt;
&lt;/div&gt;
&lt;p style=&quot;text-align:center;color:var(--gold);font-weight:600;font-size:22px;margin-top:30px;letter-spacing:3px;&quot;&gt;— 善 達 諸 法 相 · 圓 滿 —&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

.chapter{margin:0;padding:0;}

  color:var(--goldL);letter-spacing:6px;margin-bottom:14px;font-weight:500;}
.ch-name{font-family:&quot;Noto Serif TC&quot;,serif;font-weight:700;

.ch-body{max-width:980px;margin:0 auto;padding:48px 40px 56px;

/* Headings inside ch-body */
.ch-body h2{font-family:&quot;Noto Serif TC&quot;,serif;font-weight:700;
  font-size:24px;color:var(--accent);
  margin:32px 0 14px;padding:10px 0 10px 20px;

.ch-body h3{font-family:&quot;Noto Serif TC&quot;,serif;font-weight:600;

  margin:24px 0 10px;padding-bottom:6px;

.ch-body h4{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-weight:600;

.ch-body h5{font-family:&quot;Noto Sans TC&quot;,sans-serif;font-weight:700;
  font-size:15.5px;color:var(--accent);margin:0 0 10px;letter-spacing:.5px;}

/* Bold/strong red emphasis */
.ch-body strong,.ch-body b{color:var(--accent-red);font-weight:700;}

/* Card / commentary / insight / metaphor / note */
.card,.commentary,.insight,.metaphor,.note{

.insight{border-left:5px solid var(--gold);

.commentary{border-left:5px solid var(--accentL);}

  background:linear-gradient(135deg,#fffdf7,#fbf1e8);}

/* Classical text */
.classical-text{background:#FFFDF5;border:1px solid #E8E0D0;
  border-radius:10px;padding:18px 24px;margin:18px 0;

.classical-text p{margin:0 0 12px;line-height:1.95;color:var(--text);text-indent:2em;}
.classical-text p:last-child{margin-bottom:0;}
.text-label{display:inline-block;

.qa{margin:14px 0;}

.qa .a{padding:8px 16px;color:var(--text);}

/* Verse */
.verse,.gatha{background:var(--verseBg);

  text-align:center;font-family:&quot;Noto Serif TC&quot;,serif;
  line-height:2.1;font-size:18px;color:var(--text);
  border-radius:6px;letter-spacing:2px;}

/* Two-col / four-grid / three-col */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0;}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0;}
.two-col .col,.three-col .col{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:16px 20px;}
.four-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;}
.four-grid .cell{background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:14px 18px;}
.four-grid .cell h5{margin:0 0 8px;color:var(--accent);}
.four-grid .cell p{margin:0;font-size:15px;line-height:1.75;}

/* Compare table */
.compare-table{width:100%;border-collapse:collapse;

  border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.compare-table th{background:var(--accent);color:#fff;
  padding:12px 16px;font-family:&quot;Noto Sans TC&quot;,sans-serif;
  font-weight:600;letter-spacing:1.5px;font-size:14.5px;}
.compare-table td{padding:12px 16px;border-top:1px solid var(--border-light);

.compare-table tr:nth-child(even) td{background:rgba(184,134,11,.05);}

/* Flow */
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;

.flow.flow-v{flex-direction:column;align-items:stretch;}
.flow-box,.flow-step{background:#fff;border:1.5px solid var(--gold);
  border-radius:8px;padding:12px 18px;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14.5px;
  text-align:center;color:var(--text);
  min-width:180px;max-width:680px;margin:0 auto;}
.flow-step{display:block;}
.flow-arrow{color:var(--gold);font-size:22px;font-weight:700;
  text-align:center;}
.flow-step small,.flow-box small{display:block;font-size:12.5px;
  color:var(--text-muted);margin-top:4px;}

/* Domino */
.domino-chain{display:flex;flex-wrap:wrap;align-items:center;
  justify-content:center;gap:6px;margin:16px 0;padding:16px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;}
.domino{background:linear-gradient(135deg,#fff,#f8efd9);
  border:1.5px solid var(--gold);

  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:14px;
  min-width:120px;}
.domino small{display:block;font-size:11.5px;color:var(--text-muted);margin-top:4px;}
.chain-arrow{color:var(--accent-red);font-size:22px;font-weight:700;}

/* List inside .ch-body */
.ch-body ul,.ch-body ol{margin:8px 0 14px 28px;}
.ch-body ul li,.ch-body ol li{margin:6px 0;line-height:1.85;}

/* Next link */
.next-link{display:inline-block;margin-top:30px;
  padding:10px 24px;
  background:linear-gradient(135deg,var(--gold),var(--goldL));
  color:#fff;font-family:&quot;Noto Sans TC&quot;,sans-serif;
  font-size:14.5px;letter-spacing:2px;
  border-radius:24px;text-decoration:none;
  box-shadow:0 4px 12px rgba(184,134,11,.3);
  transition:all .25s;}
.next-link:hover{transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(184,134,11,.4);}

/* Site footer */
.site-footer{background:var(--sbBg);color:rgba(212,196,168,.7);
  text-align:center;padding:34px 24px 28px;
  font-family:&quot;Noto Sans TC&quot;,sans-serif;font-size:13.5px;
  letter-spacing:2px;line-height:1.95;}
.site-footer a{color:var(--gold);text-decoration:none;}

/* Back to top */
#backTop{position:fixed;right:24px;bottom:84px;
  width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
  background:var(--gold);color:#fff;font-size:18px;
  box-shadow:0 4px 14px rgba(184,134,11,.3);
  display:none;z-index:80;transition:all .25s;}

/* Responsive */
@media (max-width:900px){

&lt;div class=&quot;preface&quot;&gt;
&lt;h2 class=&quot;preface-title&quot;&gt;編者前言&lt;/h2&gt;
&lt;p&gt;本品釋《摩訶般若波羅蜜經》「善達諸法相」一品，是龍樹菩薩在《大智度論》卷八十九中為大乘行者展示「畢竟空中起大悲」之中觀邏輯的關鍵章節。整個品次以須菩提的六重叩問為骨幹，由「動機論」起、經「化人喻」轉、入「微塵之破」與「名相之破」之雙重解構、登「終極辯論」之歸謬法、收於「中觀統攝」與「大悲大願」之雙運。&lt;/p&gt;
&lt;p&gt;本份閱讀網頁將原典問答與龍樹的論證邏輯視覺化，使讀者能同時掌握經文文脈與中觀辯證的內部結構。其中第二章「微塵之破」展示了中觀對物質基礎主義的徹底解構，第三章「名相之破」則把鏡頭轉到認知世界，第四章「終極辯論」以「毫釐許」之檢驗線堅守第一真實——這三章合在一起，構成大乘空義不可動搖的基石。&lt;/p&gt;
&lt;p&gt;第五章與第六章則回到大乘菩薩道：在徹底破實有的同時，「無相故自具足善法」、「以無名相之法，以名相說」——空為基石、悲為事業，這就是《釋善達品》要交給讀者的中觀十字總持。&lt;/p&gt;
&lt;/div&gt;

&lt;section class=&quot;chapter&quot; id=&quot;chapter-1&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第四品 · 第一章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;經論定位 · 序分動機與化人喻&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;文本定位 · 犢子飲乳 · 化人運作機制&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;h2 id=&quot;s1-1&quot;&gt;第一節　文本定位與核心叩問&lt;/h2&gt;
&lt;p&gt;本品出自《大智度論》卷八十九，原題為「釋善達品第七十九」，是龍樹菩薩疏解《摩訶般若波羅蜜經》中「善達諸法相」一品的論文。經中由須菩提向佛重複叩問「云何菩薩通達諸法實相」，全品環繞此一核心展開，整篇結構由六重問答接續推進，從動機論進入化人喻，再轉入微塵之破、名相之破，最終以「無相故自具足善法」作結。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h5&gt;核心叩問&lt;/h5&gt;
&lt;p&gt;菩薩如何於「一切法畢竟空、皆如幻化」之實相之中，仍然能展開「行六波羅蜜、淨佛國土、教化眾生」之莊嚴事業？此問題若不能回答，整個大乘菩薩道便面臨基礎崩塌的危機；若能回答，便等於同時破除「實有見」與「斷滅見」兩端，成立中觀正見。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s1-2&quot;&gt;第二節　須菩提重問的動機論：犢子飲乳喻&lt;/h2&gt;
&lt;p&gt;《大智度論》於品中先設一問——「佛品品中已說『通達諸法相』，今須菩提何以更問？」龍樹以兩重理由作答，將須菩提之重問轉化為論證大乘修學階位差異的學術範例。&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;h5&gt;第一重 · 法義無窮&lt;/h5&gt;
&lt;p&gt;「般若波羅蜜無一定相，無言說故，雖數聞猶未足」——般若是離一切名相的勝義智，無法以有限的語言文字一次窮盡。故雖已聽聞，仍須再問。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;h5&gt;第二重 · 階位差異&lt;/h5&gt;
&lt;p&gt;「唯佛一切智能通達諸法實相，餘人雖達，不能究盡」——只有佛能徹見實相，菩薩雖見而未盡，故須持續探究。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;metaphor&quot;&gt;
&lt;h5&gt;犢子飲乳喻 · 學術轉譯&lt;/h5&gt;
&lt;p&gt;論主以「犢子雖大，善母美乳，飲猶不止」為譬：佛喻為「善母」、般若波羅蜜喻為「美乳」、須菩提喻為「犢子」。犢子已飽，仍持續吸吮，並非腹饑而是樂味無厭——這正是&lt;strong&gt;大乘行者「於甚深法持續探問」的修學姿態&lt;/strong&gt;，是對「已知」的持續再問、對「已得」的持續再參，是學術級的「問題意識」原型。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s1-3&quot;&gt;第三節　大智度論原典 · 通達諸法相問答&lt;/h2&gt;
&lt;div class=&quot;text-label&quot;&gt;原典&lt;/div&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;div class=&quot;q&quot;&gt;問曰：佛品品中說「通達諸法相」，今須菩提何以更問？&lt;/div&gt;
&lt;div class=&quot;a&quot;&gt;答曰：是般若波羅蜜無一定相，無言說故，雖數聞猶未足，是故更問。譬如犢子雖大，善母美乳，飲猶不止；佛大慈悲，猶如善母，般若波羅蜜如美乳，須菩提如犢子，雖數聞諸法相，猶未厭足。&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;復次，唯佛一切智能通達諸法實相，餘人雖達，不能究盡，是故問。餘菩薩未作佛，云何能通達？&lt;/p&gt;
&lt;p&gt;佛以譬喻答：如幻化人，無三毒、諸煩惱結使，無心、心數法，內外、有漏無漏法中所不攝，不墮凡夫法，亦不墮聖果中，不得言是須陀洹等；亦能發他心善惡，所為變化事，必能令成就。此變化，其實不垢不淨，六道所不攝。菩薩身亦如是，無三毒等煩惱，知是心、心數法皆是先世虛誑顛倒法因緣生故，不信、不隨逐。能如是行，是為善通達諸法相。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s1-4&quot;&gt;第四節　若一切如化，菩薩何為？&lt;/h2&gt;
&lt;p&gt;須菩提乘勢追問：「若一切法畢竟空、皆如化，佛何以種種讚菩薩功德——因菩薩故斷三惡道、能拔出眾生令得涅槃？」此問與全品序分動機論直接呼應，把「實踐悖論」逼到表面。&lt;/p&gt;
&lt;p&gt;佛反問須菩提：「於汝意云何？菩薩本行菩薩道時，見定有眾生從五道中拔出不？」須菩提答：「無也！」這一答既是事實的承認，也是中觀辯證的關鍵：&lt;strong&gt;若無一個實有的眾生「從五道被拔出」，則菩薩的功德也無一個實有的「能拔出者」&lt;/strong&gt;——能、所同空，但事業不廢。&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;菩薩得無生法忍&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;知見一切法如幻、如化&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;不見定有眾生從五道得解脫&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;能、所雙泯&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;仍行六波羅蜜、淨佛國土、教化眾生&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;於畢竟空中起大悲行&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s1-5&quot;&gt;第五節　「化人」的五重運作機制&lt;/h2&gt;
&lt;p&gt;佛以「幻化人」為譬，說明菩薩之所以能在「無實有眾生可度」的前提下持續度眾，正因菩薩的存在模式類於化人。化人具備五重特徵：&lt;/p&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;h5&gt;① 無煩惱結使&lt;/h5&gt;&lt;p&gt;無三毒、無諸煩惱結使，不信、不隨逐顛倒因緣。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;h5&gt;② 無心數法&lt;/h5&gt;&lt;p&gt;無心、心數法，亦非有漏無漏所攝，不取一切法相。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;h5&gt;③ 超脫範疇&lt;/h5&gt;&lt;p&gt;不墮凡夫法，亦不墮聖果中，非有亦非無，於四句外。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;h5&gt;④ 能發他心&lt;/h5&gt;&lt;p&gt;能發他心善惡，所為變化事必能令成就。事用宛然不爽。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;第五重 · 結論&lt;/h5&gt;
&lt;p&gt;菩薩身如化人——&lt;strong&gt;無心而能成就佛事，無染而能徹盡實相&lt;/strong&gt;。「無實有的能度者、亦無實有的所度者，但化人度化人之事業歷然不昧」，這就是大乘菩薩道的存在邏輯。化人喻不是文學修飾，而是龍樹給出的「中觀存在論」標準模型。&lt;/p&gt;
&lt;/div&gt;
&lt;a class=&quot;next-link&quot; href=&quot;#chapter-2&quot;&gt;前往 第二章 · 微塵之破 →&lt;/a&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-2&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第四品 · 第二章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;微塵之破 · 物質世界的徹底解構&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;基礎主義之實有 · 空間悖論之反證 · 名字假名之安立&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;p&gt;須菩提之問引出菩薩行的存在論基礎之後，論主進一步把矛頭轉向「物質世界本身的實有性」。如果物質有一個不可再分的最小單位（微塵 / paramāṇu）作為基礎，則「一切法如化」之說便無法成立——因為至少還有「微塵」這一實有定法。本章即龍樹對此實有論的徹底破除。&lt;/p&gt;
&lt;h2 id=&quot;s2-1&quot;&gt;第一節　大智度論原典 · 微塵問答&lt;/h2&gt;
&lt;div class=&quot;text-label&quot;&gt;原典&lt;/div&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;佛答：「眾生但住名相虛誑憶想分別中。」&lt;/p&gt;
&lt;p&gt;佛意：一切法中無決定實者，但凡夫虛誑故著。如人闇中見似人物，謂是實人，而生畏怖；又如惡狗臨井，自吠其影，水中無狗，但有其相，而生惡心，投井而死。眾生亦如是，四大和合故名為身，因緣生識，和合故動作、言語；凡夫人於中起人相，生愛、生恚，起罪業，墮三惡道。&lt;/p&gt;
&lt;p&gt;菩薩行般若波羅蜜時，憐愍眾生，種種因緣教化，令知空法而拔出之；作是言：「是法皆畢竟空、無所有，眾生顛倒虛妄故，見似如有，如化、如幻、如乾闥婆城，無有實事，但誑惑人眼。」&lt;/p&gt;
&lt;p&gt;復次，一切法但從名字和合，更有餘名。如頭、足、腹、脊和合故，假名為身；如髮、眼、耳、鼻、口、皮、骨和合故，假名為頭；諸毛和合故，名為髮；分分和合故，假名為毛；諸微塵和合故，名為毛分；亦和合諸分故，名為微塵。&lt;/p&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;div class=&quot;q&quot;&gt;問曰：微塵第一微細故不得作分，無分故無和合，此則定法，是故不得言「一切空，無有定法」！&lt;/div&gt;
&lt;div class=&quot;a&quot;&gt;答曰：若微塵是色，則應有分。何以故？一切色皆在虛空中，皆有十方。若微塵是色，則有十分；若有十分，云何是極微？若如汝說微塵無分者，則非色。何以故？出色相故。&lt;br/&gt;又復色名五情可得，若微塵非五情所得者，云何得知是色？是故微塵但有虛名。眼見麁色，尚可破令空，何況不可見、不可觸！&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;div class=&quot;q&quot;&gt;問曰：微塵細故，五情所不能得，聖人得天眼則見。&lt;/div&gt;
&lt;div class=&quot;a&quot;&gt;答曰：天眼見雖細，是色相故，應當有分；若無分則非色，非色則天眼不見。以是故，天眼亦虛誑妄見；是故聖人以慧眼觀世間，則得道。&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;微塵，如先說，但有名無實。微塵無故，一切法名字和合故更有假名，無有實定，而眾生妄生貪著；貪欲、瞋恚因緣故，起惡業，無量阿僧祇劫在三惡道受苦。若諸法實定，尚不應作貪欲、瞋恚罪因緣，何況虛誑無實！若能捨虛誑名相、不著空法者，則受涅槃常樂。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s2-2&quot;&gt;第二節　論敵立論：基礎主義的實有&lt;/h2&gt;
&lt;p&gt;論敵——可指部派佛教中的有部、亦可泛指一切「物理基礎主義」者——立論：「微塵第一微細故不得作分，無分故無和合，此則定法。」&lt;/p&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;h5&gt;論敵主張的學術轉譯&lt;/h5&gt;
&lt;p&gt;世界必須有一個不可再分割的基礎物質單位（極微 / Paramāṇu）。其特徵為：① &lt;strong&gt;最小&lt;/strong&gt;——已至物質下限；② &lt;strong&gt;無方分&lt;/strong&gt;——不再具有空間延展性；③ &lt;strong&gt;實有定法&lt;/strong&gt;——是物理世界的「基底實在」。一旦承認此基底，「一切法空」之說即被挑戰。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s2-3&quot;&gt;第三節　空間悖論的反證&lt;/h2&gt;
&lt;p&gt;龍樹的反證走「假設—引出矛盾—結論」三段式，極為精采：&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;① 前提&lt;/strong&gt;：若微塵是色（物質）&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;② 空間廣延性&lt;/strong&gt;：必在虛空中、必然具有十方（六個接觸面）&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;③ 矛盾爆發&lt;/strong&gt;：只要有接觸面，即有「方分」（可分割的部分）&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;④ 結論&lt;/strong&gt;：若有方分，則非極微&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;論證骨幹&lt;/h5&gt;
&lt;p&gt;龍樹的關鍵洞見：&lt;strong&gt;「色」與「方分」不可分離&lt;/strong&gt;。任何被稱為「色」（物質）的東西必然佔據空間，佔據空間必然有上下左右前後六方，有六方必然有「分」。「無方分的色」是邏輯上的自相矛盾。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s2-4&quot;&gt;第四節　反證法 · 無分則非色&lt;/h2&gt;
&lt;p&gt;論敵若退守、堅稱微塵「無分」（完全無空間向度），龍樹立即反向擊潰：&lt;/p&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;h5&gt;① 零體積問題&lt;/h5&gt;&lt;p&gt;無方分即等同零體積。零體積的聚合依然是零，無法構成任何「色」。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;h5&gt;② 五情不可得&lt;/h5&gt;&lt;p&gt;無方分則無法被五情（感官）所得。出色相故，則非色法。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;h5&gt;③ 無法和合&lt;/h5&gt;&lt;p&gt;無方分則無接觸面，無法與其他微塵「和合」。基礎崩塌。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;h5&gt;④ 唯是虛名&lt;/h5&gt;&lt;p&gt;結論：微塵定相無法成立，「極微」唯是&lt;strong&gt;名相和合&lt;/strong&gt;所安立的虛名。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s2-5&quot;&gt;第五節　天眼與慧眼的維度差別&lt;/h2&gt;
&lt;p&gt;論敵又作最後嘗試：「微塵細故，五情所不能得，聖人得天眼則見。」這是訴諸「世俗極致認知力」來保住微塵實有。龍樹卻指出：天眼仍屬「世俗極致」，與慧眼（勝義徹見）有根本差別。&lt;/p&gt;
&lt;table class=&quot;compare-table&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;對比向度&lt;/th&gt;&lt;th&gt;天眼（世俗極致）&lt;/th&gt;&lt;th&gt;慧眼（勝義徹見）&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;觀測對象&lt;/td&gt;&lt;td&gt;極微、色相 — 仍是有相&lt;/td&gt;&lt;td&gt;無分、非色 — 入無相&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;認知狀態&lt;/td&gt;&lt;td&gt;有方分、名相虛誑&lt;/td&gt;&lt;td&gt;本性畢竟空&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;最終結果&lt;/td&gt;&lt;td&gt;妄見（仍被色相囚困）&lt;/td&gt;&lt;td&gt;得道（契入諸法實相）&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;關鍵分判&lt;/h5&gt;
&lt;p&gt;「天眼見雖細，是色相故，應當有分；若無分則非色，非色則天眼不見」——天眼仍在「色相」的圈內，無法突破名相虛誑。&lt;strong&gt;聖人以慧眼觀世間，則得道&lt;/strong&gt;，慧眼非「看得更細」，而是看到「本來無有可看之物」。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s2-6&quot;&gt;第六節　中觀文獻對讀（《中論》觀一異品 · 觀六情品）&lt;/h2&gt;
&lt;p&gt;本段論證並非孤立。它與《中論》兩品形成嚴密的學術對接，可進行學派內文獻對讀（Intertextual Analysis）：&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;h5&gt;《大智度論》本品&lt;/h5&gt;
&lt;p&gt;「微塵無故⋯⋯一切法名字和合故更有假名，無有實定。」&lt;br/&gt;&lt;br/&gt;從&lt;strong&gt;物質基底&lt;/strong&gt;切入，破微塵的實有性。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;h5&gt;《中論》觀一異品 · 觀六情品&lt;/h5&gt;
&lt;p&gt;觀一異品破除「整體與部分」的實有關係；觀六情品解構「能見與所見」的絕對獨立性。&lt;br/&gt;&lt;br/&gt;從&lt;strong&gt;關係範疇&lt;/strong&gt;切入，破整體—部分、能—所之自性。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;三品交叉印證後，可得中觀破自性見的&lt;strong&gt;第一基石&lt;/strong&gt;：「微塵亦空」——一切看似最堅硬、最不可分的「基底實在」，皆為名相和合所安立。Svabhāva（自性）見從根上斷除，後續一切「空、無相、無作」的論證便有了堅實的物理學基礎。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s2-7&quot;&gt;第七節　從物理學到倫理學：執著的災難&lt;/h2&gt;
&lt;p&gt;龍樹論證的力量不只在「破實有」的形上層面，更在「破實有」的倫理層面。他指出：眾生因錯認本體（微塵實有 → 身相實有）而生情緒、生罪業、墮三惡道，整個輪迴的「因」就是這個本體論錯誤。&lt;/p&gt;
&lt;div class=&quot;domino-chain&quot;&gt;
&lt;div class=&quot;domino&quot;&gt;錯認本體&lt;br/&gt;&lt;small&gt;身相實有&lt;/small&gt;&lt;/div&gt;
&lt;span class=&quot;chain-arrow&quot;&gt;→&lt;/span&gt;
&lt;div class=&quot;domino&quot;&gt;情緒生起&lt;br/&gt;&lt;small&gt;愛恚分別&lt;/small&gt;&lt;/div&gt;
&lt;span class=&quot;chain-arrow&quot;&gt;→&lt;/span&gt;
&lt;div class=&quot;domino&quot;&gt;起惡罪業&lt;br/&gt;&lt;small&gt;貪瞋因緣&lt;/small&gt;&lt;/div&gt;
&lt;span class=&quot;chain-arrow&quot;&gt;→&lt;/span&gt;
&lt;div class=&quot;domino&quot;&gt;無量劫苦&lt;br/&gt;&lt;small&gt;三惡道&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;p&gt;「若諸法實定，尚不應作貪欲、瞋恚罪因緣，何況虛誑無實！」——若諸法是真實的，至少還有點理由為它們生愛恨；可它們根本是虛誑無實，&lt;strong&gt;為幻影而受苦，實為至極無明&lt;/strong&gt;。物理學的破除，最終要落到倫理學的解放。&lt;/p&gt;
&lt;/div&gt;
&lt;a class=&quot;next-link&quot; href=&quot;#chapter-3&quot;&gt;前往 第三章 · 名相之破 →&lt;/a&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-3&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第四品 · 第三章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;名相之破 · 認知世界的解構&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;名相虛誑 · 惡狗吠井 · 五陰幻喻 · 認知解縛方程式&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;p&gt;第二章從物理層面破微塵實有，本章接續推進至認知層面：眾生「住」於何處？答曰「但住名相虛誑憶想分別中」。本章層層解構名相生成的認知漏斗，並以惡狗吠井、五受陰水沫等譬喻收攝。&lt;/p&gt;
&lt;h2 id=&quot;s3-1&quot;&gt;第一節　大智度論原典 · 名相問答&lt;/h2&gt;
&lt;div class=&quot;text-label&quot;&gt;原典&lt;/div&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;div class=&quot;q&quot;&gt;問曰：名、相有何差別？&lt;/div&gt;
&lt;div class=&quot;a&quot;&gt;答曰：名者，是眾物字，如熱物字為火。相者，如見烟知是火相，熱是火體。&lt;br/&gt;復次，如五眾和合中男、女，是為名；身貌可別男、女，是為相。見是相故，作名字，名為男、女。&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;div class=&quot;q&quot;&gt;問曰：若爾者，名、相無異！所以者何？見相故得名，知名故得相。&lt;/div&gt;
&lt;div class=&quot;a&quot;&gt;答曰：汝不解我所說耶？先見男女貌，然後名為男、女。&lt;strong&gt;相為本，名為末。&lt;/strong&gt;&lt;br/&gt;又復如人眼見色，偏取所好相而生著，於餘人則不然；以其能生染著心，是名為相。&lt;br/&gt;復次，此中佛自說名、相分別：「名者假名，以名取諸法。」如經中廣說。&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s3-2&quot;&gt;第二節　眾生住於名相虛誑憶想中&lt;/h2&gt;
&lt;p&gt;佛答須菩提的存在論定位之問：「眾生但住名相虛誑憶想分別中。」這一句是整個第三章的綱領——眾生不住於任何「實有的處所」，他們僅僅住於由名（label）與相（feature）所交織的認知網層中。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h5&gt;佛陀的破斥&lt;/h5&gt;
&lt;p&gt;須菩提原以為「眾生在何處住而菩薩拔出？」是設想眾生「沒於深泥」、需要「物理性地拔出」。佛陀反答：眾生並未陷入物質的「深泥」，&lt;strong&gt;而是深陷於名相虛誑與憶想分別的認知深淵&lt;/strong&gt;。菩薩的拔濟，因此不是「物理空間的轉移」，而是「認知網層的解構」。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s3-3&quot;&gt;第三節　惡狗吠井：迷相起大悲&lt;/h2&gt;
&lt;p&gt;論主以「惡狗吠井」與「闇中見似人物」兩重隱喻，把「名相虛誑」與「大悲心起」的因果連結說透：&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;h5&gt;迷於相 · Ignorance&lt;/h5&gt;
&lt;p&gt;水中無狗，但有其相。惡狗對著虛假的水中倒影生起愛恚，投井而死。&lt;br/&gt;&lt;br/&gt;眾生亦如是：四大和合假名為身，因緣生識，本無實事；卻於中起人相、生愛恚、造罪業，墮三惡道——猶如惡狗，對著名相之井自吠自溺。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;h5&gt;起大悲 · Compassion&lt;/h5&gt;
&lt;p&gt;菩薩知實相，故興起大悲。如長者之子盲而飲毒，長者見其必死，起種種方便遮令不飲。&lt;br/&gt;&lt;br/&gt;菩薩亦如是：見眾生顛倒無明、盲飲三毒，&lt;strong&gt;於無量阿僧祇劫修六波羅蜜、淨佛國土、教化眾生&lt;/strong&gt;。大悲心非情緒衝動，而是徹見實相之後的必然結果。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s3-4&quot;&gt;第四節　名相生成漏斗：相為本、名為末&lt;/h2&gt;
&lt;p&gt;龍樹此處給出一份學術級的「認知心理學」分析：名相的生成是一個由底向上的漏斗過程，&lt;strong&gt;「相為本，名為末」&lt;/strong&gt;是全節綱領。&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;底層 · 五眾和合&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;無差別的微塵與四大和合&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;中層 · 取所好相&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;視覺/感官捕捉特徵（如：見煙知火）&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;頂層 · 安立假名&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;對特徵命名（如「男」「女」「火」）&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;h5&gt;四步認知過程（從相到著）&lt;/h5&gt;
&lt;ol&gt;
&lt;li&gt;&lt;strong&gt;見相&lt;/strong&gt;（Perception）：眼見五眾和合之色相。&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;取相&lt;/strong&gt;（Preference）：偏取所好相，過濾與聚焦。&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;生著&lt;/strong&gt;（Attachment）：對偏好相生起染著心。&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;安立假名&lt;/strong&gt;（Labeling）：在已染著的相上貼上名字標籤。&lt;/li&gt;
&lt;/ol&gt;
&lt;p&gt;關鍵：能生染著心的是&lt;strong&gt;「相」&lt;/strong&gt;而非「名」；名字只是最後貼上的標籤。所以中觀的解縛方向，是先解相、再解名——對其他人不生染著，正因為「沒取那個相」，與名字無關。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s3-5&quot;&gt;第五節　五受陰的動態解構&lt;/h2&gt;
&lt;p&gt;龍樹此處將「色受想行識」五陰各以一譬，呈現其動態空性，與《雜阿含》「色如聚沫」一系一脈相承：&lt;/p&gt;
&lt;div class=&quot;four-grid&quot;&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;h5&gt;色 · Form&lt;/h5&gt;&lt;p&gt;如水沫（Foam）——一觸即破，本無實質。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;h5&gt;受 · Feeling&lt;/h5&gt;&lt;p&gt;如水泡（Bubble）——一念一滅，剎那不留。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;h5&gt;想 · Perception&lt;/h5&gt;&lt;p&gt;如陽燄（Mirage）——妄生水想，渴鹿狂奔。&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;cell&quot;&gt;&lt;h5&gt;行 · Mental Formations&lt;/h5&gt;&lt;p&gt;如芭蕉（Banana Tree）——層層剝開，內無實心。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-left:5px solid var(--gold);&quot;&gt;
&lt;h5&gt;識 · Consciousness&lt;/h5&gt;
&lt;p&gt;如幻人（Phantom Army）——所現宛然，實無有實。五陰如此，所謂「身」、「心」、「我」皆因緣假合而動態空。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s3-6&quot;&gt;第六節　破執實踐 · 於名字中教令遠離&lt;/h2&gt;
&lt;p&gt;論主把「名相之破」進一步落實為菩薩的具體實踐技術：在世俗名字之中，教化眾生於各層假名「層層解構」。&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;身（Body）&lt;/strong&gt;—— 假名：頭、足、腹、脊和合&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;頭（Head）&lt;/strong&gt;—— 只是髮、眼、耳、鼻、口、皮、骨的假名和合&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;髮（Hair）&lt;/strong&gt;—— 只是諸毛的假名和合&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;毛（Hair-strand）&lt;/strong&gt;—— 只是毛分的假名和合&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;微塵（Atom）&lt;/strong&gt;—— 方分不可得，自性本空&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;認知解縛方程式&lt;/h5&gt;
&lt;p&gt;菩薩行般若波羅蜜，&lt;strong&gt;非以神力轉移眾生物理空間，而是以「方便力」解構其名相認知網層&lt;/strong&gt;。實踐路徑可凝為兩重：&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;① 捨虛誑名&lt;/strong&gt;——不隨假施設起舞。&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;② 了離偏好相&lt;/strong&gt;——不取能生染著之特徵。&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;「此事本末皆無，自性空故，智者所不著」——名為末、相為本、本末皆空，這是中觀對日常生活的徹底重寫。&lt;/p&gt;
&lt;/div&gt;
&lt;a class=&quot;next-link&quot; href=&quot;#chapter-4&quot;&gt;前往 第四章 · 終極辯論 →&lt;/a&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-4&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第四品 · 第四章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;終極辯論 · 實有論的歸謬與第一真實&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;實有災難 · 無相自具 · 毫釐之破 · 第一真實&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;p&gt;名相破除之後，須菩提把問題逼到最尖銳的頂點：「若一切法但有名相，菩薩云何自利、利人？」這一問若不能解答，菩薩道便等於自我取消。本章呈現龍樹以歸謬法給出的兩重對證，並由「毫釐許實有」的最後檢驗收尾。&lt;/p&gt;
&lt;h2 id=&quot;s4-1&quot;&gt;第一節　大智度論原典 · 自利利人問答&lt;/h2&gt;
&lt;div class=&quot;text-label&quot;&gt;原典&lt;/div&gt;
&lt;div class=&quot;classical-text&quot;&gt;
&lt;p&gt;須菩提問：「若一切法但有名相，菩薩云何自利、利人？」&lt;/p&gt;
&lt;p&gt;佛答：「若諸法根本定有，菩薩行般若波羅蜜時，不能自利利人。」&lt;/p&gt;
&lt;p&gt;何以故？若諸法性定實有，即是無生。何以故？以性先定有故。若是法從因緣和合生，即是無定性。若性定有，則不須因緣和合；若爾者，則無生，無生故無滅，無滅故無罪福。以知無常故，則捨罪修福；若常，則無縛解、無世間、無涅槃等。是故佛告須菩提：「若法定有、非但名相者，菩薩不行般若波羅蜜自利、利人，不行禪波羅蜜等自利、利人。&lt;strong&gt;無相故，是菩薩自具足是善法，亦以善法利益眾生，以無相故。&lt;/strong&gt;」&lt;/p&gt;
&lt;p&gt;佛告須菩提：「若諸法當實有如毫釐許，菩薩坐道場時，不能觀一切法空、無相、無所有，得成阿耨多羅三藐三菩提；亦不能以此法利益眾生。」何以故？是菩薩坐道場時，觀一切法第一真實；若小錯，不應得阿耨多羅三藐三菩提。亦不能為眾生說是空無相法。所以者何？法若定有，佛云何誑眾生「一切法無漏、無相、無憶念」？&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s4-2&quot;&gt;第二節　終極叩問：若皆畢竟空，菩薩諸地豈非徒勞？&lt;/h2&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;p&gt;須菩提之終極叩問可作如下學術轉譯：「若現象界皆是假名、本體界唯是畢竟空，&lt;strong&gt;修證諸地、具足善法豈非徒勞&lt;/strong&gt;？菩薩云何以無內容之事自利、以無內容之事利他？」&lt;/p&gt;
&lt;p&gt;這個提問之所以是「終極」的，是因為它把整個大乘體系的合法性押在龍樹的回答上。若答得不好，等於自證「空見」是斷滅見、是虛無主義；答得到位，便能同時破實有見與斷滅見，立穩中道。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s4-3&quot;&gt;第三節　歸謬法 · 諸法定有則修行無立足&lt;/h2&gt;
&lt;p&gt;龍樹採用反證法（reductio ad absurdum）：先假設「諸法根本定有」，然後逐層推演其結論，看是否與佛法的基本前提衝突。&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;① 假設&lt;/strong&gt;：若諸法根本定有（If dharmas inherently exist）&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;② 推論一&lt;/strong&gt;：性先定有，則不須因緣和合（No dependent origination needed）&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;③ 推論二&lt;/strong&gt;：無因緣和合則無生；無生故無滅（Status frozen, no birth or death）&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;④ 推論三&lt;/strong&gt;：無生滅則無罪福（Actions have no consequences）&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;⑤ 結論：實有論的災難&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;無修行、無縛解、無世間、無涅槃；菩薩既不能自利、也不能利他&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;歸謬要旨&lt;/h5&gt;
&lt;p&gt;「以知無常故，則捨罪修福；若常，則無縛解、無世間、無涅槃等」——&lt;strong&gt;整個佛教的修學系統都建立在「諸法無常無自性」的前提上&lt;/strong&gt;。一旦立「定有」，諸地、諸度、諸果全部坍塌；可見「實有見」並非保住菩薩道，反而是徹底取消菩薩道。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s4-4&quot;&gt;第四節　反向論證 · 無定性故緣起 · 無相故自具足&lt;/h2&gt;
&lt;p&gt;歸謬之後，龍樹反向陳述中觀立場：正因諸法&lt;strong&gt;無定性&lt;/strong&gt;，才有緣起生滅；正因&lt;strong&gt;無相&lt;/strong&gt;，菩薩才能自具足善法、亦能教化他人。&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;h5&gt;第一重 · 無定性故緣起生滅&lt;/h5&gt;
&lt;p&gt;「若是法從因緣和合生，即是無定性」——緣起與無自性是同一現象的兩面。承認緣起，便已承認無自性；確認無自性，緣起方能成立。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;h5&gt;第二重 · 無相故自具足諸法&lt;/h5&gt;
&lt;p&gt;「無相故，是菩薩自具足是善法，亦以善法利益眾生」——&lt;strong&gt;無相不是「沒有」，而是「不被任何特定相所限定」&lt;/strong&gt;。正因不被限定，才能無限地具足、無限地利他。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s4-5&quot;&gt;第五節　第一真實的檢驗 · 破除毫釐實有&lt;/h2&gt;
&lt;p&gt;論證的最後一道檢驗線：「若諸法當實有如毫釐許，菩薩坐道場時，不能觀一切法空、無相、無所有，得成阿耨多羅三藐三菩提。」這是龍樹給「第一真實」設定的最高標準——&lt;strong&gt;絲毫不容妥協&lt;/strong&gt;。&lt;/p&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;假設&lt;/strong&gt;：若諸法相當實有如「毫釐許」（A fraction of inherent existence remains）&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;推演一&lt;/strong&gt;：菩薩坐道場時，觀一切法第一真實。若有一毫絲實有未破，即為「小錯」，不應成佛。&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;推演二&lt;/strong&gt;：若法實有，佛說「一切法無漏、無相」即為「誑惑眾生」（Deceit），不應成立。&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;結論&lt;/strong&gt;：反證成立——一切無漏法必須無相、無憶念&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;「毫釐許」之檢驗的意義&lt;/h5&gt;
&lt;p&gt;這條檢驗線的設定極為嚴峻：佛法不允許「99% 空、1% 不空」的妥協式表達。任何「殘餘的實有」都會破壞無漏法的純淨性，並讓佛陀的「一切法無相」之說落入「方便謊言」的指控。&lt;strong&gt;真實是一個不能打折的範疇&lt;/strong&gt;——這是龍樹對「第一真實」最徹底的捍衛。&lt;/p&gt;
&lt;/div&gt;
&lt;a class=&quot;next-link&quot; href=&quot;#chapter-5&quot;&gt;前往 第五章 · 中觀統攝 →&lt;/a&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-5&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第四品 · 第五章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;中觀統攝 · 三解脫門包容萬法&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;空非虛無 · 唯空能立 · 三解脫門統攝一切善法&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;p&gt;第四章的歸謬法已立穩中觀立場：諸法無自性、緣起有、菩薩無相而自具足善法。本章接續推進，呈現中觀如何&lt;strong&gt;不破壞世俗、卻能涵攝勝義&lt;/strong&gt;，並把「無相法」與三解脫門、三十七助道品、四攝法等大乘所有善法系統收攝成一體。&lt;/p&gt;
&lt;h2 id=&quot;s5-1&quot;&gt;第一節　空非虛無，唯空能立&lt;/h2&gt;
&lt;p&gt;本品論證至此，正與《中論》之核心命題「以有空義故，一切法得成」達到學術級別的完美對接。空在中觀體系中絕非虛無主義（nihilism）所說的「沒有」，而是現象界一切因果律與可能性的&lt;strong&gt;先決條件&lt;/strong&gt;。&lt;/p&gt;
&lt;div class=&quot;two-col&quot;&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;h5&gt;空非虛無&lt;/h5&gt;
&lt;p&gt;空不是抹殺現象的虛無主義。若一切法決定空（斷見之空），則菩薩無功夫——因為連「教化的眾生」與「能教化的菩薩」都已被取消。&lt;/p&gt;
&lt;p&gt;論主明白指出：「若眾生自知諸法空、如幻，菩薩則無功夫。⋯⋯諸法非實非空，過諸語言道，畢竟空寂滅相。」&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;col&quot;&gt;
&lt;h5&gt;唯空能立&lt;/h5&gt;
&lt;p&gt;正因為空（無相），才能包容、流轉、並建立一切世出世間法。&lt;strong&gt;無相不是無內容，而是無限可容&lt;/strong&gt;——任何特定相皆是限定，限定即是局限。&lt;/p&gt;
&lt;p&gt;「眾生不知是事故，生吾我心，起惡罪業，受無量苦；是故菩薩知諸法實相，生大悲心。」生大悲心的前提，正是徹見「空亦能立」的勝義圖像。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s5-2&quot;&gt;第二節　三解脫門統攝三十七助道品&lt;/h2&gt;
&lt;p&gt;論主以「無相」為核心，把大乘所有善法系統做總統攝。其關鍵命題：&lt;strong&gt;「菩薩不以餘法為要，一切善法皆入三解脫」&lt;/strong&gt;。因為無相，故能從三十七助道品具足至佛十八不共法。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h5&gt;三解脫門 · 統攝結構&lt;/h5&gt;
&lt;div class=&quot;flow&quot;&gt;
&lt;div class=&quot;flow-box&quot;&gt;&lt;strong&gt;三解脫門&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;空 · 無相 · 無作&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;&lt;strong&gt;三十七助道品&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;四念處 · 四正勤 · 四如意足&lt;br/&gt;五根 · 五力 · 七覺支 · 八正道&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;→&lt;/div&gt;
&lt;div class=&quot;flow-box&quot;&gt;&lt;strong&gt;十八不共法&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;五力 · 四攝法 · 十力 · 四無畏&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;三解脫門並不取消三十七助道品的差別建立，而是&lt;strong&gt;從「無相」這個共同基礎中允許它們各得其位&lt;/strong&gt;。空門對治有相執、無相門對治差別執、無作門對治造作執——三門互相含攝，形成中觀大乘的完整修證藍圖。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s5-3&quot;&gt;第三節　無相法即一切乘的果位&lt;/h2&gt;
&lt;p&gt;論主把「無相」進一步推到三乘之共同基礎：&lt;/p&gt;
&lt;div class=&quot;qa&quot;&gt;
&lt;div class=&quot;q&quot;&gt;佛告須菩提：「無相法與聲聞、辟支佛、菩薩、佛法異不？」&lt;/div&gt;
&lt;div class=&quot;a&quot;&gt;須菩提答：「不也！世尊！」&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;勝義不破壞世俗&lt;/h5&gt;
&lt;p&gt;&lt;strong&gt;無相法即是一切乘的果位&lt;/strong&gt;。最高階的無相（勝義諦）非但不破壞世俗差別（三乘階位），反而成為其共同的基礎與最終歸宿。聲聞、緣覺、菩薩、佛法的階位差異仍然成立，但其「成立的方式」是「以無相為基」——不取相而立相，正是中觀對世俗與勝義雙運的關鍵發明。&lt;/p&gt;
&lt;/div&gt;
&lt;a class=&quot;next-link&quot; href=&quot;#chapter-6&quot;&gt;前往 第六章 · 大悲大願 →&lt;/a&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;chapter&quot; id=&quot;chapter-6&quot;&gt;
&lt;div class=&quot;ch-head&quot;&gt;
&lt;div class=&quot;ch-num&quot;&gt;卷八十九 · 第四品 · 第六章&lt;/div&gt;
&lt;div class=&quot;ch-name&quot;&gt;大悲大願 · 如幻而行的菩薩道&lt;/div&gt;
&lt;div class=&quot;ch-sub&quot;&gt;法性即色 · 如幻教化 · 悲智雙運&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ch-body&quot;&gt;
&lt;p&gt;結合前五章的所有論證，本章把終極實相落實為菩薩道的存在姿態。論主給出的最後一答是：&lt;strong&gt;菩薩於畢竟空中起大悲，以無名相之法，以名相說&lt;/strong&gt;。空不是離開現象界尋找另一個本體，而是即現象界即無相、即無相即現象界。&lt;/p&gt;
&lt;h2 id=&quot;s6-1&quot;&gt;第一節　法性即色 · 色即法性&lt;/h2&gt;
&lt;p&gt;論主以一組嚴格對偶的句式收束：「色即是法性，法性即是色」、「法性中無色，亦不離色」。這不是修辭，而是中觀體系最核心的雙運表述。&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h5&gt;學法性即學一切法&lt;/h5&gt;
&lt;p&gt;「將無以色性壞法性？」——若把現象的差別性（色性）打入法性，會否壞了法性？佛陀的解答：若法性外「更有法者」，應壞法性；事實是&lt;strong&gt;法性外，法不可得&lt;/strong&gt;。菩薩學法性，即是學一切法；不需要離開現象界另尋本體。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;insight&quot;&gt;
&lt;h5&gt;破除二元對立的終極方程式&lt;/h5&gt;
&lt;p&gt;「一切法皆入無相無為性中。若行般若波羅蜜時『法性外見有法者』，則不能求得阿耨多羅三藐三菩提。」&lt;br/&gt;——任何把「現象」與「本體」、「世俗」與「勝義」截然劃分的二元設想，都將菩薩擋在無上正等正覺之外。&lt;strong&gt;不二即是大乘的入門&lt;/strong&gt;。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s6-2&quot;&gt;第二節　如幻教化的最終展現&lt;/h2&gt;
&lt;p&gt;菩薩的事業並未因「一切如幻」而萎縮，反而因為徹見如幻而擴大為三輪同空的大悲行：&lt;/p&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h5&gt;智者之見&lt;/h5&gt;
&lt;p&gt;「是中無有實事，而以無所有法娛樂眾人⋯⋯無實事相，無有有相。」&lt;br/&gt;——智者明見幻無實事，卻以無所有的法來「娛樂」眾人。這個「娛樂」不是輕慢，而是中觀對「無實事而仍有事業」的標準描述。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h5&gt;大乘之行&lt;/h5&gt;
&lt;p&gt;「知一切法即是法性，以無名相之法，以名相說。」&lt;br/&gt;——以無名相之法為體、以名相為用，&lt;strong&gt;體用不二、空有雙運&lt;/strong&gt;。這是般若波羅蜜在實際生活中運轉的最終形式。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; style=&quot;border-left:5px solid var(--accent-red);&quot;&gt;
&lt;h5&gt;悲智雙運的實踐&lt;/h5&gt;
&lt;p&gt;「雖不得眾生（智），而自布施亦教人布施（悲）；自修六行，亦教人修（六度圓滿）。」&lt;br/&gt;——智上不見眾生，悲上不廢度生；不見實有的能度所度，卻歷然興起六度萬行。這就是「&lt;strong&gt;三輪體空&lt;/strong&gt;」的標準呈現：施者空、受者空、所施物空，而布施的事業歷然不昧。&lt;/p&gt;
&lt;/div&gt;
&lt;h2 id=&quot;s6-3&quot;&gt;第三節　結語 · 空為基石、悲智雙運&lt;/h2&gt;
&lt;div class=&quot;commentary&quot;&gt;
&lt;p&gt;本品論主最後給出三層收攝，作為整個釋善達品的終結圖像：&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;flow flow-v&quot;&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;① 如幻而行（Act as an Illusionist）&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;了知一切如幻，仍於名相法中建立教化事業&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;② 破名解縛（Deconstruct Name &amp;amp; Form）&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;以方便力解構眾生之名相認知虛妄漏斗&lt;/small&gt;&lt;/div&gt;
&lt;div class=&quot;flow-arrow&quot;&gt;↓&lt;/div&gt;
&lt;div class=&quot;flow-step&quot;&gt;&lt;strong&gt;③ 空為基石（Emptiness Enables All）&lt;/strong&gt;&lt;br/&gt;&lt;small&gt;以「畢竟空」為基石，展開生生不息的悲智雙運&lt;/small&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;verse&quot;&gt;
      空為體，悲為用&lt;br/&gt;
      無實事，事業歷然&lt;br/&gt;
      不取相，諸法畢入&lt;br/&gt;
      唯空能立，唯悲能行
    &lt;/div&gt;
&lt;div class=&quot;insight&quot; style=&quot;margin-top:30px;&quot;&gt;
&lt;h5&gt;釋善達品的中觀十字總持&lt;/h5&gt;
&lt;p&gt;① 文本動機 · 犢子飲乳，無有厭足；&lt;br/&gt;② 化人運作 · 無心而能成事；&lt;br/&gt;③ 微塵之破 · 物質基底解構；&lt;br/&gt;④ 名相之破 · 認知漏斗解構；&lt;br/&gt;⑤ 終極辯論 · 實有歸謬、毫釐必破；&lt;br/&gt;⑥ 三解脫攝 · 無相含一切；&lt;br/&gt;⑦ 法性即色 · 不二雙運；&lt;br/&gt;⑧ 如幻教化 · 三輪同空。&lt;br/&gt;——八重既互相獨立又彼此貫穿，總持為「&lt;strong&gt;畢竟空中起大悲、無自性處立菩薩&lt;/strong&gt;」十六字心法。&lt;/p&gt;
&lt;/div&gt;
&lt;a class=&quot;next-link&quot; href=&quot;#top&quot;&gt;回到頂部 ↑&lt;/a&gt;
&lt;/div&gt;
&lt;/section&gt;
